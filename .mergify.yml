# Mergify merge queue for the integration branch `dev`.
#
# Mergify reads THIS FILE ONLY FROM THE DEFAULT BRANCH (`main`) — config changes take effect only after they
# reach main (via the dev→staging→main train), not from a PR's base branch. So iterate carefully.
#
# It REPLACES the native GitHub merge queue (the `merge_queue` rule was removed from the Terraform-managed
# `protect-dev` ruleset, infra/github/main.tf). Why: the native queue re-ran required checks via the
# `merge_group` event, where the `merge_group`-only "Provisioning E2E (T1)" job fails on missing auth env and
# wedged EVERY queued PR. Mergify validates each PR on its own branch (no `merge_group`), so that wedge is gone.
#
# Behaviour: every NON-DRAFT PR into `dev` is AUTO-queued (merge_protections_settings.auto_merge_conditions —
# the current replacement for the deprecated `autoqueue`) and SQUASH-merged once the 9 protect-dev required
# checks pass. No `@mergifyio queue`, no `gh pr merge` — just open a non-draft PR; keep WIP as a draft.
#
# ── Why `capabilities-security` is listed here before branch protection requires it ──
# It is a fail-closed security gate, but for a while NOTHING enforced it: absent from all three rulesets
# AND from this file, so a PR that failed it merged anyway. The enforcement lived only in unapplied
# `infra/github` HCL (#1625).
#
# The two halves must be fixed in THIS order. If branch protection required it while this file did not,
# a PR that genuinely FAILS the gate would still satisfy the conditions below, get queued, and then be
# rejected by GitHub at merge time — a stuck queue entry with no visible cause. The reverse (this file
# stricter than branch protection) is harmless: the job is unfiltered, so it always reports.
# So this lands and rides dev→staging→main FIRST; the ruleset apply follows.

queue_rules:
  - name: dev
    # ── WHY batch_size AT ALL ──
    # Unset, Mergify's default is 1: every queued PR gets its OWN full speculative branch and its own
    # 11 required checks. Measured on 2026-09-02 at 14:08 UTC, with 20 PRs open: 25 of 34 active CI
    # runs were speculative merge-queue branches against 9 real PR runs, and 64 speculative branches
    # had been created that day to land 38 merges. Three quarters of the CI budget re-validating the
    # queue one PR at a time is why a green, reviewed, conflict-free PR sat ~50 minutes at the front,
    # and why #3784 was open for seven hours.
    #
    # A batch validates five PRs as ONE tree, so five land per cycle instead of one. It is the same
    # tree the queue would have produced anyway — batching changes how many checks pay for it, not
    # what is checked, and the speculative merge is still what catches lane-vs-lane defects that
    # per-PR CI is blind to (a symbol declared in two PRs, an import of a module another deleted).
    #
    # ── THE COST, STATED ──
    # When a batch FAILS, Mergify splits it to isolate the culprit and re-runs the remainder, so a
    # failure costs more CI than it would have serially. That trade is only worth taking while
    # batches are usually green: on 2026-09-02 every batch observed was green, and the failures that
    # did occur were caught on the PRs' own CI before they were ever queued. If red batches become
    # common, LOWER this number rather than removing it — 5 → 2 keeps most of the win.
    #
    # ── WHERE THIS TAKES EFFECT ──
    # Mergify reads its configuration from the DEFAULT branch (`main`). Merging this to `dev` changes
    # nothing until it rides dev→staging→main, same as the review-thread gate above it.
    batch_size: 5
    # queue_conditions decide which PRs THIS queue accepts — REQUIRED, or a PR can't be assigned to the queue
    # (its absence returned `queue_rule_name: null` before). merge_conditions decide WHEN to merge.
    queue_conditions:
      - base = dev
      - "-draft"
      # UNRESOLVED CODE-REVIEW FINDINGS KEEP A PR OUT OF THE QUEUE (#3498).
      #
      # There is no required human approval here and there should not be — the maintainer is the
      # only person in the repo and cannot approve his own PR. What DOES exist is a second Claude
      # instance that babysits this queue and runs /code-review on every PR, posting findings as
      # INLINE review comments, i.e. GitHub review threads. Five PRs squash-merged with those
      # findings unaddressed (#3433, #3437, #3444, #3477, #3479 — margins of four, fifteen and five
      # minutes), because the required checks were green and nothing else was consulted.
      #
      # `#review-threads-unresolved` is the count of threads GitHub does NOT have marked resolved.
      # It is NOT filtered by author, so the maintainer's own review of his own PR counts — which is
      # the entire mechanism here. It is not cleared by pushing a fix either: a thread whose line
      # has moved becomes `isOutdated` but stays unresolved, so the gate is released only by
      # explicitly resolving the conversation. That is deliberate. It also means the gate binds ONLY
      # on inline review comments — a top-level PR comment creates no thread, so if /code-review
      # ever stops posting inline, this condition silently stops gating.
      #
      # ── WHY queue_conditions AND NOT merge_conditions ──
      # merge_conditions are evaluated on the TEMPORARY MERGE, not on this PR — the same speculative
      # draft the CLA note below describes. That draft is a fresh pull request with no review
      # threads, so the condition would read 0 = 0 and be TRUE FOREVER: a gate that looks installed
      # and gates nothing. And in the event it is not dead, it is worse — an unsatisfied CONDITION
      # is not a FAILED CHECK, so Mergify does not eject the PR; it holds the head of the train
      # pending, indefinitely, with no checks_timeout configured to break it. Dead or wedged, with
      # no third outcome.
      #
      # queue_conditions is the only layer that is both binding on the REAL pull request and
      # continuously re-evaluated: a PR that stops matching is REMOVED from the queue. That is what
      # closes the #3444 case, where the review landed AFTER the PR was already queued —
      # auto_merge_conditions alone only decides whether to enqueue, never to evict. An un-queued PR
      # also holds no train slot, so open findings cannot stall anyone else's merge.
      #
      # ⚠️ THE QUOTES ARE LOAD-BEARING. Unquoted, `- #review-threads-unresolved = 0` is a YAML
      # comment and the list item parses as null.
      - "#review-threads-unresolved = 0"
    merge_conditions:
      # The protect-dev required checks (quoted — names contain `·`, `(`, `)`, `/`).
      # This list, the merge_protections list below and infra/github/variables.tf must agree;
      # scripts/ci/check-required-checks.mjs compares them and fails the PR when they do not (#3180).
      - "check-success=TypeScript (lint · types · test · docs)"
      - "check-success=Go (build · vet · test · lint) (packages/core)"
      - "check-success=Go (build · vet · test · lint) (apps/cli)"
      - "check-success=Go (build · vet · test · lint) (apps/runner)"
      - "check-success=Integration (real Postgres + RLS)"
      - "check-success=Secret scan (gitleaks)"
      - "check-success=Docs prose (Vale · Diátaxis + plain-language)"
      - "check-success=Authz / open-core guards"
      # The fail-closed capabilities/connector/keyless gate that replaced the dropped #982 CODEOWNERS
      # review. Safe to require: the job is UNFILTERED (runs on every PR) and no-op-passes when no
      # relevant path changed, so it always reports and cannot deadlock an unrelated PR.
      # Listed here BEFORE it is required in branch protection, deliberately — see the note at the
      # bottom of this file.
      - "check-success=capabilities-security"
      # THE CHECK WHOSE ABSENCE COST 26 DAYS OF PRODUCTION DEPLOYS (#2606).
      #
      # The console image was only ever built by deploy-console.yml, on a push to MAIN — i.e. AFTER
      # the merge. So a 2026-07-30 cross-app import rode dev → staging → main behind ten green checks
      # and then broke every production deploy until it was found. ci.yml cannot catch it: ci
      # installs the FULL workspace, the image installs `--filter console...`, and the bug exists
      # only in the pruned graph.
      #
      # SAFE to require, and the reason matters because a required check that does not always report
      # WEDGES the queue: validate-console.yml carries no `paths:` filter and no job-level `if:` — it
      # self-gates its STEPS on a dorny/paths-filter, so the job always runs and always reports,
      # passing in seconds when no app path changed. One job, not a matrix, so there is exactly one
      # context to name. (Measured: it reported `pass` in 9s on a PR touching only shell + workflow
      # files.) A plain `check-success=` is therefore correct here — no `or:`/`check-skipped=`
      # wrapper, which would be a dead condition.
      #
      # Listed here BEFORE branch protection requires it, deliberately, for the reason at the bottom
      # of this file: the other order queues a PR that genuinely fails the gate and then has GitHub
      # reject it at merge time, which is a stuck queue entry with no visible cause.
      # infra/github/variables.tf ALREADY names it; that stack has never been applied (#1625's shape,
      # a second time). Applying it is the maintainer's half — see #2606.
      - "check-success=Build console images (no push)"
      # THE CONTRIBUTION GATE, WHICH USED TO BE LEFT OUT OF THIS FILE ON PURPOSE (#3180).
      #
      # The history is worth keeping, because the reason it was excluded was real. #1653 added the
      # old `cla` context here and wedged the whole dev queue: Mergify's conditions gate the
      # SPECULATIVE branch, whose draft PR carries a `mergify[bot]`-authored commit alongside the
      # real ones, so the CLA was evaluated over a commit set including Mergify's own merge.
      # Allowlisting mergify[bot] (#1667) did not reliably clear it either — those drafts kept
      # resolving a STALE cla.yml, logging the pre-fix allowlist long after the fix was on `dev`, so
      # the first run on each new draft failed and ejected the PR.
      #
      # NEITHER HALF OF THAT CAUSE CAN RECUR, and both were fixed structurally rather than by
      # exclusion. cla.yml is now a `pull_request_target` workflow, which by definition resolves the
      # workflow file from the PR's BASE branch — so a speculative draft based on `dev` runs `dev`'s
      # cla.yml and the stale-resolution half is gone by construction. And the gate no longer reads
      # the commit set at all: it keys on `github.event.pull_request.user.login`, with
      # `mergify[bot]` in the trusted list, so Mergify's own commit is not a subject.
      #
      # LEAVING IT OUT IS NOW THE HAZARD, which is the reverse of the 2026 position. It is in
      # `required_status_checks` for protect-dev, protect-dev has NO bypass actors, and Mergify
      # merges through the API like anyone else — so a condition the ruleset requires and this file
      # does not wait for produces a PR that queues, reports nothing red, and is refused at merge
      # time. That is a stuck entry with no visible cause, and it is exactly what the pending
      # `infra/github` apply (#2606) would have triggered.
      #
      # Verified rather than assumed: it reported `pass` in 5s on #3179, an ordinary dev PR.
      - "check-success=contribution-legal"
    # SQUASH matches feature→dev convention (promotions dev→staging→main stay human `--merge`).
    merge_method: squash

# Merge protections: `auto_merge_conditions` below only fires once a merge_protections rule's
# `success_conditions` all pass. Without this block there were no success_conditions to satisfy, so
# auto-merge never triggered (the bug). This rule requires the protect-dev checks on every PR into `dev`,
# and must stay identical to the queue's merge_conditions above — check-required-checks.mjs enforces that.
merge_protections:
  - name: dev required CI
    if:
      - base = dev
    success_conditions:
      - "check-success=TypeScript (lint · types · test · docs)"
      - "check-success=Go (build · vet · test · lint) (packages/core)"
      - "check-success=Go (build · vet · test · lint) (apps/cli)"
      - "check-success=Go (build · vet · test · lint) (apps/runner)"
      - "check-success=Integration (real Postgres + RLS)"
      - "check-success=Secret scan (gitleaks)"
      - "check-success=Docs prose (Vale · Diátaxis + plain-language)"
      - "check-success=Authz / open-core guards"
      - "check-success=capabilities-security"
      # Same check, same reason — see the long note in the dev queue's merge_conditions above.
      - "check-success=Build console images (no push)"
      # Also the same reason: required by protect-dev, so this file has to wait for it or the merge
      # is refused after the queue has already decided. See merge_conditions above.
      - "check-success=contribution-legal"

# Auto-queue: automatically queues + squash-merges a matching PR once the merge_protections
# success_conditions above pass. The current, non-deprecated auto-merge mechanism (no @mergifyio command).
merge_protections_settings:
  auto_merge_conditions:
    - base = dev
    - "-draft"
    # The outer half of the review-thread gate — same condition, same reason, see the long note in
    # queue_conditions above. This one stops the auto-queue being ATTEMPTED on a PR with open
    # findings; queue_conditions is the one that EVICTS a PR whose findings arrive after it was
    # already queued. Both are needed, and check-required-checks.mjs fails the build if the gate is
    # in only one of them — or in merge_conditions/success_conditions, where it is dead.
    - "#review-threads-unresolved = 0"

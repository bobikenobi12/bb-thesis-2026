uniform:
  # ── Alibaba serverless / shard knobs (#1996) ──────────────────────────────────────
  # Single-cloud because the CAPABILITY is, not because alibaba is ahead. min/max capacity is an
  # Aurora Serverless v2 concept: aws wires it as rds_scaling_config, and azure and gcp provision
  # FIXED-SIZE compute with no range to set — that ceiling is already recorded in
  # infra/config-carriage-exclusions.yaml with the provider evidence. Alibaba was the one cloud that
  # could express it and did not, which is why #1996 was debt rather than a ceiling.
  #
  # kvstore_shard_count is the same story on the cache: ApsaraDB exposes shard_count as its own
  # argument, while azure's Managed Redis encodes topology in the SKU.
  - variable: rds_serverless_min_capacity
    reason: Serverless capacity range. Expressible on alibaba (serverless_config) and aws (rds_scaling_config, different name); azure and gcp provision fixed-size compute — see the ceiling in config-carriage-exclusions.yaml.
  - variable: rds_serverless_max_capacity
    reason: Serverless capacity range. Expressible on alibaba (serverless_config) and aws (rds_scaling_config, different name); azure and gcp provision fixed-size compute — see the ceiling in config-carriage-exclusions.yaml.
  - variable: kvstore_shard_count
    reason: ApsaraDB for Redis exposes shard_count as its own argument; azure's Managed Redis encodes topology in the SKU instead, so there is no equivalent knob to add there.

  # ── external-dns identity adoption on GCP (#2811) ─────────────────────────────────
  # Single-cloud because the PERMISSION MODEL is, not because gcp is ahead — this variable exists
  # to work around a GCP-specific constraint the other four do not have.
  #
  # external-dns's Google provider calls managedZones.List(PROJECT) unconditionally before it
  # writes anything, and `dns.managedZones.list` is a project-level permission that
  # `gcloud iam list-testable-permissions` does not offer at managed-zone scope at all. So the
  # per-deploy, zone-scoped identity the template creates everywhere else cannot work on gcp, and
  # the fix is to ADOPT a standing account granted that one permission once, at onboarding.
  #
  # No other cloud needs an adopted identity: aws authenticates external-dns through an IRSA role
  # whose Route 53 grants are already account-scoped, azure through a federated managed identity
  # addressed by an azure.json the deploy path seeds, and hetzner through a Cloud API token. Adding
  # the variable there would be an empty knob with nothing to point it at, not parity.
  - variable: external_dns_service_account_email
    reason: "GCP-only. external-dns needs project-level dns.managedZones.list, which cannot be granted at zone scope, so the identity must be adopted rather than created per deploy (#2811). aws (IRSA role), azure (federated identity + azure.json) and hetzner (API token) have no equivalent constraint and nothing to adopt."

  # ── In-cluster container registry (#2431) ─────────────────────────────────────────
  # Single-cloud because the SITUATION is, not because hetzner is ahead. Hetzner sells no container
  # registry, so a `registry` node there becomes an in-cluster Harbor exposed as a plain-HTTP
  # ClusterIP — and containerd tries HTTPS for any non-localhost host, so the kubelet must be told
  # to trust that host or it cannot pull at all.
  #
  # The other four provision a REAL registry (ECR / Artifact Registry / ACR / CR EE) whose nodes
  # authenticate with their own cloud identity over TLS. There is no host for them to trust and no
  # variable to add: adding one would be an empty knob, not parity.
  #
  # Recorded here rather than on the baseline deliberately. `template_parity.baseline` is a declared
  # ratchet ceiling that may only ever DECREASE (PROGRAMME.md §0), so a genuinely single-cloud
  # variable must never consume a slot on it.
  - variable: incluster_registry_hosts
    reason: Hetzner has no registry product, so its `registry` kind is an in-cluster Harbor the kubelet must be told to trust over plain HTTP (a Talos machine.registries.mirrors entry). The other four provision a real cloud registry their nodes authenticate to over TLS with their own identity — there is no host to trust and no equivalent knob to add.

  # #2004's own switches. Each cloud names its own — there is no shared spelling for "encrypt
  # Secrets in etcd" — so the four are one capability under four names rather than four asymmetries.
  # The capability itself is uniform: every cloud that CAN do it, does, by default.
  # ── Kubernetes Secrets envelope encryption (#2004) — one capability, five answers ──
  # ⚠️ CEILING, recorded here because it has no variable of its own: HETZNER CANNOT DO THIS. Talos
  # holds etcd on self-managed VMs and Hetzner sells no KMS, so there is no managed key service to
  # encrypt with. The other four all encrypt Secrets under a customer-managed key BY DEFAULT — aws
  # through the upstream EKS module (create_kms_key), gcp/azure/alibaba as of #2004.
  #
  # The four names below are one capability spelled four ways, not four asymmetries.
  - variable: eks_kms_key_users
    reason: AWS spelling. The EKS module encrypts Secrets by default (create_kms_key); this names extra IAM principals allowed to use that key.
  - variable: gke_secrets_encryption_enabled
    reason: GCP spelling of the same capability — a Cloud KMS key bound via database_encryption.
  - variable: gke_secrets_encryption_rotation_period
    reason: GCP-only. Cloud KMS rotates on a period; the other providers' key resources express rotation differently or not at all.
  - variable: aks_secrets_encryption_enabled
    reason: Azure spelling of the same capability — a Key Vault key bound via key_management_service.
  - variable: ack_secrets_encryption_enabled
    reason: Alibaba spelling of the same capability — a KMS key bound via encryption_provider_key.

  # ── Keyless app→database identity: GCP needs an input the others do not (#2099) ────
  # ⚠️ CEILING, and the variable exists BECAUSE of it rather than in spite of it. Every cloud does
  # password-free app→database auth; only GCP needs the operator to hand it an identity.
  #
  # roles/cloudsql.client and roles/cloudsql.instanceUser can only be granted at PROJECT scope: a
  # Cloud SQL instance is not IAM-policy-bearing (the Admin API exposes no get/setIamPolicy on
  # instances, and no google_sql_database_instance_iam_member exists in the provider), and Google's
  # own IAM-Conditions recipe narrows to an instance by conditioning a project-level binding — the
  # binding stays project-level. Writing one needs resourcemanager.projects.setIamPolicy, which is
  # owner-equivalent and which the provisioner deliberately does not hold (#300). GCP also has no
  # principal-pattern condition (no aws:PrincipalArn analogue), so the grant cannot be pre-written
  # against a per-deployment identity either. A stable account, granted once by the customer at
  # connect time and adopted here, is the only shape the provider leaves open.
  #
  # AWS and Azure need no counterpart variable: both scope the grant to the individual database —
  # AWS via an IRSA role trusting the cluster OIDC provider with rds-db:connect on the DB resource
  # ARN, Azure via an Entra administrator on the flexible server — so each creates its identity
  # per environment during the apply. There is nothing for the operator to supply.
  - variable: cloud_sql_app_service_account_email
    reason: GCP-only by provider ceiling. Cloud SQL instances carry no IAM policy, so cloudsql.client/instanceUser are project-scoped only and the provisioner (which holds no resourcemanager.projects.setIamPolicy) cannot write them — the account is granted once in the customer's connector bootstrap and adopted. AWS scopes the equivalent to the DB resource ARN via IRSA and Azure via an Entra admin, so neither needs an operator-supplied identity.

  # ── Cluster-admin grants: one capability, per-cloud spellings (#2005) ──────────────────────────
  # Same shape as the Secrets-envelope-encryption group above: each cloud that CAN grant
  # cluster-scoped admin from inside the template names its own knob — aws's eks_cluster_admins and
  # azure's aks_admin_group_object_ids are already recorded (baseline:, #2004) — and
  # ack_cluster_admins is alibaba's. CUSTOMIZABILITY-PARITY.md once called the alibaba binding
  # "granted outside the template via IAM", as if ACK forced it. The pinned aliyun/alicloud 1.286.0
  # provider refutes that: alicloud_cs_kubernetes_permissions is exactly a cluster-admin binding
  # (alibaba/cluster-admins.tf), so the template now wires it — one resource per RAM principal,
  # duplicate uids refused at the variable, because the provider's grant is a REPLACE of the
  # principal's entire ACK permission set, not a merge.
  #
  # gcp and hetzner are not debt: gcp is excluded by two NAMED invariants recorded next to the
  # mechanism in gcp/gke.tf (project IAM needs resourcemanager.projects.setIamPolicy, stripped from
  # the provisioner by #300; in-cluster RBAC is an in-tofu kubernetes_* resource, forbidden by
  # scripts/check-templates-plan-safe.sh because the provider is wired from the cluster's own
  # known-after-apply endpoint), and hetzner has no cloud IAM plane at all (Talos; access is the
  # emitted talosconfig/kubeconfig). Neither has a variable of its own to hang a record on, which is
  # why both ceilings live here as comments rather than as `exclusions:` records — see this file's
  # own note at the top of `exclusions:` about a ceiling with no name to hang on.
  - variable: ack_cluster_admins
    reason: Alibaba's spelling of cluster-scoped admin grants — alicloud_cs_kubernetes_permissions (role_type "cluster", role_name "admin"), REPLACE-not-merge, one resource per RAM uid (alibaba/cluster-admins.tf). AWS (eks_cluster_admins) and Azure (aks_admin_group_object_ids) already carry their own spellings (baseline:, #2004). GCP and Hetzner are genuine ceilings, not debt — see gcp/gke.tf for GCP's two named invariants and CUSTOMIZABILITY-PARITY.md for Hetzner's (no cloud IAM plane).

  # ── The Talos snapshot cache (#3027) ───────────────────────────────────────────────────────────
  # Single-cloud because the WORK is. Hetzner is the only cloud whose template BUILDS a node image:
  # `imager_image` boots a rescue server, writes the Talos raw.xz into it and snapshots the disk,
  # before any cluster exists. EKS, AKS, GKE and ACK are handed a node image by the managed control
  # plane and there is nothing to build, cache, refresh or reclaim — so there is no knob to add on
  # the other four, not a knob that is missing from them.
  #
  # The variable exists because the cached snapshot is a real, billable, deliberately un-sweepable
  # resource in an account shared with prod, and an operator needs three answers from it and not
  # two: reuse it, supersede it (a poisoned entry, invalidated without deleting anything), or opt
  # out entirely and go back to a per-cluster image the run's own teardown reclaims.
  - variable: talos_image_cache
    reason: Hetzner-only by construction — it is the only template that BUILDS a node image (imager_image snapshots a Talos raw.xz before any cluster exists, ~5m and the floor's dominant deadline flake). EKS/AKS/GKE/ACK receive a node image from the managed control plane, so there is nothing for them to cache and no counterpart knob to add. See infra/templates/project/hetzner/README.md § The Talos snapshot cache.

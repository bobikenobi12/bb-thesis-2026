exclusions:
  # EMPTY, and that is a finding rather than an omission.
  #
  # This section is keyed on a VARIABLE NAME, and a per-cloud ceiling is the absence of one. Hetzner
  # cannot envelope-encrypt Kubernetes Secrets — Talos holds etcd on self-managed VMs and Hetzner
  # sells no KMS to bind a key to — but that ceiling has no variable to hang on, precisely because
  # hetzner declares nothing for it. The first attempt to record it here named a variable that
  # exists on no cloud, and the guard rejected the record. Correctly: a record for a phantom
  # variable is exactly the stale-record shape the ratchet refuses.
  #
  # So capability-level ceilings live with their capability group in `uniform:` below, where the
  # per-cloud names that DO exist are listed together. A ceiling keyed on a name nobody declares is
  # unmeasurable, and an unmeasurable record is the thing this whole guard exists to stop.


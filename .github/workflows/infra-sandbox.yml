name: Infra - Sandbox

# The developer sandbox box (infra/sandbox) — validate + lint only.
#
# NO apply job, deliberately, unlike every other infra-*.yml here. This stack is a
# personal dev box created and reaped from a laptop by `pnpm env:box` / `pnpm env:reap`;
# there is no shared state backend for CI to converge (state is local and gitignored),
# and an automated apply would fight the reap cycle. `tofu apply` for this stack is a
# human action, per the repo's IaC rules.

on:
  pull_request:
    paths:
      - 'infra/sandbox/**'
      - '.github/workflows/infra-sandbox.yml'
      - '.github/actions/iac-checks/**'
  push:
    branches: [main]
    paths:
      - 'infra/sandbox/**'

# A superseded run is not evidence about the head of the branch, and while it keeps a runner it is
# denying one to the run that is. `ci.yml` and `addon-render-determinism.yml` have carried this
# since they were written; these seven did not, and the gap only became expensive when the queue
# started landing PRs faster than a run takes to finish.
#
# MEASURED 2026-09-02 19:2xZ, with the dev queue draining: 48 runs queued against 2 in progress,
# and the single largest group was 23 runs headed `dev` — the standing `dev → staging` promotion
# PR #3562, which re-triggers every `pull_request` workflow on EVERY merge into dev. `CI` had
# already cancelled its own superseded runs and showed 1; these seven each showed a full stack.
#
# Scoped to `github.ref`, so this only ever cancels an OLDER run of the SAME workflow on the SAME
# PR or branch — the ordinary "I pushed again" case. It cannot cancel a run for a different ref.
concurrency:
  group: infra-sandbox-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TF_DIR: infra/sandbox
  TOFU_VERSION: "1.10.10"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: OpenTofu Validate (no backend, no secrets)
        working-directory: ${{ env.TF_DIR }}
        run: |
          tofu init -backend=false
          tofu validate

      - name: IaC checks (fmt + tflint + Trivy)
        uses: ./.github/actions/iac-checks
        with:
          working-directory: ${{ env.TF_DIR }}

  # The registry does the port arithmetic that keeps two environments off the same
  # port; it is the piece most likely to be subtly wrong and the most painful to debug
  # over SSH, so its self-test runs here rather than only on the box.
  box-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Shell syntax
        run: |
          for f in scripts/env.sh scripts/dev-doctor.sh scripts/box/*.sh \
                   .claude/hooks/guard-runtime.sh .claude/hooks/session-runtime.sh; do
            bash -n "$f"
          done
      - name: env-registry self-test (allocation, cap, reuse, fail-safe idle)
        run: bash scripts/box/env-registry.sh --self-test
      # `bash -n` above parses seed_decision; it never CALLS it. Without this step the
      # 14-cell matrix — the whole argument for trusting a decision a real env can only
      # exercise a few cells of affordably — runs nowhere, and the next edit that inverts
      # a branch or reorders the two `case` blocks merges green.
      - name: env-mode self-test (the seed/empty/restart decision matrix)
        run: bash scripts/box/env-mode.sh --self-test
      - name: guard-runtime self-test (blocks and, more importantly, allows)
        run: bash .claude/hooks/guard-runtime.sh --self-test

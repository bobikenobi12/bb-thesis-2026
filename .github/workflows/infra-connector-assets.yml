name: Infra - Connector Assets

on:
  pull_request:
    paths:
      - 'infra/connector-assets/**'
      - 'infra/connector/**'
  push:
    branches: [main]
    paths:
      - 'infra/connector-assets/**'
      - 'infra/connector/**'

# A superseded run is not evidence about the head of the branch, and while it keeps a runner it is
# denying one to the run that is. `ci.yml`, `addon-render-determinism.yml` and the four workflows
# fixed on 2026-09-02 carry this; these nine did not.
#
# MEASURED 2026-09-03 over 500 runs / 6h24m: jobs spend 5,376 minutes WAITING for a runner against
# 1,802 executing, and 77 of 500 runs (15 percent) were cancelled — started, took a slot, thrown
# away. The currency is slots REQUESTED, so a superseded run costs the same as a useful one until
# it dies.
#
# `github.ref` and NOT `github.event.pull_request.number || github.ref`: this workflow also fires on
# `push`, where the number renders EMPTY and every push to `main` would collapse into one group,
# cancelling a real deploy-path run. `cla.yml` records that trap; it is PR-only, so it can use the
# number. `github.ref` is distinct for both events here.
concurrency:
  group: infra-connector-assets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TF_DIR: infra/connector-assets
  TOFU_VERSION: "1.10.10"

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: OpenTofu Validate (no backend, no creds)
        working-directory: ${{ env.TF_DIR }}
        # PR plans are validate-only: no backend, no cloud/state creds reach a PR
        # job (the repo is contributor-facing). Real plan+apply run on main.
        run: |
          tofu init -backend=false
          tofu validate

      - name: IaC checks (fmt + tflint + Trivy)
        uses: ./.github/actions/iac-checks
        with:
          working-directory: ${{ env.TF_DIR }}

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # assume the deploy role via GitHub OIDC — no stored AWS keys
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      # Least-privilege deploy role from infra/connector-assets/bootstrap (its ARN is
      # a non-secret Actions variable). Sets AWS_* env for the OpenTofu provider. The
      # bucket lives in eu-west-1; state lives in eu-central-1 (configured below).
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.CONNECTOR_ASSETS_DEPLOYER_ROLE_ARN }}
          aws-region: eu-west-1

      - name: OpenTofu Init
        working-directory: ${{ env.TF_DIR }}
        # AWS S3 backend in the same account — the assumed OIDC deploy role
        # authenticates the backend too, so there are no static state keys.
        run: |
          tofu init -upgrade \
            -backend-config="bucket=alethia-tofu-state-270587882865" \
            -backend-config="key=connector-assets/terraform.tfstate" \
            -backend-config="region=eu-central-1" \
            -backend-config="use_lockfile=true"

      - name: OpenTofu Apply
        working-directory: ${{ env.TF_DIR }}
        run: tofu apply -auto-approve

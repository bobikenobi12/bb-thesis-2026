      # does not gate — otherwise the step is red every night and stops being read. Each sweeper
      # asserts both halves, because either alone is satisfiable by the wrong change.
      # Hermetic — every CLI is stubbed, no credentials, no cloud, no spend.
      - name: Sweeper probe contract (an API that did not answer is not an empty account)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/e2e/lib/sweep-probe.sh --self-test
      - name: Orphan reaper result contract is secret-free and fail-closed (#2465)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/e2e/reaper-result.mjs --self-test
      - name: GCP sweeper four-state verification
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/e2e/gcp-cleanup.sh --self-test
      - name: Azure sweeper four-state verification
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/e2e/azure-cleanup.sh --self-test
      - name: Alibaba sweeper four-state verification
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/e2e/alibaba-cleanup.sh --self-test
      # Which workflows are red, and have been red for a while. The classifier is the load-bearing
      # part: `skipped` must never read as a failure (a gate-off leg is not a broken pipeline), and
      # three runs is the minimum that can distinguish "dead" from "flaked once". Both are asserted.
      # Hermetic — the classifier is pure and the fixtures are the real 2026-08-24 shape.
      - name: Workflow health classifier (skipped is not a failure)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/ci/workflow-health.mjs --self-test
      # How much CI this repo ASKS FOR, and how long it waits to get it (#4173). The load-bearing
      # part is which jobs count as "waiting": a job with `needs:` is created when its DEPENDENCY
      # finishes, so it starts at once and its ~0 wait is not evidence about runner availability.
      # Two earlier definitions of the metric were dominated by exactly that and reported a healthy
      # 0.0 min against a measured 15-minute median — both are pinned here as fixtures, along with
      # the refusals for an empty or untimed sample.
      - name: CI demand classifier (a dependent job's instant start is not spare capacity)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/ci/ci-demand.mjs --self-test
      # A TIMER must never start an unpriced real apply. The weekly `17 5 * * 0` full-bar cron fanned
      # the 11-kind surface across all five clouds while ALETHIA_COST_CEILING_MONTHLY_USD was wired
      # for aws alone, and bought a standing monthly alibaba CR EE subscription each week (#2340
      # landed the detection only on 2026-08-11). The cron is gone — but removing a cron is a
      # one-line edit and so is adding one, so this is the tripwire on the reintroduction: a cron
      # that resolves to `full` fails unless every matrix cloud is priced. Exemptions (a watched
      # dispatch) deliberately do not satisfy it. Hermetic — parses two files, no gh, no cloud.
      - name: E2E spend guard (no scheduled full bar on an unpriced cloud)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          node scripts/check-e2e-spend-guard.mjs --self-test
          node scripts/check-e2e-spend-guard.mjs
      # A knob the harness READS that no dispatch can SET is a scenario nobody can run at any price,
      # and it fails silently: the code is written, its unit tests pass, and every run takes the
      # default forever. #2775 found the BYO-IaC custody chain had never executed for exactly that
      # reason. #2591 and #2717 then each named a discriminating experiment — raise the day-2 URL
      # timeout, raise the ArgoCD convergence budget — that could not be dispatched at all.
      # Hermetic: reads test/e2e/**.go, the nightly workflow and the resolver. No gh, no cloud.
      - name: E2E knob reachability (a knob nothing can set is a scenario nobody can run)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/check-e2e-knob-reach.mjs
      # hcloud-cloud-controller-manager refuses to create a Load Balancer unless it is told WHERE.
      # The hetzner template told it nothing, so every `type: LoadBalancer` Service sat Pending —
      # SILENTLY, because a pending Service logs no error anyone surfaces. That silence is what let
      # it become #2490: no LB → the ingress-nginx Service never goes healthy → ArgoCD never reaches
      # PostSync → the admission webhook's caBundle is never patched → every Ingress fails x509.
      # The symptom names none of its cause, so a comment in the template would not have survived;
      # dropping the location re-arms the whole chain. Hermetic — parses one .tf, no cloud.
      - name: Hetzner CCM has somewhere to put a Load Balancer
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          node scripts/check-hetzner-lb-location.mjs --self-test
          node scripts/check-hetzner-lb-location.mjs
      # The Talos snapshot cache (#3027) is a coupling across four files in three languages, in an
      # hcloud account SHARED WITH PROD, and every way it can come apart is silent: the label stops
      # being stamped (every run rebuilds, 5-15m each, greenly); the `cluster` label comes back (the
      # sweeper deletes the cache at the end of the run that built it); `count` stops consulting the
      # lookup (the lookup becomes dead code); or a NEW key dimension reaches the template but not
      # the pruner, whose --prune-superseded then groups on a key that is no longer the key and
      # DELETES an image that is not superseded. `tofu validate` evaluates neither `count` nor
      # `check`, so none of those is visible to anything else in CI. Hermetic - parses one .tf and
      # two .sh, no cloud.
      - name: The Talos image cache's label, gate and sweeper skip-list cannot drift apart
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          node scripts/check-hetzner-image-cache.mjs --self-test
          node scripts/check-hetzner-image-cache.mjs
      # And the tool that is the ONLY thing allowed to delete a cache entry. Its dangerous modes sit
      # behind --yes-delete, and the self-test asserts on DELETE-CALL COUNTS rather than exit codes:
      # a prune that deleted everything unasked exits 0 exactly like one that deleted nothing.
      - name: hcloud image-cache tool (--yes-delete is what deletes; a failed listing is not "empty")
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/e2e/hcloud-image-cache.sh --self-test
      # A variable's DEFAULT is a decision, and `infra/.gitignore` used to hide every stack's real
      # inputs — so on any fresh checkout a bare `tofu apply` ran entirely on defaults, with nothing
      # saying so. That is not untidy, it is dangerous in two directions: a `count` gated on an
      # empty-defaulting variable means DESTROY (aws-oidc would have destroyed a Route53 zone whose
      # NS set is delegated at Cloudflare), and an empty default that merely STEERS a branch narrows
      # or widens in silence (gcp-e2e's OIDC trust went ref-only, killing every workflow_dispatch
      # from dev while the scheduled run kept passing). Twice is a class.
      #
      # A THIRD direction (#3292): a default that is not absent but OPEN. `ssh_allowed_cidrs`
      # defaults to `["0.0.0.0/0", "::/0"]` in cp-hetzner, status and sandbox, straight into the
      # source_ips of a port-22 firewall rule — and two of those three stacks are applied by
      # `tofu apply -auto-approve` on push to main with nothing supplying a narrower value, so the
      # open default IS the live configuration. The empty-default rule cannot see it: the value is
      # not empty and it steers nothing, it is simply what gets applied.
      #
      # Nothing in CI can catch this by running tofu: no workflow runs `tofu plan`, and `validate`
      # evaluates neither `check`, `validation` nor `prevent_destroy`. So it is a static read of the
      # HCL, ratcheting against infra/tfvars-safety-baseline.json — new empty defaults fail on the
      # PR that adds them, and a baseline entry that stops describing anything fails too.
      - name: Every dangerous variable default is supplied, required, or written down
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          node scripts/check-tfvars-safety.mjs --self-test
          node scripts/check-tfvars-safety.mjs
      # The proof-bundle scrub decides what a PUBLIC repo publishes, and its only run was inside
      # e2e-nightly.yml — a workflow no PR triggers. So the change that made the tripwire fire on
      # every azure plan JSON could not have been caught before merge, and wasn't: azure lost its
      # runner log on every run and published an unscrubbed 148 KB plan (#1923). The suite pins
      # both directions — non-vacuous AND not over-broad — and is hermetic: no cloud, no secret,
      # obviously-fake literals only.
      - name: Proof-scrub denylist (non-vacuous, and no false positive on a tofu plan JSON)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash demos/proofs/scrub.sh --self-test
      # The scrub above decides what a bundle may PUBLISH. This decides whether a bundle SAYS
      # ANYTHING — and until #2688 it did not. capture-proof.sh runs after the tier's t.Cleanup has
      # destroyed the cluster, so its live probe counted a cluster that was gone and wrote 0/0 on
      # every run: a PASS bundle and a FAIL bundle were numerically identical, and the only thing
      # telling them apart was the word "(T2-asserted)". Every bundle from 2026-08-25 onward carried
      # `nodes_ready:0, argocd_total:0, argocd_healthy_synced:0`, with no counter-example.
      #
      # Nothing in CI could see that, because the JSON's SHAPE was always right — only its values
      # were vacuous. So this self-test drives the real script end to end into a temp dir and
      # compares two bundles it actually wrote, rather than asserting against a fixture that would
      # have matched the broken output just as well.
      - name: Proof bundle distinguishes a PASS from a FAIL (never 0/0 on both)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash demos/proofs/capture-proof.sh --self-test
      # And whether a bundle that says nothing may still PROMOTE A CELL — which, until #3281, it
      # could. The capture printed "WARNING — this bundle carries NO measured ArgoCD convergence
      # counts" on a hetzner/addons run that had just driven 22 Applications to Healthy+Synced, and
      # nothing was required to act on it, so the cell went green on a job-log line that expires.
      # A warning nobody must act on is indistinguishable from silence.
      #
      # The gate is at the moment a bundle is used to CLAIM something (commit-proof.sh), never at
      # capture: a failing run's bundle is the evidence of the failure and must always survive.
      - name: A bundle that measured nothing cannot promote a cell (#3281)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash demos/proofs/check-proof-integrity.sh --self-test
      # PROGRAMME.md is the one file a session reads to know where the MVP programme stands, so its
      # status half is DERIVED and diff-gated — the numbers cannot be typed. This is the guard's own
      # guard (fixtures for RETRACTED supersession, an expiring CI run tag masquerading as a proof,
      # the marker splice refusing a duplicated region, and a vacuity case) plus the staleness diff.
      # The hand-maintained boards it replaces were contradicting each other IN THE TREE while
      # passing CI: runner-xcloud-parity.md called hetzner green for cluster provision,
      # provisioning-e2e-parity.md called it blocked, and the proof ledger said neither had evidence.
      - name: Programme ledger derivation (a PASS with no bundle is never a proof)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/programme-rollup.mjs --self-test
      - name: Programme ledger is in sync with the tree
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/programme-rollup.mjs
      # The spine mirror: Node cannot parse Go, so the Go tables that already OWN and validate the
      # ceiling/debt verdicts (MaxConfigCarriage, CLIReach) are exported to JSON and diff-gated,
      # rather than a third hand-authored list being kept in step by hand. Same shape as
      # gen:offer-surface / gen:keyless-cells. Untagged test — no cloud, no cost.
      - name: Programme spine mirror is in sync with the Go tables
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          (cd test/e2e && GOWORK=off go test -run 'TestProgrammeExport' ./...)
          git diff --exit-code -- test/e2e/generated/programme.json \
            || { echo "::error::test/e2e/generated/programme.json is stale — regenerate with (cd test/e2e && GOWORK=off go test -run TestProgrammeExport ./...) and commit. Source of truth: MaxConfigKinds + CLIDemoSteps."; exit 1; }
      # Each guard proves it still BLOCKS what it must and, more importantly, still
      # ALLOWS what it must — the false positives are what get a guard disabled.
      # This job is a BAG of independent checks, and it must stay one. Actions stops a job at its
      # first failing step, so before #2662 a failure at index 4 (`Open-core boundary`) silently
      # skipped 73 others — including the migration-chain check, the proof-scrub denylist and the
      # hook self-tests below, none of which has anything to do with the open-core boundary. Every
      # red run reported ONE finding and hid however many more sat behind it.
      #
      # The 73 `if:` lines fix today. This keeps them: the next check appended without one would
      # otherwise rejoin the veto chain at the bottom, where it is also the step most likely to be
      # skipped, and nothing would say so.
      # A workflow file can be VALID YAML and REJECTED by Actions: a step with no `run:` and no
      # `uses:` is a well-formed mapping that Actions refuses, producing a run with ZERO JOBS. None
      # of the nine required checks then reports, so the PR does not go red — it sits BLOCKED with an
      # EMPTY rollup, which reads like "CI hasn't started". `yaml.parse()` passes on that input,
      # which is exactly why parsing is not validation (#2670).
      - name: Every workflow step has a run or a uses (Actions rejects the file otherwise)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:workflow-shape
      - name: ...and that check's own parser is not silently blind
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:workflow-shape -- --self-test
      # Three lists of required checks have to agree and nothing compared them (#3180). The
      # dangerous direction is a check the protect-dev ruleset requires that .mergify.yml does not
      # wait for: the queue decides the PR is ready, GitHub refuses the merge, and nothing is red.
      - name: The required-check lists agree (HCL vs Mergify)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:required-checks
      - name: ...and that check's own parser is not silently blind
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:required-checks -- --self-test
      - name: The guards job is a bag of independent checks, not a pipeline
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/ci/check-guards-independent.mjs
      - name: ...and that check's own parser is not silently blind
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/ci/check-guards-independent.mjs --self-test
      # The level ABOVE the two checks either side of this one. They ask whether a step is shaped
      # so Actions will run it, and whether one failure can skip the rest. This asks whether the
      # command a step names does anything at all: `pnpm -F <pkg> <script>` exits 0 when no
      # selected package has that script — an EMPTY SELECTION, not an error (#3853). 32 of the
      # steps in this very job were written that way, `check:ee-boundary`, `check:authz-scope` and
      # `check:migrations` among them, so renaming any one of those scripts would have left its
      # gate green having executed nothing, with the PR that did it looking clean. Measured, not
      # theorised: #3827's two new steps reported `success` having run nothing.
      - name: Every pnpm script a workflow names exists, and none uses the exit-0 filter form
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:pnpm-script-refs
      - name: ...and that check's own parser is not silently blind
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/ci/check-pnpm-script-refs.mjs --self-test
      # The classifier both chart-render jobs share, and the retry built on it. It runs the script
      # under `bash -e` — GitHub's default shell — because an earlier version of that retry was 100%
      # INERT in CI for exactly that reason while passing a harness that used plain `bash`.
      - name: The chart-fetch retry retries a fetch and refuses a real failure
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/ci/tofu-test-retry-fetch.sh --self-test
      - name: Guards self-test (runtime · compose · merge)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          bash .claude/hooks/guard-runtime.sh --self-test
          bash .claude/hooks/guard-compose.sh --self-test
          bash .claude/hooks/guard-merge.sh --self-test
          bash .claude/hooks/guard-iac.sh --self-test
          # guard-worktree had NO self-test, alone among the four, and it is the one with the most
          # moving parts — two rules, a quote-stripped scan, a target resolver and a fail-closed
          # fall-through. Every defect fixed in #3192 was found by tripping over it in ordinary
          # work; two had been shipped for weeks. It builds a real main checkout and a real linked
          # worktree in a tmpdir, so it stays hermetic.
          bash .claude/hooks/guard-worktree.sh --self-test
      - name: Hook scripts parse
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          for f in .claude/hooks/*.sh scripts/env.sh scripts/dev-doctor.sh scripts/box/*.sh; do
            bash -n "$f"
          done
      # The box scripts' own decision matrices — the seed/empty/restart table and the edition
      # verdict in env-mode.sh, the port arithmetic in env-registry.sh. They HAD a CI home, in
      # infra-sandbox.yml, and it is gated on `infra/sandbox/**`: a change to scripts/box/ ran
      # the parse above and nothing else, so every cell in those matrices was advisory on the
      # only PRs that could break them. The step above proves the file parses; this one proves
      # the decisions still hold.
      - name: Box script self-tests (edition verdict · seed matrix · port allocation)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          bash scripts/box/env-mode.sh --self-test
          bash scripts/box/env-registry.sh --self-test
      - name: Cloud privilege (OIDC / creds) never reachable from a PR (BYOC invariant 1)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/check-workflow-oidc-isolation.mjs

  go:
    name: Go (build · vet · test · lint)
    runs-on: ubuntu-latest
    # NOT ON THE UI-AUDIT NIGHTLY. `schedule` fires every job with no `if:` at all, so the
    # 03:00 cron added for the console UI audit would have signed this one up for a nightly
    # run it never asked for — the same trap the cron block records for `mutation`, which
    # only covers jobs that gate on `schedule` in the first place. See ci.yml's `on.schedule`.
    if: github.event.schedule != '0 3 * * *'
    strategy:
      fail-fast: false
      matrix:
        module: [apps/cli, apps/runner, packages/core]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: ${{ matrix.module }}/go.sum
      # packages/core's untagged provisioning-wiring E2E (deploy_wiring_test.go) runs a real
      # `tofu` against a provider-less module — it self-skips without tofu on PATH, which
      # would make the keystone's per-PR signal hollow. Install it so the test actually runs.
      #
      # apps/runner needs it for the SAME reason, and did not have it. Its chart-scan and
      # IaC-scan suites (chart_scan_test.go, exec_stage_test.go, iac_scan_test.go) self-skip
      # without `helm` and `tofu` on PATH. The 2026-08-04 determinism probe confirmed what
      # ubuntu-latest actually ships: helm IS preinstalled (/usr/local/bin/helm) but **tofu is
      # MISSING**, so those runner tests have been silently skipping in CI — passing by not
      # running. Worth fixing on its own; it also makes the leg's coverage reproducible, which
      # a floor depends on (the same suites measure 49.58% locally with tofu present and
      # 47.24% without).
      #
      # helm is pinned rather than inherited: "happens to be on the GitHub-managed image" is an
      # unpinned property, and the day it is pruned those tests would go quiet again.
      - uses: azure/setup-helm@v5
        if: matrix.module == 'apps/runner'
        with:
          version: v3.16.3
      # packages/core inherited helm the same way apps/runner used to, and the consequence here is
      # WORSE than a quiet skip. Its floors record `"helm": true`, and the ratchet's fingerprint
      # check demotes — not fails — when the current environment is missing something the recording
      # environment had. So the day ubuntu-latest prunes helm, this leg does not go red: it goes
      # silently ADVISORY, and every coverage regression in packages/core sails through as a
      # warning. That is the "a guard's nothing-found branch is indistinguishable from
      # nothing-wrong" class, armed and waiting.
      #
      # Pinned to v3.21.4 DELIBERATELY, which is not the v3.16.3 above. That is the version
      # actions/runner-images currently ships on ubuntu-24.04, so this leg keeps running the exact
      # binary it runs today: the pin buys determinism and changes no behaviour, and therefore
      # cannot move the recorded numbers. It has to be that way round, because the fingerprint is a
      # BOOLEAN — `helm: true` cannot see a version change, so a version-shifting pin would not
      # demote, it would simply red, and it would red on whoever landed next rather than on the PR
      # that caused it.
      #
      # The two legs therefore run different helm versions. That is the honest state, not the
      # desired one; harmonising them is a behaviour change that moves numbers and needs its own
      # floors re-record, so it is filed separately rather than smuggled into a determinism fix.
      - uses: azure/setup-helm@v5
        if: matrix.module == 'packages/core'
        with:
          version: v3.21.4
      - uses: opentofu/setup-opentofu@v2
        if: matrix.module == 'packages/core' || matrix.module == 'apps/runner'
        with:
          tofu_version: "1.9.0"
      - name: Build · vet · test (with coverage)
        working-directory: ${{ matrix.module }}
        run: |
          go build ./...
          go vet ./...
          go test -coverprofile=cover.out ./...
      # Per-package statement-coverage RATCHET: coverage may rise, never fall. Reads the cover.out
      # written directly above — it does NOT re-run the suite.
      #
      # No `working-directory`: the script cd's to the repo root itself, so it is invoked
      # identically for every module and the fix command it prints needs no cd puzzle.
      #
      # No `if: always()`: when the step above fails there is no usable profile, and reporting a
      # coverage collapse on top of a test failure would misattribute the cause.
      #
      # This blocks a PR that lowers coverage in ANY package, including one the author does not
      # own. That is deliberate. Every false-failure path is fail-OPEN and enumerated in the
      # script header — the floors carry a fingerprint of the environment that recorded them, and
      # a mismatch (including a different OS) demotes failures to warnings rather than blaming
      # coverage for a toolchain change.
      #
      # --require-verdict: every fail-open path in the script exits 0, which made "the ratchet
      # passed" and "the ratchet never ran" the same green here (#2852). Two of those can fire on
      # a runner — jq missing from an image, and a test step that wrote its profile somewhere
      # else — and both announced themselves with `::warning::`, which nothing surfaces on a PR
      # page. The flag turns any non-measuring path into exit 3, so this step asserts it actually
      # got an answer. Local runs stay advisory: the flag is off by default.
      - name: Coverage ratchet (per package, no regressions)
        run: bash scripts/go-coverage.sh --module ${{ matrix.module }} --require-verdict
      # Each Go module must be tidy STANDALONE (no go.work) — the CLI mirror + GoReleaser build
      # apps/cli outside the workspace, where go.work can't paper over a missing require. This guard
      # fails the PR instead of the (post-merge) mirror when go.mod/go.sum drift standalone.
      - name: go.mod tidy guard (standalone — GOWORK=off)
        working-directory: ${{ matrix.module }}
        run: |
          GOWORK=off go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error::${{ matrix.module }}/go.mod or go.sum is not tidy standalone — run 'cd ${{ matrix.module }} && GOWORK=off go mod tidy' and commit." >&2
            exit 1
          fi
      # Compile-check the docker-gated e2e_local keystone (it's excluded from the default
      # build tags, so a break in deploy_e2e_test.go would otherwise escape all of CI).
      - name: Vet e2e_local keystone (compile check)
        if: matrix.module == 'packages/core'
        working-directory: ${{ matrix.module }}
        run: go vet -tags=e2e_local ./provisioner/
      # Compile-check the T1/T2 harness (test/e2e — a SEPARATE module outside go.work, run
      # only by the merge-queue provision-e2e job / the nightly). Without this, a break in
      # controlplane.go / t1_provision_test.go would escape every per-PR check and only
      # surface in the merge queue, blocking it for everyone rather than failing the
      # offending PR (parity with the e2e_local keystone above). The untagged `go test` runs
      # the harness's PURE unit tests (argocd_assert_test.go — the ArgoCD health assertion's
      # parse/evaluate/derive negative paths; no docker/kind/postgres needed).
      - name: Vet + unit-test e2e harness (compile check + pure logic)
        if: matrix.module == 'packages/core'
        run: |
          cd test/e2e
          GOWORK=off go vet -tags=e2e_t1 ./...
          GOWORK=off go vet -tags=e2e_t2 ./...
          GOWORK=off go vet -tags=e2e_b6 ./...
          GOWORK=off go test -coverprofile=cover.out ./...
      # test/e2e is the FOURTH Go module and has no matrix leg of its own — it is exercised from
      # inside the packages/core leg above, which is why its 2,193 statements have never been
      # coverage-measured. Its ratchet is therefore an explicit step here rather than a matrix
      # entry.
      #
      # Its floors WERE recorded by the determinism probe, whose test/e2e leg installs no tofu,
      # while this leg does — a deliberately CONSERVATIVE floor that the comment here predicted
      # would "tighten on the first `--update`". It has (#2156): the floors now carry this leg's
      # own measurement and `"tofu": true` with it. The fingerprint has to move WITH the number,
      # or the fallback the conservative floor bought is silently gone — a broken tofu install
      # would drop coverage below a floor recorded as tofu-less, and F7 would find nothing
      # "missing" to demote the failure with. Recorded tofu:true, it demotes to a warning.
      - name: Coverage ratchet — test/e2e harness
        if: matrix.module == 'packages/core'
        run: bash scripts/go-coverage.sh --module test/e2e --require-verdict
      - name: CLI logic-scope coverage gate (≥90%)
        if: matrix.module == 'apps/cli'
        working-directory: ${{ matrix.module }}
        run: ./scripts/coverage.sh 90
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: ${{ matrix.module }}

  coverage-determinism:
    name: Coverage determinism probe (manual)
    # MANUAL ONLY. This exists to answer one question before the ratchet is armed: are the numbers
    # CI produces stable, and are they the same numbers a laptop produces?
    #
    # They are not, and that is the whole point. Go coverage here depends on what is on PATH:
    # measured locally, packages/core/tofu moves 51.98% -> 36.72% with `tofu` removed,
    # packages/core/provisioner 50.73% -> 39.12%, apps/runner/internal/agent 49.58% -> 47.24%
    # (those suites self-skip). packages/core/api moves by two statements depending on whether an
    # alethia credentials file exists in the user's config dir — which it does on a maintainer's
    # Mac and never in CI. Recording floors from a laptop therefore bakes numbers CI can never
    # reach and reds EVERY PR in the repository until someone regenerates them.
    #
    # So: run this, read its output, and generate the floors from THESE numbers.
    #
    # It compares PARSED pairs, never raw profiles — block order in a coverprofile follows package
    # completion order under `go test -p N` and is genuinely unstable run to run, so diffing or
    # checksumming the file itself is broken on arrival.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [apps/cli, apps/runner, packages/core, test/e2e]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: ${{ matrix.module }}/go.sum
      # Must mirror the `go` job's toolchain EXACTLY, or the numbers this probe prints are not
      # the numbers the ratchet will compare against and flooring from them reds every PR.
      - uses: azure/setup-helm@v5
        if: matrix.module == 'apps/runner'
        with:
          version: v3.16.3
      - uses: opentofu/setup-opentofu@v2
        if: matrix.module == 'packages/core' || matrix.module == 'apps/runner'
        with:
          tofu_version: "1.9.0"
      - name: Which coverage-affecting binaries does this runner image actually ship?
        run: |
          for b in docker git helm kubectl tofu; do
            printf '%-10s %s\n' "$b" "$(command -v "$b" || echo MISSING)"
          done
      - name: Five runs, comparing parsed pairs
        run: |
          for i in 1 2 3 4 5; do
            (cd ${{ matrix.module }} && GOWORK=${{ matrix.module == 'test/e2e' && 'off' || 'auto' }} \
              go test -count=1 -coverprofile=cover.$i.out ./... >/dev/null)
            bash scripts/go-coverage.sh --module ${{ matrix.module }} \
              --profile ${{ matrix.module }}/cover.$i.out --print >run.$i.txt
          done
          echo "── per-package covered/total, run 1 ──"
          cat run.1.txt
          if [ "$(cat run.*.txt | sort -u | wc -l)" -eq "$(wc -l <run.1.txt)" ]; then
            echo "✓ ${{ matrix.module }} is run-to-run deterministic across 5 runs"
          else
            echo "::error::${{ matrix.module }} is NONDETERMINISTIC — do NOT floor it. Differing rows:"
            cat run.*.txt | sort | uniq -c | awk '$1 != 5'
            exit 1
          fi
      - name: Floors these numbers would produce (copy into the A4 PR)
        run: |
          bash scripts/go-coverage.sh --module ${{ matrix.module }} \
            --profile ${{ matrix.module }}/cover.1.out --update
          echo "── ${{ matrix.module }}/coverage-floors.json ──"
          cat ${{ matrix.module }}/coverage-floors.json
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-floors-${{ strategy.job-index }}
          path: ${{ matrix.module }}/coverage-floors.json

  ts-coverage-determinism:
    name: TS coverage determinism probe (manual)
    # MANUAL ONLY. The same question `coverage-determinism` asks of Go, asked of TypeScript: are
    # the numbers CI produces stable run-to-run, and are they the numbers a laptop produces?
    #
    # They are NOT a laptop's, and that is the point of running it here. What makes the floors it
    # records reachable by the job that ENFORCES them is that this job and the required
    # `typescript` job run the IDENTICAL `pnpm exec turbo run test` — same build, same ee/dist,
    # same measured scope. Floors recorded from a laptop would bake in numbers CI can never
    # reproduce and would red — or worse, silently DEMOTE — every PR in the repository.
    #
    # (This comment used to claim the opposite: that the probe "deliberately does NOT build
    # @alethia/ee" and therefore measures COMMUNITY scope. That was already corrected twice
    # elsewhere in this file, and every committed floors file records `ee_dist: true`. An inverted
    # comment sitting directly above the code is how the next reader edits in the wrong direction,
    # so it is deleted rather than annotated.)
    #
    # So: run this, read its output, and generate the floors from THESE numbers.
    #
    # The body is scripts/ci/ts-coverage-probe.sh rather than a `run:` block, for two reasons
    # (#3265). A `workflow_dispatch`-only step is exercised by nothing, so a defect in it survives
    # indefinitely — as a script it has a `--self-test` the `guards` job runs on every PR. And the
    # project list belongs to scripts/ts-coverage-sweep.json, not to four hand-typed copies here:
    # the clean-up, the print loop, the update loop and the artefact `path:` all named three
    # projects against a record of six, which is why `apps/marketing` and `ee` could never get the
    # numbers this job exists to produce. `--force` on every run lives in the script's default
    # suite command, or turbo replays run 1's cached coverage/ outputs and the probe proves
    # nothing at all.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: What this runner actually carries (the fingerprint, verbatim)
        run: |
          printf '%-22s %s\n' os "$(uname -s)"
          printf '%-22s %s\n' node "$(node -v)"
          printf '%-22s %s\n' ALETHIA_EDITION "${ALETHIA_EDITION:-unset}"
          printf '%-22s %s\n' ee/dist "$(test -f ee/dist/index.js && echo present || echo ABSENT)"
          node -p "require('./node_modules/@vitest/coverage-v8/package.json').version" 2>/dev/null \
            || echo "coverage-v8 version: resolved per-project"
      # The count comes from the dispatch input, defaulted in BOTH places: the `||` here covers an
      # event where `inputs` does not exist at all, and the script's own `${ALETHIA_TS_PROBE_RUNS:-5}`
      # covers being run by hand.
      #
      # An EMPTY value is safe — `${VAR:-5}` substitutes for empty as well as unset, checked rather
      # than assumed. What is NOT safe is `0`, which survives that default and (on GNU seq) runs the
      # loop zero times, so the probe would report success having compared nothing. The script now
      # rejects anything below 2; this comment records why the rejection is there rather than
      # leaving it to look like fussiness.
      - name: N runs, compared — then the floors those numbers produce
        env:
          ALETHIA_TS_PROBE_RUNS: ${{ inputs.ts_probe_runs || '5' }}
        run: scripts/ci/ts-coverage-probe.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ts-coverage-floors
          # ONE staged directory, written by the probe from the sweep record. The explicit list
          # that used to live here named the same three projects as the loops did, so even with
          # the loops fixed, marketing's and ee's floors would never have left the runner — and
          # arming them is the whole reason anybody dispatches this job.
          #
          # plan-catalog's raw artefact rides along deliberately: it is the smallest project, so a
          # verbatim copy is a committable size, and it is how the --self-test fixture gets
          # captured from a REAL vitest run with real CI absolute paths rather than hand-written.
          path: |
            ts-coverage-floors/
            packages/plan-catalog/coverage/coverage-final.json
          if-no-files-found: error

  runner-image-arch:
    name: Runner image arch (amd64 ships x86-64 — INCIDENT 2026-07-22 guard)
    # Would have caught the 2026-07-22 fleet-churn incident BEFORE prod: apps/runner/Dockerfile.base
    # shipped an arm64 binary inside the amd64 image (a stray `ARG TARGETARCH=arm64` default), so every
    # x86 fleet VM crash-looped on `execve` ENOEXEC and never registered. A plain `go build` can't
    # reproduce a Dockerfile ARG regression — so BUILD THE REAL IMAGE for linux/amd64 and assert its
    # /usr/local/bin/runner is a genuine x86-64 ELF (e_machine 0x3e), not aarch64 (0xb7). runner-base
    # carries the compiled binary that every per-cloud image inherits FROM without rebuilding, so this
    # one build covers runner-{aws,gcp,azure,alibaba,hetzner}. Mirrors scripts/e2e/runner-e2e.sh's
    # `register` stage (which asserts the same on the PUBLISHED images). Gated on the runner surface.
    needs: [detect-changes]
    if: needs.detect-changes.outputs.runner == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build runner-base for linux/amd64
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/runner/Dockerfile.base
          platforms: linux/amd64
          load: true
          tags: runner-base:arch-check
          cache-from: type=gha,scope=runner-base-amd64
      - name: Assert /usr/local/bin/runner is x86-64 (e_machine 0x3e, not 0xb7 aarch64)
        run: |
          em=$(docker run --rm --entrypoint sh runner-base:arch-check \
                 -c 'od -An -tx1 -j18 -N2 /usr/local/bin/runner' | tr -d ' ')
          echo "amd64 /runner e_machine=$em"
          case "$em" in
            3e00) echo "OK — amd64 runner is x86-64 (e_machine=0x3e)" ;;
            b700) echo "::error file=apps/runner/Dockerfile.base::amd64 image ships an ARM64 runner (e_machine=0xb7) — the 2026-07-22 fleet-churn INCIDENT bug (arm64 binary in the amd64 image). Ensure the builder cross-compiles from buildx's TARGETARCH with NO arm64 default."; exit 1 ;;
            *)    echo "::error file=apps/runner/Dockerfile.base::unexpected e_machine=$em in the amd64 runner binary (expected 0x3e x86-64)"; exit 1 ;;
          esac

  provision-e2e:
    name: Provisioning E2E (T1 · real runner → kind)
    # ⚠️ THIS JOB HAS NOT RUN SINCE 2026-07-21, AND THE COMMENT HERE SAID OTHERWISE FOR SIX WEEKS.
    #
    # It used to read "runs when a PR enters the merge queue". `merge_group` fires only under
    # GitHub's NATIVE merge queue, and `.mergify.yml` replaced that queue on 2026-07-21 — precisely
    # because this job, being merge_group-only, failed on missing auth env and wedged every queued
    # PR. Measured 2026-09-03: all 107 merge_group CI runs in the repo are dated 2026-07-18..21,
    # and the last twelve all FAILED. So the T1 provisioning keystone has had no live trigger at
    # all, while its own comment asserted a schedule it no longer had.
    #
    # It is deliberately merge-queue-only: manual dispatch lacks the real runner/control-plane
    # prerequisites and would produce a predictable red rather than a useful signal.
    #
    # What it does, when it runs: a real runner PROCESS claims a QUEUED job from a real
    # Postgres-backed control plane and drives the full RunDeployV2 spine against a genuine `kind`
    # cluster. kind boot + provider/image pulls are heavy, which is why it was never per-push. The
    # `e2e_t1` build tag keeps it out of the fast per-PR Go suite; ALETHIA_E2E_T1_REQUIRE=1 turns a
    # missing prerequisite (docker/kind/tofu) into a HARD FAIL, never a green skip, so the signal
    # cannot hollow out. Extends the in-process T0 (which stays in the `go` job as a compile check).
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    services:
      # Mirrors the `integration` job: a throwaway Postgres that db:migrate turns into
      # the real control-plane schema + programmables (claim_next_job / update_job_status
      # / insert_job_log) the runner's claim + callbacks + log-shipping exercise.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: alethia
          POSTGRES_PASSWORD: alethia-dev-secret
          POSTGRES_DB: alethia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alethia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ALETHIA_DATABASE_URL: postgres://alethia:alethia-dev-secret@localhost:5432/alethia
      ALETHIA_APP_DATABASE_URL: postgres://alethia_app:alethia-app-dev-secret@localhost:5432/alethia
      ALETHIA_APP_DB_PASSWORD: alethia-app-dev-secret
      # kind is slower than the in-process T0 — give the reachability gate room.
      ALETHIA_CLUSTER_READY_TIMEOUT: 3m
      # In the merge queue a missing prerequisite is a HARD FAIL, never a green skip.
      ALETHIA_E2E_T1_REQUIRE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.9.0"
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.4
      - uses: azure/setup-kubectl@v5
      - name: Install kind CLI (independent kubeconfig + cluster-leak cleanup)
        id: kind
        run: |
          go install sigs.k8s.io/kind@v0.30.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - name: Migrate the control-plane database (schema + programmables/RLS + app role)
        run: pnpm -C apps/console run db:migrate
      # B6.1 — the gated-promotion chain is console + DB logic (no cloud, no kind), so it runs here
      # first (fast feedback) against the SAME migrated Postgres: it drives the REAL exported console
      # actions (advancePromotionOnPlan → applyPromotionApproval → finalizeDeployment +
      # finalizePromotionOnDeploy) via the tsx shim and asserts the classification gate blocks, the
      # approval clears it, the DEPLOY reaches SUCCESS through the update_job_status SSOT, and the
      # promotion finalizes. ALETHIA_E2E_B6_REQUIRE=1 makes a missing prereq a hard fail (never a skip).
      - name: B6.1 — gated dev→staging promotion (classification gate → approval → deploy → finalize)
        working-directory: test/e2e
        env:
          ALETHIA_E2E_B6_REQUIRE: "1"
        run: GOWORK=off go test -tags=e2e_b6 ./... -run TestB6GatedPromotion -count=1 -timeout 8m -v
      # 25m: the test's own ctx is 20m (deploy wait 8m + ArgoCD Healthy+Synced
      # convergence assertion 8m + build/boot headroom) plus teardown margin.
      - name: T1 — real runner claims from the control plane and provisions kind
        working-directory: test/e2e
        run: GOWORK=off go test -tags=e2e_t1 ./... -run TestT1RealRunnerKindProvisioning -count=1 -timeout 30m -v
      # `always()` is deliberate — a leaked cluster must be swept on a CANCEL too, which is the one
      # thing `!cancelled()` would not do. What it must not do is run when `kind` was never
      # installed: this job has `services:`, so a failed image pull reds `Initialize containers`
      # before checkout and skips every step here, and `kind delete` would then be a
      # command-not-found swallowed by `|| true` — a green step that swept nothing (#4084).
      - name: Teardown any leaked kind clusters (safety net)
        if: always() && steps.kind.outcome == 'success'
        run: kind delete clusters --all || true

  go-coverage-badge:
    name: Go coverage badge (self-hosted)
    runs-on: ubuntu-latest
    # Push-to-main only: aggregate the three Go modules' coverage into one badge JSON the README
    # renders, and commit it. `[skip ci]` avoids a run loop.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    # SERIALISED behind the TypeScript badge job. Both jobs force-push their own tree to `badges`,
    # and each restores the other's badge first so the push is additive. Run concurrently they
    # would both restore from the SAME base, and the second to push would silently revert the
    # first's fresh number — a lost update, with both jobs green. `needs:` removes that race
    # rather than narrowing it.
    #
    # BUT `needs:` CARRIES AN IMPLICIT success() ON THE UPSTREAM JOB, and a matching `if:` does not
    # cancel it — only a status function does. Left bare, a failure anywhere in `coverage-badge`
    # (its install, its suites, its push) would SKIP this job entirely, so a TypeScript-side
    # problem would cost BOTH badges instead of one, and the Go badge would be skipped rather than
    # red. That is the same "a failure vetoes an unrelated unit downstream of it" shape this PR is
    # fixing elsewhere, so it must not be reintroduced here.
    #
    # `!cancelled()` degrades `needs:` to pure ORDERING: the job still runs after its predecessor,
    # whatever that predecessor's outcome, and a TypeScript failure leaves one stale badge instead
    # of two frozen ones.
    needs: coverage-badge
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Cover each Go module
        run: |
          for m in apps/cli apps/runner packages/core; do
            (cd "$m" && go test -coverprofile=cover.out ./...)
          done
      - name: Compute aggregate Go coverage → badge JSON
        run: node scripts/go-coverage-badge.mjs
      # Publish UNCONDITIONALLY — the identical `git diff --quiet` trap the TypeScript badge job
      # above carried. `git diff` reports TRACKED paths only; on an untracked one it exits 0
      # ("clean") while `git status --porcelain` correctly prints `?? <path>`. Now that the badge
      # JSON is no longer checked in, the regenerated file is always untracked and that guard
      # would have reported "unchanged" on every run — freezing the badge with this job GREEN.
      # That is the same swallowed-signal shape this job's own post-mortem below describes.
      #
      # Safe to drop because the file is untracked: every run starts from a fresh checkout of
      # main where it does not exist, so `git add` always stages a new file and `git commit`
      # can never fail with "nothing to commit".
      - name: Publish the badge
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Carry the sibling badge forward — see the long note in the `coverage-badge` job. A
          # force-push publishes THIS tree, and this tree no longer contains `coverage.json`, so
          # without restoring it first this job would delete the TypeScript badge and 404 the
          # README. `|| true` is correct only for the first-run case where the file does not exist.
          #
          # This job also `needs: coverage-badge`, which removes the race outright: the two ran
          # concurrently, each restoring the other's file from the SAME base, so whichever pushed
          # second would silently revert the first's fresh number. Serialised, this one fetches a
          # `badges` that already carries the TypeScript job's new value.
          # `|| true` on the fetch would be a fail-open that silently reintroduces the deletion
          # this block exists to prevent: no FETCH_HEAD, no sibling restored, force-push drops it,
          # job green. So the ONLY tolerated absence is a `badges` branch that genuinely does not
          # exist yet (the very first publish); a fetch that FAILS against an existing branch reds
          # this job.
          if git ls-remote --exit-code --heads origin badges >/dev/null 2>&1; then
            git fetch --depth=1 origin badges
            # `checkout … || echo` would swallow EVERY failure of that command, not only the one
            # absence we mean to tolerate: a wrong FETCH_HEAD, a moved path or a locked index would
            # all print the same notice and then force-push the sibling away, green. So the
            # tolerated case is tested for explicitly and the checkout itself is strict.
            if git cat-file -e "FETCH_HEAD:.github/badges/coverage.json" 2>/dev/null; then
              git checkout FETCH_HEAD -- .github/badges/coverage.json
            else
              echo "::notice::no coverage.json on \`badges\` yet — nothing to carry forward"
            fi
          else
            echo "::notice::\`badges\` does not exist yet — first publish, nothing to carry forward"
          fi
          # -f is defensive: .gitignore carries a bare `coverage` rule, which does NOT match this
          # path today (no component is exactly `coverage`), but a future broadening of that rule
          # must not silently stop the badge instead of failing.
          git add -f .github/badges/
          # --no-verify: the repo's pre-commit hook (core.hooksPath) blocks direct
          # commits to main; this CI-authored badge commit is legitimate.
          git commit --no-verify -m "chore(ci): update go coverage badge [skip ci]"
          # WHY NOT `git push` TO MAIN, AND WHY NO `|| true`:
          #
          # `protect-main` (infra/github/main.tf) is enforcement:active with bypass_actors:[]
          # and a pull_request rule, so EVERY update to refs/heads/main must arrive via a PR.
          # This push was refused with `GH006: Protected branch update failed … Changes must be
          # made through a pull request`, and `|| echo "::warning::badge push skipped"` turned
          # that hard failure into a green job. `permissions: contents: write` never mattered —
          # the token has the permission, the ruleset denies the ref update.
          #
          # Consequence: this job had NEVER pushed successfully. .github/badges/go-coverage.json
          # has exactly one commit in its history (23892e35, 2026-06-28, hand-authored); the
          # job was added 2026-06-30 and the ruleset created 2026-07-03. The README advertised
          # 21.6% for five weeks while the real aggregate was 61.2% — a 40-point error that the
          # swallowed exit code hid. The TypeScript badge above was dead for the same reason.
          #
          # The rulesets match only refs/heads/{dev,main,staging} with empty excludes, so the
          # orphan `badges` branch is writable with no Terraform apply and no hole in main.
          git push --force origin HEAD:badges

  mutation:
    name: Mutation testing (Stryker + Gremlins)
    # The objective "are the tests real" check. Slow — runs WEEKLY + on manual dispatch only,
    # never on PRs. Report-only for now (|| true); ratchet to a hard threshold as scores climb.
    # Pinned to the MONDAY cron by its expression, not to `event_name == 'schedule'`: ci.yml now
    # also carries a nightly cron for the UI audit, and the looser test would have quietly turned
    # this weekly job into a nightly one.
    if: github.event.schedule == '0 6 * * 1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
      - run: pnpm install --frozen-lockfile
      - name: TS mutation (Stryker — lib + actions)
        run: pnpm -C apps/console run mutate || true
      - name: Go mutation (Gremlins — all modules)
        run: |
          go install github.com/go-gremlins/gremlins/cmd/gremlins@latest
          scripts/go-mutation.sh || true

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # NOT ON THE UI-AUDIT NIGHTLY. `schedule` fires every job with no `if:` at all, so the
    # 03:00 cron added for the console UI audit would have signed this one up for a nightly
    # run it never asked for — the same trap the cron block records for `mutation`, which
    # only covers jobs that gate on `schedule` in the first place. See ci.yml's `on.schedule`.
    if: github.event.schedule != '0 3 * * *'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # gitleaks-action@v2 requires a paid license for ORG-owned repos, so we run the
      # open-source gitleaks binary directly (MIT). Scan only the PR/push diff — the
      # .gitleaks.toml is authored for diff-only scanning so pre-existing history findings
      # don't block new PRs (see that file's header).
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan new commits for secrets
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "scanning ${BASE}..${HEAD}"
            gitleaks git . --redact --log-opts="${BASE}..${HEAD}"
          else
            echo "base commit unavailable — scanning latest commit only"
            gitleaks git . --redact --log-opts="-1"
          fi

  addon-charts-render:
    name: Add-on charts render (helm template · pinned charts)
    runs-on: ubuntu-latest
    # NOT ON THE UI-AUDIT NIGHTLY. `schedule` fires every job with no `if:` at all, so the
    # 03:00 cron added for the console UI audit would have signed this one up for a nightly
    # run it never asked for — the same trap the cron block records for `mutation`, which
    # only covers jobs that gate on `schedule` in the first place. See ci.yml's `on.schedule`.
    if: github.event.schedule != '0 3 * * *'
    # Its own job because it needs helm on PATH and fetches real charts — neither belongs in the
    # console's vitest run. It renders the DEFAULT values of every marketplace add-on against its
    # pinned chart and requires exit 0.
    #
    # #2058 is why this exists: Loki's entry paired `deploymentMode: SingleBinary` with non-zero
    # read/write/backend replicas. Both values are individually valid, the combination is rejected by
    # the chart's own validate.yaml, and NOTHING in this repo could see it — types pass, unit tests
    # assert what the resolver emits rather than what the chart accepts, and neither parity guard
    # measures add-on values. It shipped, and a real cluster found it.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.2
      # BEFORE the real run, and cheap: it stubs helm out entirely. The retry this job gained in
      # #2754 is the dangerous kind of change — too eager and it re-rolls a genuine render failure,
      # which is precisely the defect (#2058) this job exists to catch. The self-test asserts the
      # attempt COUNTS, not just the outcomes, because a function that gives up after one attempt
      # returns the same shape as one that tried three times.
      - name: ...and the fetch-vs-render classifier is not too eager
        run: node apps/console/scripts/check-addon-charts-render.mjs --self-test
      # ITS OWN STEP, AND THAT IS THE FIX (#3961). "we could not reach the repository" and "the chart
      # does not render with our values" are different diagnoses with different owners, and until
      # this they shared one exit code under one name — so a reader could not tell a third party's
      # downtime from our defect without opening the log, which is how a gate becomes one people
      # re-run without reading. Split, the checks list answers it: red HERE is somebody else's
      # uptime, red BELOW is this repo's values.
      #
      # It probes every distinct chart repo the generated fixtures name — derived from them, never
      # a typed list — and scores each against scripts/ci/chart-repo-outages.txt. An outage a human
      # has recorded there does not red it; a NEW one does, and so does a recorded one that has
      # RECOVERED, which is what stops the ledger outliving the outage it excuses.
      - name: Chart repositories are reachable (third-party uptime, not this repo's code)
        run: node apps/console/scripts/check-addon-charts-render.mjs --reachability
      - name: Every add-on renders with its pinned chart and its own defaults
        run: node apps/console/scripts/check-addon-charts-render.mjs

  docs-prose:
    name: Docs prose (Vale · Diátaxis + plain-language)
    needs: detect-changes
    # This job ALWAYS runs so it always reports its status check — that is what makes it safe to
    # mark REQUIRED (infra/github). A job whose steps all skip still reports success, so on a
    # non-docs PR / promotion / merge_group it passes green without spinning up Vale. The real work
    # is gated per-step on the `docs` filter; the final step is the explicit no-op pass.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: needs.detect-changes.outputs.docs == 'true'
      - uses: actions/setup-node@v7
        if: needs.detect-changes.outputs.docs == 'true'
        with:
          node-version: 22
      # Vale shells out to `mdx2vast` to parse .mdx (prose only — it drops fenced code,
      # code spans, URLs, JSX/ESM); it must be on $PATH.
      - name: Install the MDX preprocessor
        if: needs.detect-changes.outputs.docs == 'true'
        run: npm i -g mdx2vast
      # Vale is a single Go binary — install the pinned release, mirroring the gitleaks job.
      - name: Install Vale
        if: needs.detect-changes.outputs.docs == 'true'
        run: |
          curl -sSfL https://github.com/errata-ai/vale/releases/download/v3.15.1/vale_3.15.1_Linux_64-bit.tar.gz \
            | sudo tar -xz -C /usr/local/bin vale
          vale --version
      # Downloads the Google style package into styles/ (gitignored); the Alethia style + vocab
      # are vendored in the repo.
      - name: Sync Vale packages
        if: needs.detect-changes.outputs.docs == 'true'
        working-directory: apps/docs
        run: vale sync
      # `vale` exits non-zero ONLY on error-level alerts (the Alethia.Terminology rule). Warnings
      # (plain-language swaps, long sentences) and suggestions print for visibility but never red
      # the build — matches the green-CI / self-merge flow.
      - name: Lint docs prose
        if: needs.detect-changes.outputs.docs == 'true'
        working-directory: apps/docs
        run: vale content
      # No apps/docs changes — nothing to lint, but the job still reports success so the required
      # check is satisfied on non-docs PRs and promotions.
      - name: No docs changes
        if: needs.detect-changes.outputs.docs != 'true'
        run: echo "No apps/docs changes in this PR — prose lint not required."

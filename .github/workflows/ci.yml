# SPDX-License-Identifier: AGPL-3.0-only
#
# Continuous integration — validates every PR + push to main. The CD/release/infra
# workflows are separate. (The enterprise package @alethia/ee is verified at standup,
# not here — community CI checks the open-source build.)

name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Historical native-queue trigger. `provision-e2e` still selects it, but Mergify does not emit
  # `merge_group`, so the T1 job currently has no live trigger (#4173). Keep the dead source visible
  # until T1's replacement home is decided; the weekly health report now fails loudly on its age.
  merge_group:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC — mutation testing (slow, non-blocking)
    # Nightly 03:00 UTC — the console UI conformance audit over EVERY route, so a route no PR
    # happened to touch is still measured.
    #
    # ADDING A CRON SIGNS UP MORE THAN THE JOB YOU ADDED IT FOR, in two different ways, and both
    # are handled here rather than discovered later:
    #
    #   · a job that gates on `github.event_name == 'schedule'` now also fires nightly — that is
    #     `mutation`, which is pinned to its own cron expression below;
    #   · a job with NO `if:` AT ALL fires on every trigger, so six jobs that ran weekly on the
    #     Monday cron would have started running nightly against `main` (schedule only fires on the
    #     default branch): `typescript`, `integration`, `guards`, `go`, `secrets` and
    #     `addon-charts-render`. Each now carries `if: github.event.schedule != '0 3 * * *'`.
    #
    # Two are deliberately NOT excluded, and the reason is not "it was missed":
    #   · `detect-changes` — `ui-audit` declares `needs: [detect-changes]`, and a job whose `needs`
    #     skipped is itself skipped, so excluding it would silently cancel the nightly audit;
    #   · `docs-prose` — it exists to ALWAYS report its status check (see its own comment), and on
    #     a schedule event every one of its steps is gated off by the `docs` filter, so it costs one
    #     idle runner rather than a Vale run.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      # ONLY the ts-coverage determinism probe reads this; every other job ignores it. It is here
      # because a run-count is the one knob a flap hunt actually needs, and today changing it means
      # editing a script and opening a PR — which is a poor way to ask "does it show up in 20?".
      #
      # MEASURED NEED (#3342): `apps/console/lib/billing` measures 957 or 958 of 1753 on the same
      # tree, and a 5-run dispatch on 2026-09-01 (run 33497231141) reported it DETERMINISTIC. That
      # is not evidence the flap is gone — it is evidence it is rarer than 1 in 5, and the only way
      # to say more is more runs.
      ts_probe_runs:
        description: "TS coverage determinism probe: how many runs to compare (default 5)"
        required: false
        default: "5"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Which surfaces does this PR touch? The heavy browser E2Es below stay OFF most PRs (Actions
  # minutes), but a PR that changes a surface an E2E covers turns that E2E into a PR gate — because
  # the alternative is what keeps happening: a suite that only runs post-merge lets a break ship
  # green. A whole Lexical composer rewrite shipped that way (→ `agent`); the "Org evidence" heading
  # the hero path waited for was deleted in an Evidence redesign and rotted for weeks (→ `console`,
  # below). Cheap (~15s) and dependency-free.
  detect-changes:
    name: Detect PR surface changes
    runs-on: ubuntu-latest
    outputs:
      agent: ${{ steps.filter.outputs.agent }}
      console: ${{ steps.filter.outputs.console }}
      docs: ${{ steps.filter.outputs.docs }}
      runner: ${{ steps.filter.outputs.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "agent=false" >> "$GITHUB_OUTPUT"
            echo "console=false" >> "$GITHUB_OUTPUT"
            echo "docs=false" >> "$GITHUB_OUTPUT"
            echo "runner=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # THREE-dot (merge-base): the PR's OWN changes only. Two-dot (`git diff base head`)
          # false-positives every filter the moment this branch falls behind base — it then lists
          # every file the base advanced past, so an unrelated PR would run the E2Es. (That is a
          # pre-existing bug this job carried; it over-ran, never under-ran, so it hid.)
          changed=$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")
          # `agent` — the narrow Elench/agent surface the Elench AI E2E drives.
          if echo "$changed" | grep -qE '^apps/console/(components/(agent|ui/message-scroller)|lib/(ai|stores/use-(elench|artifact|widget-grid))|app/api/agent|app/server/actions/(agent|artifacts|mentions)|e2e/elench)'; then
            echo "agent=true" >> "$GITHUB_OUTPUT"
          else
            echo "agent=false" >> "$GITHUB_OUTPUT"
          fi
          # `console` — the hero happy-path threads through nearly the whole console (auth → org →
          # connectors → canvas → evidence → clusters), so the filter is DELIBERATELY broad: any
          # console or shared-UI change can break it. The Evidence break proves narrow is a trap —
          # a page nobody thought of as "hero-related" broke the sellable flow. Better to run the
          # hero on a console PR that turns out not to touch it than to miss the one that does.
          # ⚠️ `packages/@repo/` matched NOTHING and silently halved this filter. The npm SCOPE is
          # `@repo/*`, but the DIRECTORY is `packages/<name>` — there has never been a
          # `packages/@repo/`. So the "shared-UI" arm was dead from the day it was written, and a
          # change confined to packages/ui or packages/brand skipped the hero gate entirely. That is
          # exactly how the `[ ]` bracket mark reached the base button variant and renamed every
          # control's accessible name from "Add" to "[Add]" without this job objecting. The list
          # below is the console's own @repo dependencies, by path.
          if echo "$changed" | grep -qE '^(apps/console/|packages/(ui|brand|assets|email|plan-catalog|platform|privacy|support)/)'; then
            echo "console=true" >> "$GITHUB_OUTPUT"
          else
            echo "console=false" >> "$GITHUB_OUTPUT"
          fi
          # `docs` — the Vale prose lint. Gate on the whole docs app so a change to the
          # .vale.ini / Alethia style / vocab re-runs the lint too, not just content edits.
          if echo "$changed" | grep -qE '^apps/docs/'; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs=false" >> "$GITHUB_OUTPUT"
          fi
          # `runner` — the inputs to the runner BINARY + its Docker image. The 2026-07-22 fleet-churn
          # incident came from apps/runner/Dockerfile.base shipping an arm64 binary in the amd64 image;
          # gate the amd64-ELF-arch guard on any change that could rebuild that binary/image (the
          # Dockerfiles, the runner/cli Go, and the shared Go the runner compiles in — packages/core +
          # go.work). A plain `go build` can't reproduce a Dockerfile ARG regression, so the guard
          # builds the real image — only run it when one of these actually changed. Also fire on a
          # change to THIS workflow, so an edit to the guard job itself re-validates it (and so its
          # introducing PR exercises it).
          if echo "$changed" | grep -qE '^(apps/runner/|apps/cli/|packages/core/|go\.work|\.github/workflows/ci\.yml$)'; then
            echo "runner=true" >> "$GITHUB_OUTPUT"
          else
            echo "runner=false" >> "$GITHUB_OUTPUT"
          fi

  typescript:
    name: TypeScript (lint · types · test · docs)
    runs-on: ubuntu-latest
    # NOT ON THE UI-AUDIT NIGHTLY. `schedule` fires every job with no `if:` at all, so the
    # 03:00 cron added for the console UI audit would have signed this one up for a nightly
    # run it never asked for — the same trap the cron block records for `mutation`, which
    # only covers jobs that gate on `schedule` in the first place. See ci.yml's `on.schedule`.
    if: github.event.schedule != '0 3 * * *'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # Persist Turbo's local cache across runs. Before this, only the pnpm store was cached, so every run
      # re-ran check-types/lint/test/build for EVERY package cold. Keyed per-sha with an os restore fallback,
      # so a PR restores the previous run's cache and Turbo only re-executes the packages that actually
      # changed (it replays cached logs for the rest). This is the single biggest CI-time win.
      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      # Turbo fans these out across EVERY workspace project that defines the script
      # (console, marketing, docs, blog, @alethia/ee, @repo/{ui,brand,plan-catalog}),
      # so new apps/packages are covered automatically — no hardcoded list to drift.
      - name: Type-check + lint (all workspace projects)
        run: pnpm exec turbo run check-types lint
      - name: Unit tests
        id: unit
        run: pnpm exec turbo run test
      # Coverage is merged into the self-hosted README badge by the `coverage-badge` job
      # (push-to-main); no third-party service. See scripts/coverage-badge.mjs + TESTING.md.
      - name: App build smoke (console · marketing · docs)
        run: pnpm exec turbo run build --filter=console --filter=marketing --filter=docs
        env:
          BETTER_AUTH_SECRET: build-time-placeholder
          BETTER_AUTH_URL: http://localhost:3000
          ALETHIA_DATABASE_URL: postgres://build:build@localhost:5432/build
          ALETHIA_APP_DATABASE_URL: postgres://build:build@localhost:5432/build
          ALETHIA_STORAGE_ENDPOINT: http://localhost:8333
          ALETHIA_STORAGE_ACCESS_KEY_ID: build
          ALETHIA_STORAGE_SECRET_ACCESS_KEY: build

      # PLACED AFTER THE BUILD SMOKE, DELIBERATELY.
      #
      # These steps carry no `if:`, and a job stops at its first failing step — so sitting them
      # BEFORE `App build smoke` meant a TRUE ratchet failure on apps/console would skip the other
      # two ratchets AND the production build. That build is the only check in this job that
      # catches what tsc and eslint structurally cannot: a module imported from both a server and a
      # client component type-checks, lints and unit-tests clean, then 500s the page at runtime.
      # Losing it to a coverage regression trades a real signal for a lesser one.
      #
      # Putting them last closes that with no conditions at all — everything that can inform the
      # author has already run by the time the ratchet is able to fail. See #2662 for the general
      # case: `guards` is 64 steps with zero `if:`, so its first failure skips the other 63.
      #
      # Per-directory statement-coverage RATCHET: coverage may rise, never fall. Reads the
      # coverage-final.json each project's vitest run wrote above — or that turbo REPLAYED from
      # cache, which is equally valid, because a cache hit means byte-identical inputs and the
      # `test` task now declares ALETHIA_EDITION in its cache key. It does NOT re-run the suite.
      #
      # No `working-directory`: the script resolves the repo root itself, so every project is
      # invoked identically and the fix command it prints needs no cd puzzle.
      #
      # No `if: always()`: when `Unit tests` fails there is no usable coverage artefact, and
      # reporting a coverage collapse on top of a test failure misattributes the cause.
      #
      # ONE STEP PER PROJECT, deliberately — a `--all` wildcard is how a project silently drops
      # out of the gate. Adding a project is a three-line edit here, and `--self-test` FAILS
      # until that edit is made: it asserts this file carries a step for every vitest project
      # that declares a coverage block.
      #
      # Every false-failure path is fail-open and enumerated F1..F10 in the script header. The
      # floors carry a fingerprint of the environment that recorded them — including whether
      # ee/dist existed, which is TRUE here.
      #
      # CORRECTION. This comment previously claimed the opposite: that apps/console depends on
      # @alethia/enterprise-api and NOT on @alethia/ee, so `test.dependsOn: ["^build"]` never
      # reaches it. That is wrong. `apps/console/package.json:201` declares `@alethia/ee` under
      # **optionalDependencies** — turbo's `^build` traverses it like any other workspace
      # dependency, so `turbo run test` BUILDS ee/dist and the console suite runs in ENTERPRISE
      # scope, here and on a laptop alike. Measured, not reasoned: the determinism probe checked
      # ee/dist ABSENT at job start, then recorded `"ee_dist": true` in the floors it wrote after
      # the suites — the build happened in between.
      #
      # The floors are still reachable BECAUSE of that, not despite it: this job and the probe run
      # the same `turbo run test`, so they build the same dist and measure the same scope. What was
      # wrong was the stated reason, and a fingerprint key whose rationale is inverted is one a
      # future reader will "fix" in the wrong direction.
      - name: Coverage ratchet — apps/console
        # Runs whenever the coverage ARTEFACT is trustworthy, which is the real precondition —
        # rather than inheriting the implicit success() that would let one project's ratchet hide
        # the other two's verdicts. NOT `always()`: with `Unit tests` failed there is no usable
        # artefact, and reporting a coverage collapse on top of a test failure misattributes the
        # cause. `!cancelled()` keeps it off a cancelled run.
        if: ${{ !cancelled() && steps.unit.outcome == 'success' }}
        run: node scripts/ts-coverage.mjs --project apps/console
      - name: Coverage ratchet — packages/ui
        # Runs whenever the coverage ARTEFACT is trustworthy, which is the real precondition —
        # rather than inheriting the implicit success() that would let one project's ratchet hide
        # the other two's verdicts. NOT `always()`: with `Unit tests` failed there is no usable
        # artefact, and reporting a coverage collapse on top of a test failure misattributes the
        # cause. `!cancelled()` keeps it off a cancelled run.
        if: ${{ !cancelled() && steps.unit.outcome == 'success' }}
        run: node scripts/ts-coverage.mjs --project packages/ui
      - name: Coverage ratchet — packages/plan-catalog
        # Runs whenever the coverage ARTEFACT is trustworthy, which is the real precondition —
        # rather than inheriting the implicit success() that would let one project's ratchet hide
        # the other two's verdicts. NOT `always()`: with `Unit tests` failed there is no usable
        # artefact, and reporting a coverage collapse on top of a test failure misattributes the
        # cause. `!cancelled()` keeps it off a cancelled run.
        if: ${{ !cancelled() && steps.unit.outcome == 'success' }}
        run: node scripts/ts-coverage.mjs --project packages/plan-catalog
      # apps/marketing and ee join the gate here. Both emitted NO coverage at all until now — they
      # ran `vitest run` with no `--coverage`, so there was no artefact and nothing for the ratchet
      # to hold. `ee/` is the LICENSED tier: the code customers pay for was the least measured
      # surface in the repository.
      #
      # Both land INERT: no floors file yet, so F1 fires and each exits 0. Arming follows once the
      # determinism probe has recorded numbers from CI. Same two-step bootstrap the other three
      # projects used, for the same reason — floors recorded on a laptop are not comparable to CI.
      #
      # These steps are not optional bookkeeping: `--self-test` FAILS while a project declares a
      # coverage block and has no step here, which is exactly how this change was caught mid-edit
      # ("no coverage-emitting vitest project lacks a ratchet step in ci.yml — apps/marketing, ee").
      - name: Coverage ratchet — apps/marketing
        if: ${{ !cancelled() && steps.unit.outcome == 'success' }}
        run: node scripts/ts-coverage.mjs --project apps/marketing
      - name: Coverage ratchet — ee
        if: ${{ !cancelled() && steps.unit.outcome == 'success' }}
        run: node scripts/ts-coverage.mjs --project ee
      # @repo/format joins ARMED on its first commit, at 61/61 statements. A pure-function
      # package — no I/O, no clock except one injected baseline, no React — so 100% is the
      # honest floor rather than an aspiration, and anything below it is a real gap. Floors
      # recorded with ee/dist present, which is what `turbo run test` produces here.
      - name: Coverage ratchet — packages/format
        if: ${{ !cancelled() && steps.unit.outcome == 'success' }}
        run: node scripts/ts-coverage.mjs --project packages/format
      # Build smoke for the split-affected apps — catches transpilePackages /
      # standalone breakage on PRs. Build-only placeholder env so the console's
      # strict zod config modules pass validation (mirrors apps/console/Dockerfile;
      # nothing is contacted — postgres-js + the S3 client connect lazily).

  integration:
    name: Integration (real Postgres + RLS)
    runs-on: ubuntu-latest
    # NOT ON THE UI-AUDIT NIGHTLY. `schedule` fires every job with no `if:` at all, so the
    # 03:00 cron added for the console UI audit would have signed this one up for a nightly
    # run it never asked for — the same trap the cron block records for `mutation`, which
    # only covers jobs that gate on `schedule` in the first place. See ci.yml's `on.schedule`.
    if: github.event.schedule != '0 3 * * *'
    # A throwaway Postgres mirroring the dev stack (compose uses postgres:17-alpine with the
    # same superuser/db). db:migrate then creates the least-priv `alethia_app` role + RLS, so
    # the suite exercises the real SQL query builders and the multi-tenant isolation boundary.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: alethia
          POSTGRES_PASSWORD: alethia-dev-secret
          POSTGRES_DB: alethia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alethia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Point at the CI service (the suite's setup.ts defaults to :5433 — these win).
      ALETHIA_DATABASE_URL: postgres://alethia:alethia-dev-secret@localhost:5432/alethia
      # A DISTINCT app-role URL so the RLS isolation assertion actually runs (not skipped).
      ALETHIA_APP_DATABASE_URL: postgres://alethia_app:alethia-app-dev-secret@localhost:5432/alethia
      ALETHIA_APP_DB_PASSWORD: alethia-app-dev-secret
      # OpenFGA (started as a step below — service containers can't override the image command, and
      # OpenFGA needs `run`). Makes the community↔enterprise PDP-parity suite actually execute
      # per-commit; REQUIRE=1 turns an OpenFGA-absent skip into a hard failure so parity can't
      # silently go dark (SOC2 CC6.1).
      OPENFGA_TEST_API_URL: http://localhost:8082
      ALETHIA_PDP_PARITY_REQUIRE: "1"
      # The same rule one level up, for the tier itself (#2669). 55 files gate on `describeIfDb`; if
      # the probe in tests/integration/db.ts cannot reach Postgres they ALL no-op and this REQUIRED
      # check goes green having run no RLS assertion at all. Until now the only thing stopping that
      # was the ordering of the steps below — `Migrate the test database` reds the job first — which
      # is an accident of sequence, not a check, and it would vanish the moment those steps were made
      # independent. This makes the requirement explicit and order-free.
      ALETHIA_INTEGRATION_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # In-memory OpenFGA for the PDP-parity test (it provisions its own store/model/tuples and
      # deletes them after — no datastore migration needed). Started via docker run so we can pass
      # the `run` command; HTTP 8080 → host 8082 (what OPENFGA_TEST_API_URL points at).
      - name: Start OpenFGA (in-memory) for PDP parity
        run: |
          docker run -d --name openfga -p 8082:8080 \
            -e OPENFGA_DATASTORE_ENGINE=memory openfga/openfga:v1.8.4 run
          for i in $(seq 1 40); do
            curl -sf http://localhost:8082/healthz && { echo "openfga up"; break; }
            [ "$i" = "40" ] && { echo "::error::OpenFGA did not become healthy"; docker logs openfga; exit 1; }
            sleep 1
          done
      - name: Migrate the test database (schema + programmables/RLS + app role)
        run: pnpm -C apps/console run db:migrate
      - name: Integration tests (real SQL query builders + RLS isolation + PDP parity)
        run: pnpm -C apps/console run test:integration

  e2e-browser:
    name: E2E (browser · Playwright hero path)
    runs-on: ubuntu-latest
    needs: [detect-changes]
    # Heavy (console build + Playwright), so it stays OFF most PRs to cut Actions minutes — but it
    # now RUNS on any PR that touches the console surface (detect-changes.console), because that is
    # the only pre-merge signal the hero path has. There is NO nightly hero run (e2e-nightly is
    # maintainer-gated real-cloud provisioning; e2e-ai-nightly drives the Elench journeys), and the
    # merge queue is off — so before this, a console change could break the sellable flow and only a
    # post-merge push would notice. That is exactly how the "Org evidence" assertion rotted for weeks.
    # Still runs on the merge queue, pushes, and manual dispatch as before.
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
      || needs.detect-changes.outputs.console == 'true'
    # Own parallel job, OFF the fast path: builds + boots the real console against a real Postgres
    # and drives the sellable happy-path in a headless browser (sign-in → org → connect-a-cloud
    # surface → design → Deploy/pending-changes → evidence/clusters). Fully hermetic: email-OTP with
    # the code scraped from the console log — no SES, no OAuth, no cloud creds. OpenFGA is left UNSET
    # so the community PostgresRbacPDP is the authz engine (no extra service). Same postgres:17 +
    # db:migrate as the Integration job above.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: alethia
          POSTGRES_PASSWORD: alethia-dev-secret
          POSTGRES_DB: alethia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alethia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Real Postgres service (superuser + least-priv app role created by db:migrate, for RLS).
      ALETHIA_DATABASE_URL: postgres://alethia:alethia-dev-secret@localhost:5432/alethia
      ALETHIA_APP_DATABASE_URL: postgres://alethia_app:alethia-app-dev-secret@localhost:5432/alethia
      ALETHIA_APP_DB_PASSWORD: alethia-app-dev-secret
      # Auth: a non-secret placeholder + same-origin base URL. Email-OTP only (no OAuth, no SES) →
      # the OTP is logged, which is the hermetic seam the spec reads.
      BETTER_AUTH_SECRET: e2e-browser-placeholder-secret
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # `next start` is production mode, but this hermetic job has no trusted ingress proxy.
      ALETHIA_AUTH_RATE_LIMIT: "0"
      # Storage placeholders (the S3 client connects lazily; the hero path uploads nothing).
      ALETHIA_STORAGE_ENDPOINT: http://localhost:8333
      ALETHIA_STORAGE_ACCESS_KEY_ID: e2e
      ALETHIA_STORAGE_SECRET_ACCESS_KEY: e2e
      # The Playwright webServer boots `next start` and tees stdout here; the OTP helper reads it.
      DEV_CONSOLE_LOG: /tmp/alethia-e2e-console.log
    steps:
      # `id:` so the upload at the bottom can ask whether there is a workspace — the `services:`
      # block above starts before this step, and its failure skips this one, not that one (#4084).
      - id: checkout
        uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Migrate the test database (schema + programmables/RLS + app role)
        run: pnpm -C apps/console run db:migrate
      # Build @alethia/ee FIRST. Its dist is gitignored and it has no prepare/postinstall
      # hook, and `pnpm -C apps/console run build` calls the console's own script — bypassing turbo,
      # so `build.dependsOn: ["^build"]` never fires. Without this, ee/dist/index.js does
      # not exist, getEnterprise()'s tolerant require throws, and lib/auth/scope.ts falls
      # back to `{ userId, orgId: userId }`.
      #
      # That fallback made this whole job VACUOUS: getOrgEvidence short-circuits to
      # EMPTY_EVIDENCE whenever actor.orgId === actor.userId, so the evidence page rendered
      # "No environments yet" regardless of data and the hero assertion could not fail. The
      # EE scope — the one production and the sandbox box actually run — was never tested.
      - name: Build @alethia/ee (the console resolves EE scope only when its dist exists)
        run: pnpm -F @alethia/ee build
      - name: Guard — ee/dist must exist, or the suite silently runs community scope
        run: |
          test -f ee/dist/index.js || {
            echo "::error::ee/dist/index.js missing — the console would fall back to community"
            echo "::error::scope (actor.orgId === userId), which makes org-scoped assertions vacuous."
            exit 1
          }
      - name: Build the console (production image the browser drives)
        run: pnpm -C apps/console run build
      - name: Install Playwright (Chromium + OS deps)
        run: pnpm -F console exec playwright install --with-deps chromium
      # Guard against a vacuous green: if the hero spec is ever renamed without updating the
      # project's testMatch, `playwright test --project=hero` would match 0 tests and could exit 0.
      # Fail loudly instead.
      - name: Guard — hero project must match at least one test
        run: |
          list=$(pnpm -F console exec playwright test --project=hero --list 2>&1) || { echo "$list"; exit 1; }
          echo "$list"
          echo "$list" | grep -qE "Total: [1-9][0-9]* test" || { echo "::error::--project=hero matched 0 tests (testMatch drift?)"; exit 1; }
      - name: Run the hero happy-path (Playwright boots `next start` via webServer)
        run: pnpm -F console exec playwright test --project=hero
      # Gated on the checkout, not on `!cancelled()` alone: a service container that fails to pull
      # skips every step here, and this one would then report SUCCESS having uploaded nothing (#4084).
      - name: Upload Playwright report
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/console/playwright-report/
          retention-days: 7

  ui-audit:
    name: UI conformance audit (console · non-required)
    runs-on: ubuntu-latest
    needs: [detect-changes]
    # NON-REQUIRED, DELIBERATELY, and the reason is on the record. This drives every private console
    # route through the live half of apps/console/docs/ui-conformance/RUBRIC.md (R1-R7, T5-T7) and
    # it WILL be red until the conformance lanes land — the baseline is captured separately (#3634),
    # and a suite that becomes a merge gate before anyone has read its findings is how #2417's
    # 320-test suite nearly went in. It is not in .mergify.yml's merge_conditions and not in the
    # protect-dev ruleset; scripts/ci/check-required-checks.mjs compares those two, so this job
    # joining a required check can only ever be a deliberate edit to both.
    #
    # WHEN: nightly at 03:00 UTC, and on demand. NOT on every console PR any more (#4173).
    #
    # It used to add `needs.detect-changes.outputs.console == 'true'`, so every console PR paid for
    # a console build, a Chromium install and a Postgres service — 11 minutes median — to produce a
    # result the job's own comment above promises WILL BE RED until the conformance lanes land. A
    # non-required check that is expected to fail teaches a reader to skim past it, and it was doing
    # that at the cost of a runner slot per console PR.
    #
    # That cost is not measured in minutes. Measured 2026-09-03 across 500 runs: jobs spend 5,376
    # minutes WAITING for a runner against 1,802 executing, with a zero-dependency job waiting a
    # median of 15 minutes. The currency is slots REQUESTED, so removing a job from the per-PR path
    # gives back more than its own runtime.
    #
    # ⚠️ WHAT THIS GIVES UP, stated so it can be reversed knowingly: a console PR no longer gets
    # per-PR conformance feedback. The nightly still drives every private route and still produces
    # the `ui-audit` artifact — that artifact is what R5's colour-contrast diagnosis is read from
    # (#4099). If a conformance lane starts needing per-PR feedback, put it back behind a LABEL
    # rather than the broad `console` filter, so the routes that want it pay and the rest do not.
    #
    # `github.event.schedule` is matched EXACTLY rather than `event_name == 'schedule'`, because
    # ci.yml also carries a Monday cron for the mutation job and a bare event_name test would
    # silently sign that job up for a nightly run too.
    if: >-
      github.event.schedule == '0 3 * * *'
      || github.event_name == 'workflow_dispatch'
    # Same hermetic recipe as the hero job: real Postgres, a production console booted by the
    # Playwright `webServer`, email-OTP with the code scraped from the teed log. No sandbox box, no
    # cloud credentials — this costs CI minutes, not an environment slot.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: alethia
          POSTGRES_PASSWORD: alethia-dev-secret
          POSTGRES_DB: alethia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alethia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ALETHIA_DATABASE_URL: postgres://alethia:alethia-dev-secret@localhost:5432/alethia
      ALETHIA_APP_DATABASE_URL: postgres://alethia_app:alethia-app-dev-secret@localhost:5432/alethia
      ALETHIA_APP_DB_PASSWORD: alethia-app-dev-secret
      BETTER_AUTH_SECRET: e2e-browser-placeholder-secret
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      ALETHIA_STORAGE_ENDPOINT: http://localhost:8333
      ALETHIA_STORAGE_ACCESS_KEY_ID: e2e
      ALETHIA_STORAGE_SECRET_ACCESS_KEY: e2e
      DEV_CONSOLE_LOG: /tmp/alethia-ui-audit-console.log
      # The audit is a LOAD TEST against its own server, and the limiter it trips is protecting
      # nothing here — this is a throwaway `next start` on localhost with a throwaway database.
      # apps/console/lib/config/auth.ts documents ALETHIA_AUTH_RATE_LIMIT=0 as exactly that escape
      # hatch. Why it is needed: lib/auth/index.ts trusts ONLY `cf-connecting-ip` for the bucket
      # key (prod is Cloudflare → Caddy → console), that header never arrives on a bare localhost
      # `next start`, and Better Auth's getIP returns null under NODE_ENV=production — so every
      # request in the run lands in ONE shared `no-trusted-ip|/get-session` bucket. The global rule
      # is 60s/100 and an ALLOWED request rewrites `lastRequest`, so the window only resets after
      # 60s of SILENCE on the key: it is 100 requests for the whole run, not 100 per minute. The
      # audit does ~270 page loads and every private page mounts `useSession`, so it rate-limits
      # itself and then reports its own 429s as R6 "failed request" defects on the pages under
      # test. Scoped to this job's env only — production policy is untouched.
      ALETHIA_AUTH_RATE_LIMIT: "0"
    steps:
      # `id:` so the two `!cancelled()` steps at the bottom of this job can ask whether there is a
      # WORKSPACE before they run. The `services:` block above starts in `Initialize containers`,
      # which is step ZERO — it runs BEFORE this checkout — so a failed image pull skips everything
      # here and leaves the tree empty, while `cancelled()` stays false. See #4084.
      - id: checkout
        uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Migrate the test database (schema + programmables/RLS + app role)
        run: pnpm -C apps/console run db:migrate
      # See the hero job: without ee/dist the console falls back to community scope
      # (actor.orgId === actor.userId) and every org-scoped surface renders empty — which would
      # make the whole audit a measurement of the wrong application.
      - name: Build @alethia/ee (the console resolves EE scope only when its dist exists)
        run: pnpm -F @alethia/ee build
      - name: Guard — ee/dist must exist, or the audit measures community scope
        run: |
          test -f ee/dist/index.js || {
            echo "::error::ee/dist/index.js missing — the console would fall back to community scope."
            exit 1
          }
      - name: Build the console (production image the browser drives)
        run: pnpm -C apps/console run build
      - name: Install Playwright (Chromium + OS deps)
        run: pnpm -F console exec playwright install --with-deps chromium
      # The route manifest IS the audit's denominator. If the seam raises — a moved route group, a
      # zero-route scan — every route below would be "audited" over nothing, so it is run here on
      # its own where the failure names itself. NOT piped: a pipe would report the pipe's exit code.
      - name: Guard — the route manifest resolves
        run: node scripts/lib/console-routes.mjs --summary
      - name: Guard — the audit project must match at least one test
        run: |
          list=$(pnpm -F console exec playwright test --project=audit --list 2>&1) || { echo "$list"; exit 1; }
          echo "$list"
          echo "$list" | grep -qE "Total: [1-9][0-9]* test" || { echo "::error::--project=audit matched 0 tests (testMatch drift?)"; exit 1; }
      - name: Run the UI conformance audit (Playwright boots `next start` via webServer)
        run: pnpm -F console exec playwright test --project=audit
      # THE JOB IS LEGITIMATELY, PERMANENTLY RED — R3, R5 and R6 carry real debt `LIVE_DEBT` owns —
      # so "did the check go green" answers nothing about any single lane. #3893 is the case that
      # made it concrete: it removed the topbar overlap, its check was red before and red after, and
      # the only way to see that it had worked was to break the run down by predicate BY HAND
      # (`R4 7 → 0, nothing else moved`). Nobody does that per lane, so an unreadable check gets
      # ignored — and an ignored check is one nobody notices going MORE red.
      #
      # This prints the per-predicate table to the run summary. It is a rendering of numbers that
      # already exist, not a new measurement, and it is NOT a step toward making the job required:
      # it cannot be while it is honestly red, and forcing it green by suppressing the debt is the
      # failure this wave exists to prevent.
      #
      # `!cancelled()` and NOT `success()`: the summary is worth most when the audit FAILED, which
      # is nearly always. It cannot turn a broken run into good news, and there are TWO ways a run
      # can be broken, which is worth stating separately because the first version of this comment
      # claimed only the first and read as though it covered both:
      #
      #   - a truncated ARTIFACT — a missing or empty `records` array, or no sections. It raises.
      #   - a withheld MEASUREMENT — `record()` rewrites every verdict for a withheld predicate to
      #     `NOT MEASURED`, so the array is FULL and only the verdicts changed. That is the shape
      #     this audit actually produces when a positive control breaks, and counting only FAIL
      #     scored it as zero: `R4 7 → 0`, a broken run wearing the exact shape of a fixed lane.
      #     A withheld predicate now carries a floor and no delta, and a section that is withheld
      #     end to end raises like the empty one it is.
      #
      # …and NOT `!cancelled()` alone (#4084). On run 33710964528 the postgres service failed to
      # pull, `Initialize containers` went red, all thirteen real steps were SKIPPED — and this one
      # ran anyway, against an empty workspace, so the last line of the job read
      # `Cannot find module … apps/console/scripts/audit-report.mjs` for a file that is present on
      # dev at 173450 bytes. The job's own log accused the console of a missing script. Conjoining
      # the checkout's outcome puts `Initialize containers` back as the last thing that failed.
      - name: Per-predicate summary of the audit, against the recorded baseline
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          node apps/console/scripts/audit-report.mjs \
            --step-summary=apps/console >> "$GITHUB_STEP_SUMMARY"
      # Same conjunct, milder symptom: on that run this step reported SUCCESS having uploaded
      # nothing, which is the harder half to notice.
      - name: Upload the audit report
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-audit
          path: |
            apps/console/playwright-report/
            apps/console/test-results/ui-audit*.json
          retention-days: 14

  e2e-elench-ai:
    name: E2E (browser · Elench AI journeys · scripted model)
    runs-on: ubuntu-latest
    needs: [detect-changes]
    # Heavy (console build + Playwright), so it stays OFF most PRs to cut Actions minutes — but it
    # now RUNS on any PR that touches the agent surface. It is the only test that drives the real
    # composer/rail/grid in a browser, and skipping it on PRs is how a broken Lexical composer
    # shipped green. Still runs on the merge queue, pushes, and manual dispatch as before.
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
      || needs.detect-changes.outputs.agent == 'true'
    # The Elench AI journeys end-to-end with a SCRIPTED model (ALETHIA_AI_MOCK=1 → the
    # MockLanguageModelV3 in lib/config/ai-mock). Only the model is deterministic: the agent
    # route, extended thinking, orchestration markers, TOOL EXECUTION (PDP-gated reads against
    # this real Postgres), metering, transcript persistence, widget auto-pin into thread_widgets,
    # artifacts and RLS all run for real. No API key, no flake, no cost. The real-model run is
    # the separate (non-gating) e2e-ai-nightly workflow.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: alethia
          POSTGRES_PASSWORD: alethia-dev-secret
          POSTGRES_DB: alethia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alethia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ALETHIA_DATABASE_URL: postgres://alethia:alethia-dev-secret@localhost:5432/alethia
      ALETHIA_APP_DATABASE_URL: postgres://alethia_app:alethia-app-dev-secret@localhost:5432/alethia
      ALETHIA_APP_DB_PASSWORD: alethia-app-dev-secret
      BETTER_AUTH_SECRET: not-a-secret-e2e-placeholder
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # `next start` is production mode, but this hermetic job has no trusted ingress proxy.
      ALETHIA_AUTH_RATE_LIMIT: "0"
      ALETHIA_STORAGE_ENDPOINT: http://localhost:8333
      ALETHIA_STORAGE_ACCESS_KEY_ID: e2e
      ALETHIA_STORAGE_SECRET_ACCESS_KEY: e2e
      DEV_CONSOLE_LOG: /tmp/alethia-e2e-console.log
      # The scripted model. NEVER set anywhere but an E2E console (unit-tested: the gate is
      # off by default and only the literal "1" engages it).
      ALETHIA_AI_MOCK: "1"
    steps:
      # `id:` so the upload at the bottom can ask whether there is a workspace — the `services:`
      # block above starts before this step, and its failure skips this one, not that one (#4084).
      - id: checkout
        uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Migrate the test database (schema + programmables/RLS + app role)
        run: pnpm -C apps/console run db:migrate
      # Build @alethia/ee FIRST. Its dist is gitignored and it has no prepare/postinstall
      # hook, and `pnpm -C apps/console run build` calls the console's own script — bypassing turbo,
      # so `build.dependsOn: ["^build"]` never fires. Without this, ee/dist/index.js does
      # not exist, getEnterprise()'s tolerant require throws, and lib/auth/scope.ts falls
      # back to `{ userId, orgId: userId }`.
      #
      # That fallback made this whole job VACUOUS: getOrgEvidence short-circuits to
      # EMPTY_EVIDENCE whenever actor.orgId === actor.userId, so the evidence page rendered
      # "No environments yet" regardless of data and the hero assertion could not fail. The
      # EE scope — the one production and the sandbox box actually run — was never tested.
      - name: Build @alethia/ee (the console resolves EE scope only when its dist exists)
        run: pnpm -F @alethia/ee build
      - name: Guard — ee/dist must exist, or the suite silently runs community scope
        run: |
          test -f ee/dist/index.js || {
            echo "::error::ee/dist/index.js missing — the console would fall back to community"
            echo "::error::scope (actor.orgId === userId), which makes org-scoped assertions vacuous."
            exit 1
          }
      - name: Build the console (production image the browser drives)
        run: pnpm -C apps/console run build
      - name: Install Playwright (Chromium + OS deps)
        run: pnpm -F console exec playwright install --with-deps chromium
      # Guard against a vacuous green (renamed spec → testMatch drift → 0 tests → exit 0).
      - name: Guard — elench-ai project must match at least one test
        run: |
          list=$(pnpm -F console exec playwright test --project=elench-ai --list 2>&1) || { echo "$list"; exit 1; }
          echo "$list"
          echo "$list" | grep -qE "Total: [1-9][0-9]* test" || { echo "::error::--project=elench-ai matched 0 tests (testMatch drift?)"; exit 1; }
      - name: Run the Elench AI journeys (scripted model, real pipeline)
        run: pnpm -F console exec playwright test --project=elench-ai
      # Gated on the checkout, not on `!cancelled()` alone: a service container that fails to pull
      # skips every step here, and this one would then report SUCCESS having uploaded nothing (#4084).
      - name: Upload Playwright report
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-elench-ai
          path: apps/console/playwright-report/
          retention-days: 7

  coverage-badge:
    name: Coverage badge (self-hosted)
    runs-on: ubuntu-latest
    # Only on push to main: regenerate coverage and commit the shields.io badge JSON the README
    # renders. No third-party service. `[skip ci]` on the commit avoids a run loop.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run unit suites (produces per-project coverage summaries)
        run: pnpm exec turbo run test
      - name: Compute merged coverage → badge JSON
        run: node scripts/coverage-badge.mjs
      # Publish UNCONDITIONALLY. There used to be an `if git diff --quiet -- <the badge>` guard
      # here, and it was a trap waiting for the tracked copy to go away.
      #
      # `git diff` compares the index and the working tree for TRACKED paths. It says NOTHING
      # about an untracked one — measured, both directions: on an untracked file
      # `git diff --quiet -- <path>` exits 0 ("clean") while `git status --porcelain -- <path>`
      # correctly prints `?? <path>`. The badge JSON is no longer checked in (it could never be
      # kept honest — this job runs only on push to main and publishes to `badges`, so it never
      # writes back to the tree, and the checked-in copy sat at 91% against a real 67.8%).
      # So the file coverage-badge.mjs writes is now always untracked, the old conditional would
      # always have reported "unchanged", and the badge would have frozen forever with this job
      # GREEN — the same swallowed-signal shape that left the Go badge advertising 21.6% against
      # a real 61.2% for five weeks.
      #
      # Dropping the conditional is safe precisely BECAUSE the file is untracked: each run starts
      # from a fresh checkout of main where it does not exist, so `git add` always stages a new
      # file and `git commit` can never fail with "nothing to commit".
      - name: Publish the badge
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # THE SIBLING BADGE HAS TO BE CARRIED FORWARD, OR PUBLISHING THIS ONE DELETES IT.
          #
          # Both badge jobs end in `git push --force origin HEAD:badges` — they publish main's
          # tree, with their own badge committed on top. That was survivable only while BOTH
          # JSONs were tracked in main: each job's tree carried its sibling's file along for the
          # ride. Now that neither is tracked, this job's tree contains only `coverage.json`, so
          # a force-push would drop `go-coverage.json` from `badges` — and the README's Go badge
          # would 404 on every push to main, with both jobs green. That is the exact
          # failure-with-a-green-check shape this PR exists to remove, so it must not be
          # reintroduced by the fix.
          #
          # Restoring the sibling from the branch we are about to overwrite makes the force-push
          # additive rather than destructive. `|| true` is correct ONLY here: on the very first
          # run the file legitimately does not exist yet, and this job does not own it.
          # `|| true` on the fetch would be a fail-open that silently reintroduces the deletion
          # this block exists to prevent: no FETCH_HEAD, no sibling restored, force-push drops it,
          # job green. So the ONLY tolerated absence is a `badges` branch that genuinely does not
          # exist yet (the very first publish); a fetch that FAILS against an existing branch reds
          # this job.
          if git ls-remote --exit-code --heads origin badges >/dev/null 2>&1; then
            git fetch --depth=1 origin badges
            # `checkout … || echo` would swallow EVERY failure of that command, not only the one
            # absence we mean to tolerate: a wrong FETCH_HEAD, a moved path or a locked index would
            # all print the same notice and then force-push the sibling away, green. So the
            # tolerated case is tested for explicitly and the checkout itself is strict.
            if git cat-file -e "FETCH_HEAD:.github/badges/go-coverage.json" 2>/dev/null; then
              git checkout FETCH_HEAD -- .github/badges/go-coverage.json
            else
              echo "::notice::no go-coverage.json on \`badges\` yet — nothing to carry forward"
            fi
          else
            echo "::notice::\`badges\` does not exist yet — first publish, nothing to carry forward"
          fi
          # -f is defensive: .gitignore carries a bare `coverage` rule, which does NOT match
          # `.github/badges/coverage.json` today (no path component is exactly `coverage`), but a
          # future broadening of that rule must not silently stop the badge instead of failing.
          git add -f .github/badges/
          # --no-verify: the repo's pre-commit hook (core.hooksPath) blocks direct
          # commits to main; this CI-authored badge commit is legitimate.
          git commit --no-verify -m "chore(ci): update coverage badge [skip ci]"
          # Publish to the unprotected orphan `badges` branch, NOT to main. `protect-main` is
          # enforcement:active with bypass_actors:[] and a pull_request rule, so a direct push
          # to refs/heads/main is refused with GH006 — contents:write on the token is
          # irrelevant, the ruleset denies the ref update. See publish_badge in the Go badge
          # job below for the full diagnosis; this badge was dead for the same reason.
          #
          # NO `|| true`. A push that cannot land must RED this job.
          git push --force origin HEAD:badges

  guards:
    name: Authz / open-core guards
    runs-on: ubuntu-latest
    # NOT ON THE UI-AUDIT NIGHTLY. `schedule` fires every job with no `if:` at all, so the
    # 03:00 cron added for the console UI audit would have signed this one up for a nightly
    # run it never asked for — the same trap the cron block records for `mutation`, which
    # only covers jobs that gate on `schedule` in the first place. See ci.yml's `on.schedule`.
    if: github.event.schedule != '0 3 * * *'
    # `issues: read` for check-exclusion-issues.mjs, the one network step in an otherwise hermetic
    # job. The workflow-level `permissions: contents: read` makes every unlisted scope NONE, so
    # without this `gh issue view` fails, the check reports "could not read the state" and — being
    # continue-on-error — becomes permanent background noise in which a genuinely CLOSED tracker
    # renders identically to the guard being broken. Every other workflow here that touches the
    # issues API declares it explicitly (programme.yml, workflow-health.yml, catalog-drift.yml, …).
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - id: setup
        run: pnpm install --frozen-lockfile
      - name: Open-core boundary (core must not import ee/)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm -C apps/console run check:ee-boundary
      - name: Repository-wide open-core boundary and community image contract
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:open-core
      - name: No @theme inline variable is overridden (inert responsive ladder)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:theme-inline
      # The `"use client"` on @repo/ui/button, and the note explaining it. Its absence produced
      # "Element type is invalid … got: undefined" on two separate pages and cost two long bisects —
      # tsc, eslint and the type checker are all blind to it, so only a production build sees it, at
      # request time. The note that says "keep it that way" then named two callers and one of them
      # was a DIFFERENT `buttonVariants` from fumadocs, in an app that does not even declare
      # @repo/ui. This derives the claim from the tree instead of restating it (#2677).
      - name: '@repo/ui/button keeps its client boundary, and its callers are client modules'
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:ui-client-boundary
      - name: ...and that check is not silently blind
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:ui-client-boundary -- --self-test
      # CLAUDE.md §6's shared-surface table, for the two rows where the rule is unambiguous:
      # @repo/format and @repo/ui/page-header. Before this, no row of that table was guarded by
      # anything — one `numeric` column rendered as `$12.50/mo`, `~$12/mo` and `€12.50`, and
      # in-app page titles rendered at five sizes. apps/console/shared-surface-allowlist.yaml
      # carries the documented exceptions and is shrink-only.
      - name: Console shared surface (@repo/format, @repo/ui/page-header) is not hand-rolled
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:shared-surface
      - name: ...and that check is not silently blind
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/check-shared-surface.mjs --self-test
      # The allowlist's `baseline:` and `debt:` are entry counts over its own rows, and the file is
      # shared by every conformance lane of #3613. Typed by hand they had two failure shapes: two
      # lanes writing DIFFERENT values conflict and the resolution is arithmetic (recount, then
      # probe N±1 to prove the number is unique), and two lanes writing the SAME value — ten rows
      # removed here, ten different rows removed there — merge cleanly and wrongly, failing on `dev`
      # and blaming whichever PR landed second. Derived, that second shape cannot happen. This runs
      # the generator and diffs, the same shape as the offer-parity / config-carriage gates below:
      # the comparison is against the committed FILE, not against a number the script recomputed.
      - name: Shared-surface ledger counters are derived from the rows, not typed
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          pnpm gen:shared-surface
          git diff --exit-code -- apps/console/shared-surface-allowlist.yaml \
            || { echo "::error::apps/console/shared-surface-allowlist.yaml's ledger counters are stale — run 'pnpm gen:shared-surface' and commit."; exit 1; }
      # The connector catalog's `icon_url`s. Eleven of the eighteen icon slugs it named had no file
      # behind them (#3802): the generator emitted every one verbatim into the TS registry AND
      # persisted it into `connectors.icon_url`, so the console asked for an asset that 404s on
      # every render of every connector surface and recovered into the monogram fallback — silently,
      # which is why it survived. Nothing ran this generator in CI either, so a stale
      # registry.generated.ts was equally invisible. Both halves are closed here: the run REFUSES a
      # dangling path, and the diff proves the committed output is what the manifest produces.
      - name: Every connector icon resolves, and the generated registry + seed are current
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # `node …` and not `pnpm -C apps/console run gen:connectors`, deliberately: the generator resolves
        # every path from its own module URL, so the direct call is identical, and it cannot inherit
        # whatever a package-manager wrapper decides to do with a non-zero exit code.
        run: |
          node apps/console/scripts/gen-connectors.mjs
          git diff --exit-code -- apps/console/lib/connectors/registry.generated.ts apps/console/lib/db/seed/connectors.generated.sql \
            || { echo "::error::apps/console/lib/connectors/registry.generated.ts or lib/db/seed/connectors.generated.sql is stale — run 'pnpm -C apps/console run gen:connectors' and commit."; exit 1; }
      - name: ...and that gate is not silently blind
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node apps/console/scripts/gen-connectors.mjs --self-test
      # scripts/lib/console-routes.mjs is the ONE definition of "the console's private route set" —
      # the denominator of every score the console-UI conformance wave reports. It raises rather
      # than returning [] on a renamed route group, an unreadable directory, two pages on one URL
      # and two spellings of one boundary, so running it over the real tree IS the check: a route
      # list nothing resolves is a clean bill of health over zero files.
      - name: The console's private route manifest still resolves
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:console-routes
      - name: ...and that manifest is not silently blind
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/lib/console-routes.mjs --self-test
      # RUBRIC.md's S1–S4 and T1–T4 scored over that same manifest, against the shrink-only
      # baseline in apps/console/route-states-baseline.yaml. It lands red-by-record rather than
      # red: today's tree HAS 45 failing route-predicate pairs, every one of them written into the
      # baseline, so the step is green until a route regresses or a recorded failure is fixed
      # without deleting its line. Nothing invoked this file between #3690 and here, which is the
      # failure mode it exists to catch — a baseline nothing re-runs goes stale on `dev` where the
      # regression cannot be attributed to the PR that caused it. Do NOT pipe this into
      # `tail`/`head`: the script's own header says so, because a pipe reports the exit code of
      # the LAST command in it.
      #
      # IT IS REQUIRED FROM THE MOMENT IT LANDED, AND THERE IS NO SOAK. #3781's body proposed
      # promoting it "once it has ridden a few PRs", but this job is `Authz / open-core guards`,
      # which `infra/github/variables.tf` lists as a required status check on `protect-dev` and
      # `.mergify.yml` requires by name — and the step carries no `continue-on-error`, so it has
      # blocked merges since it merged. The soak was never a state this step could be in.
      #
      # Left required deliberately rather than made real with `continue-on-error: true`: a gate
      # that reports green while finding something is the defect class this repo has shipped most
      # often, and this one is deterministic, sub-second, and green on `dev`. So the churn the
      # #3781 body identified is a CONTRACT, not a risk to measure: a PR that adds or renames a
      # private console route updates apps/console/route-states-baseline.yaml in the same commit.
      - name: Route states (RUBRIC.md S1-S4, T1-T4) have not regressed against the baseline
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:route-states
      - name: ...and that check is not silently blind
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/check-route-states.mjs --self-test
      # RUBRIC.md's family F — the console filter standard — scored over the console's fifteen
      # filter SURFACES (a `createFilterStore` call site, not a store module: one file holds
      # seven). Before #3796 nothing in the tree measured any of F1-F7 and the scoreboard rendered
      # the whole column `—`, which is the failure this wave exists to close: a report whose
      # "nothing found" branch is indistinguishable from "nothing measured".
      #
      # WHAT THIS STEP FAILS ON is narrower than it looks, deliberately. The per-surface F1-F6
      # verdicts are SCORED, not gated, here — they reach `apps/console/ui-conformance-baseline.json`
      # through the audit-report step below, which CI diffs against the tree, so a conformance
      # regression reds there naming the route that moved. What this one fails on is a BROKEN
      # SUBJECT SET: no surfaces, a store nobody reads, an unreadable console root, or a
      # facet-bearing server builder that `apps/console/tests/lib/queries/filter-standard-facets.test.ts`
      # neither drives nor declares. F7 is a behaviour (RUBRIC.md's "Family F" says so, with the reason),
      # so the only thing a static file can honestly say about it is whether the instrument still
      # covers its subject — and that is checked in BOTH directions, here and from the test.
      #
      # Do NOT pipe it into `tail`/`head`: a pipe reports the exit code of the LAST command in it.
      - name: The console filter standard (RUBRIC.md F1-F7) still has an instrument over its whole subject
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:filter-standard
      - name: ...and that check is not silently blind
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/check-filter-standard.mjs --self-test
      # The console's published conformance score. #3618 landed apps/console/scripts/audit-report.mjs
      # and the two artifacts it owns — apps/console/docs/ui-conformance/scoreboard.md and
      # apps/console/ui-conformance-baseline.json — with the two-mode contract PROGRAMME.md uses:
      # `--write` regenerates, a bare invocation checks them against the tree and exits 2 naming the
      # command that fixes it. Nothing invoked either mode, so the numbers could go stale on `dev`
      # the moment any conformance lane of #3613 landed — and a scoreboard nobody re-runs is exactly
      # the defect this wave exists to kill: a guard that reports green by never running. Measured
      # rather than predicted: this generator, run against #3809's type-scale tree, reds with both
      # artifacts STALE. It shells out to scripts/check-shared-surface.mjs in a child process and
      # reads only committed files, so it needs the checkout and `node` and nothing else — no build,
      # no database, no sandbox env — and takes about two seconds. Do NOT pipe either invocation
      # into `tail`/`head`: a pipe reports the exit code of the LAST command in it.
      #
      # `-C apps/console run`, NOT `-F console`, and that is the whole point of this step. MEASURED
      # on this branch's first CI run, before #3618's generator existed on `dev`: `pnpm -F console
      # audit:report` printed `None of the selected packages has a "audit:report" script` and EXITED
      # 0. Both steps concluded `success` having run nothing — a wiring step whose own failure mode
      # is the defect it was added to prevent. `pnpm -C apps/console run` fails that case loudly
      # (`ERR_PNPM_NO_SCRIPT`, exit 1) while still going through the package.json alias the error
      # message tells you to run, so a renamed or deleted script reds here instead of going quiet.
      - name: The console UI conformance scoreboard is in sync with the tree
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm -C apps/console run audit:report
      - name: ...and that generator is not silently blind
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm -C apps/console run audit:report --self-test
      # packages/brand/src/ramp-srgb.ts is a hand-maintained sRGB copy of the OKLCH ramp in
      # tokens.css, for the three surfaces that cannot read a custom property (email, Stripe
      # Elements across an iframe, next/og). It fixed three disagreeing transcriptions by
      # becoming a fourth, and nothing checked it. The CLI's lipgloss ink ramp is generated
      # FROM that file, so a drift here reaches the terminal and makes the CLI a mirror of a
      # copy. The check is arithmetic — every hex is recomputed from the `// oklch(...)`
      # comment each line carries — so it needs no fifth table to compare against.
      - name: Brand sRGB ramp is still a transcription of tokens.css
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:ramp-transcription
      - name: ...and that check is not silently blind
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/check-ramp-transcription.mjs --self-test
      # PROGRAMME.md replaced fifteen hand-maintained boards that had begun contradicting each
      # other in the tree while passing CI, and its §3 says the intent-half grep is "the only
      # structural reason a 16th hand-maintained board cannot re-emerge inside this very file" —
      # inside THAT file. Nothing stopped a new one appearing beside it, and nothing in CI read any
      # of the twelve. A status claim under docs/testing now either derives from the ledger with a
      # diff gate, or is declared with the reason it is still written by hand.
      - name: Every status claim under docs/testing is generated or declared
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:one-board
      - name: ...and that check is not silently blind
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/check-one-board.mjs --self-test
      - name: Runner self-image is baked, matches its job, and is multi-arch
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:runner-self-image
      - name: Community edition type-checks without enterprise activation
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          ALETHIA_EDITION: community
        run: pnpm -C apps/console run check-types
      - name: Installed dependency licence inventory has no unknown metadata
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm compliance:licenses
      - name: Generate workspace SBOM and community-source evidence
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          pnpm compliance:release
          pnpm source:community
      - name: Upload compliance evidence
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: compliance-${{ github.sha }}
          path: |
            dist/compliance
            dist/community-source
          if-no-files-found: error
          retention-days: 30
      - name: No Supabase
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm -C apps/console run check:no-supabase
      - name: No arbitrary var utility shadowed by an unlayered brand device
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:var-utility-shadowing
      - name: Authz scope (PDP, not ad-hoc user_id)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm -C apps/console run check:authz-scope
      - name: Guard — revalidatePath targets resolve to real routes
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm -C apps/console run check:revalidate-paths
      - name: Guard — no unauthorized "use server" action files
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm -C apps/console run check:action-boundary
      - name: Marketing routes ⇄ reservation ⇄ Caddy in sync
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm -C apps/console run check:marketing-routes
      - name: tsconfig.build.json excludes every un-shipped file (pruned-image type-check)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm -C apps/console run check:tsconfig-build
      # Dead code in the console (knip). The script first asserts that every `entry` glob in
      # apps/console/knip.json still matches at least one file on disk, and FAILS if one does
      # not: a knip run that resolves no entry points treats nothing as reachable, so it can
      # report a clean bill of health while having analysed nothing. "Nothing found" and
      # "nothing wrong" must not share an exit code.
      #
      # Fatal today: unused files, unused (dev)dependencies, unlisted/unresolved imports,
      # unlisted binaries, duplicate exports. Unused EXPORTS and TYPES are `warn` in knip.json
      # — they are printed on every run but do not fail it, because the console carries a
      # ~580-strong backlog of them that this lane's scope (knip.json + package.json) cannot
      # delete. Ratchet those two rules to "error" once that backlog is cleared.
      - name: Dead code — unused files, deps and binaries in the console (knip)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm -C apps/console run check:dead-code
      - name: Drizzle migration history is unforked (linear snapshot chain)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm -C apps/console run check:migrations
      - name: Every canvas offer is buildable on every cloud, or documented (offer parity)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm -C apps/console run check:offer-parity
      - name: Offer-parity matrix is in sync with the code
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          pnpm -C apps/console run gen:offer-parity
          git diff --exit-code -- docs/testing/offer-parity.md \
            || { echo "::error::docs/testing/offer-parity.md is stale — run 'pnpm -C apps/console run gen:offer-parity' and commit."; exit 1; }
      # The sibling of offer parity, on a different unit: offer parity asks whether a CHOICE the
      # canvas presents is buildable, this asks whether the VALUE a user typed reaches the plan. A
      # choice can be perfectly buildable while the number beside it is discarded — #1981 shipped a
      # cache allow-list that saved cleanly, provisioned nothing, and left the cache open.
      - name: Every value the product collects reaches the plan, or is documented (config carriage)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm -C apps/console run check:config-carriage
      - name: Config-carriage board is in sync with the code
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          pnpm -C apps/console run gen:config-carriage
          git diff --exit-code -- docs/testing/config-carriage.md \
            || { echo "::error::docs/testing/config-carriage.md is stale — run 'pnpm -C apps/console run gen:config-carriage' and commit."; exit 1; }
      # The third parity unit, and the one that closes a hole the first two structurally could not
      # see: BOTH of the guards above derive their surface from the canvas — offer parity from the
      # offer list, config carriage from user-settable columns. A capability that exists only as a
      # TEMPLATE VARIABLE is invisible to them, so no guard could red it and no deferral about it
      # could go stale. AWS envelope-encrypted Kubernetes Secrets for the entire life of the
      # templates while three clouds did not, unboarded and unexcluded (#2004).
      - name: Every asymmetric template variable is recorded (template parity)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm -C apps/console run check:template-parity
      - name: Template-parity board is in sync with the templates
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          pnpm -C apps/console run gen:template-parity
          git diff --exit-code -- docs/testing/template-parity.md \
            || { echo "::error::docs/testing/template-parity.md is stale — run 'pnpm -C apps/console run gen:template-parity' and commit."; exit 1; }
      - name: Keyless cells agree with the code that implements them
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm -C apps/console run check:keyless-cells
      # The canvas gates the IAM-auth toggle on this table (#1510). Hand-mirroring it would only
      # DETECT drift; generating it makes drift impossible — and the table churns (aws/gcp MySQL
      # opened four lanes after it was first written).
      - name: Keyless cell mirror is in sync with the renderer (keyless.go → keyless-cells.ts)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          pnpm -C apps/console run gen:keyless-cells
          git diff --exit-code -- apps/console/lib/cloud-providers/generated/keyless-cells.ts \
            || { echo "::error::Generated keyless-cells.ts is stale — run 'pnpm -C apps/console run gen:keyless-cells' and commit (source of truth: packages/core/manifests/keyless.go)."; exit 1; }
      # The inspector's per-cloud node-disk floors (#1972). Same shape: the floors live in the
      # templates' own `>= N` validations (the literals the Go constants are pinned to by
      # TestNodeDiskFloorsMatchTemplates); the canvas reads a generated mirror of them, so a floor
      # bump in a template that isn't regenerated here fails the build instead of drifting.
      - name: Node-disk floors are in sync with the templates (variables.tf → node-disk.ts)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          pnpm -C apps/console run gen:node-disk
          git diff --exit-code -- apps/console/lib/cloud-providers/generated/node-disk.ts \
            || { echo "::error::Generated node-disk.ts is stale — run 'pnpm -C apps/console run gen:node-disk' and commit (source of truth: each template's disk-size variable)."; exit 1; }
      # The offer surface — which canvas switches a user can actually see, per cloud. Derived by
      # EVALUATING the inspector schema's visibleWhen predicates, because they are closures over
      # (config, provider, capabilities) that no pattern-match can read. Checked in so the answer is
      # reviewable, and diffed so it cannot move silently: adding a gate to a field is a real change
      # to what the product offers, and until now it moved nothing a reviewer could see.
      - name: Offer surface is in sync with the inspector schema (config-schema.ts → offer-surface.json)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          pnpm -C apps/console run gen:offer-surface
          git diff --exit-code -- apps/console/lib/cloud-providers/generated/offer-surface.json \
            || { echo "::error::Generated offer-surface.json is stale — run 'pnpm -C apps/console run gen:offer-surface' and commit (source of truth: apps/console/components/design-project/canvas/inspector/config-schema.ts)."; exit 1; }
      # Same shape, same reason (#1621). Which secret stores a cluster can actually read is decided by
      # which store hook each provider registers in Go; the canvas greys out the rest. That answer was
      # a hand-written TS list of two slugs, free to drift from the hooks — and in the direction that
      # matters, a stale list lets the user pick a store the cluster will never resolve, surfacing at
      # deploy time as unresolved secrets rather than at config time. The paired Go test
      # (categories/secrets_runtime_read_mirror_test.go) proves the generator READ the source right.
      - name: Secrets runtime-read mirror is in sync with the hooks (secrets_*.go → secrets-runtime-read.ts)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          pnpm -C apps/console run gen:secrets-runtime-read
          git diff --exit-code -- apps/console/lib/connectors/generated/secrets-runtime-read.ts \
            || { echo "::error::Generated secrets-runtime-read.ts is stale — run 'pnpm -C apps/console run gen:secrets-runtime-read' and commit (source of truth: the saasSecretStore / keylessSecretStore hooks in packages/core/categories/secrets_*.go)."; exit 1; }
      - name: Project templates pin their providers (tofu lock files, no -upgrade)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm -C apps/console run check:tofu-lockfiles
      - name: Shipped version defaults are mutually compatible (compat matrix)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm -C apps/console run check:compat
      - name: CLI contract fixtures are in sync with the Zod contract
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          pnpm -C apps/console run gen:cli-fixtures
          git diff --exit-code -- packages/core/api/testdata \
            || { echo "::error::CLI fixtures are stale — run 'pnpm -C apps/console run gen:cli-fixtures' and commit (the Go contract test will then name any struct field to update)."; exit 1; }
      - name: Go enum constants are in sync with the drizzle enums
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          pnpm -C apps/console run gen:go-enums
          git diff --exit-code -- packages/core/types/enums_gen.go \
            || { echo "::error::Go enum constants are stale — run 'pnpm -C apps/console run gen:go-enums' and commit. The Go build + exhaustive lint then flag any switch/map to update."; exit 1; }
      # The brand's terminal projection. Two failures ride on one command, and they are
      # different problems with different fixes, so the generator distinguishes them itself:
      # a NEW TOKEN WITH NO PROJECTION makes it exit 1 without writing anything (its own
      # ::error:: names the token), and a stale committed file makes the diff below fire. The
      # first is the one this step exists for — a token added to the console that nobody
      # decided the CLI's answer for is invisible in every other check, and the two surfaces
      # drift by omission rather than by disagreement.
      - name: Every brand token is projected, lossy or refused (tokens.css → brand_gen.go)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          pnpm -C apps/console run gen:go-brand
          git diff --exit-code -- packages/core/types/brand_gen.go \
            || { echo "::error::The Go brand projection is stale — run 'pnpm -C apps/console run gen:go-brand' and commit (source of truth: packages/brand/src/tokens.css for the values, apps/console/scripts/lib/brand-projection.ts for the exact/lossy/none decisions)."; exit 1; }
      # The status vocabulary, on the same shape and for the same reason. The CLI decided a status
      # glyph from nine uppercase words with no case folding while the console decided it from 28
      # lower-cased keys; they disagreed on seven measured cases, and six pgEnums that shout on the
      # wire missed every arm of the Go switch. There is one table now and TypeScript owns it.
      #
      # As with the brand, TWO failures ride on one command and the generator distinguishes them
      # itself: a status word that NO pgEnum spells and that apps/console/scripts/lib/status-vocab.ts
      # does not account for makes it exit 1 without writing (its own ::error:: names the word),
      # and a stale committed file makes the diff below fire. The first is the one this step is for
      # — STATUS_TIER has no single owner, so a word added to it is a word the CLI renders with no
      # idea where it came from, and the two surfaces drift by OMISSION rather than by disagreement.
      - name: Every status word has a provenance (status-badge.tsx → vocab_gen.go)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          pnpm -C apps/console run gen:go-vocab
          git diff --exit-code -- packages/core/types/vocab_gen.go \
            || { echo "::error::The Go status vocabulary is stale — run 'pnpm -C apps/console run gen:go-vocab' and commit (source of truth: packages/ui/src/status-badge.tsx for the words and tiers, apps/console/lib/db/schema for their provenance, apps/console/scripts/lib/status-vocab.ts for the terminal projection)."; exit 1; }
      # The formatter contract both surfaces are held to. @repo/format decides what `47 min`,
      # `2h 15m` and `$12.50/mo` look like for the console; packages/core/format will be held to
      # the same table for the CLI, which today renders $12.50 as `$12/mo` (Go's %.0f rounds half
      # to EVEN) and runner minutes as `0`. The table is GENERATED from the TS implementation, so
      # it is a mirror of TS rather than a third opinion — and Go cannot write it, so a Go-only
      # change has no way to make itself right.
      - name: Formatter conformance table is in sync with @repo/format
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          pnpm -C apps/console run gen:format-conformance
          git diff --exit-code -- packages/format/conformance/format-cases.json \

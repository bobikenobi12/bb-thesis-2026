name: Infra - CP Alibaba

on:
  pull_request:
    paths:
      - 'infra/cp-alibaba/**'
  push:
    branches: [main]
    paths:
      - 'infra/cp-alibaba/**'

# A superseded run is not evidence about the head of the branch, and while it keeps a runner it is
# denying one to the run that is. `ci.yml`, `addon-render-determinism.yml` and the four workflows
# fixed on 2026-09-02 carry this; these nine did not.
#
# MEASURED 2026-09-03 over 500 runs / 6h24m: jobs spend 5,376 minutes WAITING for a runner against
# 1,802 executing, and 77 of 500 runs (15 percent) were cancelled — started, took a slot, thrown
# away. The currency is slots REQUESTED, so a superseded run costs the same as a useful one until
# it dies.
#
# `github.ref` and NOT `github.event.pull_request.number || github.ref`: this workflow also fires on
# `push`, where the number renders EMPTY and every push to `main` would collapse into one group,
# cancelling a real deploy-path run. `cla.yml` records that trap; it is PR-only, so it can use the
# number. `github.ref` is distinct for both events here.
concurrency:
  group: infra-cp-alibaba-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  TF_DIR: infra/cp-alibaba
  TOFU_VERSION: "1.10.10"

  # Alibaba Cloud provider auth (RAM access key).
  ALICLOUD_ACCESS_KEY: ${{ secrets.ALICLOUD_ACCESS_KEY }}
  ALICLOUD_SECRET_KEY: ${{ secrets.ALICLOUD_SECRET_KEY }}

  # OpenTofu variables.
  TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
  TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: OpenTofu Validate (no backend, no secrets)
        working-directory: ${{ env.TF_DIR }}
        # PR plans are validate-only: no backend, no cloud/state secrets reach a
        # PR job (the repo is contributor-facing). Real plan+apply run on main.
        run: |
          tofu init -backend=false
          tofu validate

      - name: IaC checks (fmt + tflint + Trivy)
        uses: ./.github/actions/iac-checks
        with:
          working-directory: ${{ env.TF_DIR }}

  apply:
    # Gated OFF by default. This is the "run the Alethia control plane ON Alibaba" OSS option,
    # NOT used by the hosted deploy (Hetzner) — its backend/creds are unconfigured, so an
    # auto-apply on push only fails. Set repo variable INFRA_ALIBABA_APPLY=true to enable when
    # actually deploying the control plane on Alibaba. The PR `plan` job still validates the tf.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.INFRA_ALIBABA_APPLY == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: OpenTofu Init
        working-directory: ${{ env.TF_DIR }}
        run: |
          tofu init -upgrade \
            -backend-config="bucket=terraform-state" \
            -backend-config="key=alibaba-cp/terraform.tfstate" \
            -backend-config="endpoint=${{ secrets.TF_STATE_S3_ENDPOINT }}" \
            -backend-config="region=${{ secrets.TF_STATE_S3_REGION }}" \
            -backend-config="access_key=${{ secrets.TF_STATE_S3_ACCESS_KEY_ID }}" \
            -backend-config="secret_key=${{ secrets.TF_STATE_S3_SECRET_ACCESS_KEY }}" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_metadata_api_check=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="skip_requesting_account_id=true" \
            -backend-config="skip_s3_checksum=true" \
            -backend-config="force_path_style=true"

      - name: OpenTofu Apply
        working-directory: ${{ env.TF_DIR }}
        run: tofu apply -auto-approve

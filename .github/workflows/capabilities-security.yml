#
# capabilities-security — the AUTOMATED, fail-closed required check that replaces the dropped #982
# CODEOWNERS review (a sole-owner human gate would deadlock the no-approval Mergify queue). It enforces
# the deterministic `alethia-security-review` invariants on the capabilities / connector / keyless
# surface: RLS registration of new tenant tables, the cross-provider-leak filter, no unsafe `as any` /
# `as unknown as` casts, and keyless-only (no static credentials). It does NOT enforce the
# `Record<string, unknown>`-on-known-shape-JSONB convention — see the script header for why.
#
# CRITICAL — no `paths:` filter. A path-filtered REQUIRED check never reports on an unrelated PR, which
# deadlocks that PR forever. So this runs on EVERY PR and the script NO-OP-PASSES (green) when no relevant
# path changed; it fails only when those paths changed AND an invariant is violated. Wired as a required
# check on the protect-dev ruleset (infra/github).
#
# Which files count as "relevant" is the whole gate, and it is guarded by the script's own `--self-test`,
# run in ci.yml's `guards` job (#1789) — not by this workflow.

name: capabilities-security

on:
  pull_request:

# A superseded run is not evidence about the head of the branch, and while it keeps a runner it is
# denying one to the run that is. `ci.yml` and `addon-render-determinism.yml` have carried this
# since they were written; these seven did not, and the gap only became expensive when the queue
# started landing PRs faster than a run takes to finish.
#
# MEASURED 2026-09-02 19:2xZ, with the dev queue draining: 48 runs queued against 2 in progress,
# and the single largest group was 23 runs headed `dev` — the standing `dev → staging` promotion
# PR #3562, which re-triggers every `pull_request` workflow on EVERY merge into dev. `CI` had
# already cancelled its own superseded runs and showed 1; these seven each showed a full stack.
#
# Scoped to `github.ref`, so this only ever cancels an OLDER run of the SAME workflow on the SAME
# PR or branch — the ordinary "I pushed again" case. It cannot cancel a run for a different ref.
concurrency:
  group: capabilities-security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capabilities-security:
    name: capabilities-security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the gate can diff base..head to find the PR's changed files.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Capabilities security gate
        env:
          # The PR base commit — the gate diffs GATE_BASE_SHA...HEAD to detect changed paths.
          GATE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/security/capabilities-gate.mjs

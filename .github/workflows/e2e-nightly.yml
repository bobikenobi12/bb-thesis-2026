#
# T2 — the real-infra nightly provisioning proof.
#
# Where T1 (ci.yml → provision-e2e) drives the real runner against a hermetic local
# `kind` cluster (no cloud, no cost, merge-queue-gated), T2 drives the SAME spine
# against a REAL cloud: a real runner binary claims a real DEPLOY job from a real
# Postgres-backed control plane and provisions a genuine ephemeral cluster from
# infra/templates/project/<provider>, then asserts the same RunDeployV2 outcomes
# (SUCCESS + cluster_ready + a signed ed25519 receipt + shipped logs + a Ready node),
# captures a committable proof, and tears down.
#
# TEARDOWN, PRECISELY (#2330). It is guaranteed on the SUCCESS and FAILURE paths, where the
# `always()` sweeper gets the job's remaining budget. It is NOT guaranteed on CANCELLATION: the
# runner kills the whole worker 4m45s after the cancel signal, and that budget is shared by every
# remaining `always()` step and every action `post:` step. This file used to say "GUARANTEES
# teardown" flatly; run 31459117502 left ~$105/month standing and proved the claim wrong.
# What covers that path is `e2e-orphan-reaper.yml`, out-of-band, plus the cancellation-only sweep
# below which wins the race in the common case without promising to.
#
# ─────────────────────────  Maintainer-gated (opt-in)  ─────────────────────────
# This provisions REAL, billable infrastructure, so it is OFF until a maintainer
# wires the cloud secret. When the required secret is absent the job SKIPS cleanly
# with a loud warning (never a false red); when the secret is present, any break is a
# HARD FAIL (never a false green). To enable Hetzner: add the repo secret
# `HCLOUD_TOKEN` (a scoped Hetzner Cloud API token). Cost per run is a single tiny
# Talos cluster (1 control plane + 1 worker, cpx22 amd64) up for ~15–25 min,
# torn down at the end — on the order of a few euro-cents. NOT cax11/ARM: the template
# defaults both node types to cpx22 because "cax11 (ARM) is capacity-unreliable and cpx11 is
# retired" (infra/templates/project/hetzner/variables.tf). This line said ARM, which also made
# the `imager_image.amd64` in a real failure look like a bug rather than the configured path.
# See demos/proofs/README.md.
#
# SAFETY: the Hetzner account is shared with prod. Teardown is guaranteed and always
# label-scoped to THIS run's unique cluster — never an account-wide delete (see
# scripts/e2e/hcloud-cleanup.sh and the scope-destructive-cloud-ops memory).

name: E2E Nightly (T2 · real cloud)

on:
  schedule:
    # 03:17 UTC nightly (off the hour to avoid the cron stampede) — the cheap GREEN-FLOOR smoke
    # (base provision + cluster_ready + ArgoCD Healthy, + A0.6 repos when wired).
    - cron: "17 3 * * *"
    #
    # ── THERE IS DELIBERATELY NO FULL-BAR CRON. ──
    #
    # The full bar (P2-F, #1068: ALETHIA_E2E_MAX_CONFIG=1 + ALETHIA_E2E_ALL_ADDONS=1 — 11 kinds +
    # 18 add-ons) used to run weekly on `17 5 * * 0`. It was REMOVED, because a schedule fired it
    # across the whole matrix while the pre-apply cost ceiling below is wired for **aws only**: on
    # gcp, azure, alibaba and hetzner a full bar provisioned the entire 11-kind surface with no
    # spend gate whatsoever. It also bought a standing monthly resource on alibaba every week —
    # `infra/templates/project/alibaba/modules/cr` creates `alicloud_cr_ee_instance` with
    # `payment_type = "Subscription"`, and the sweep that even DETECTS a survivor only landed on
    # 2026-08-11 (#2340), so earlier Sunday runs could leak one silently. Two weekly firings
    # (2026-08-09, 2026-08-16) produced #2382/#2383/#2384 and no committed proof row.
    #
    # Run a full bar by DISPATCH instead — one cloud at a time, watched (`full_bar: true` below).
    #
    # RE-ADDING IT is a per-cloud decision, not a global one, and it is gated: that cloud needs a
    # wired cost ceiling and a committed full-bar PASS row in demos/proofs/provisioning-e2e-log.md
    # first. `scripts/check-e2e-spend-guard.mjs` enforces the ceiling half of that — a cron that
    # resolves to `full` fails CI unless every provider in the matrix is priced or explicitly
    # exempted, so this cannot be reintroduced unguarded by editing one line.
    #
    # `scripts/e2e/resolve-dimension.sh` still MAPS `17 5 * * 0` to `full` on purpose: re-adding
    # the cron must work, and a cron whose dimension silently resolved to `floor` would run the
    # cheap shape while the ledger recorded a full bar.
  workflow_dispatch:
    inputs:
      provider:
        description: "Cloud to prove. Each green-skips until a maintainer wires its gate secret/var (hetzner: HCLOUD_TOKEN; aws: vars.E2E_AWS_ROLE_ARN; gcp: vars.E2E_GCP_WIF_PROVIDER; azure: vars.E2E_AZURE_CLIENT_ID; alibaba: vars.E2E_ALIBABA_ROLE_ARN) + applies its OIDC/WIF/RAM stack."
        type: choice
        options:
          - hetzner
          - aws
          - gcp
          - azure
          - alibaba
        default: hetzner
      region:
        description: "Cloud region/location override (blank ⇒ the per-provider cheap default: hetzner nbg1, aws us-east-1, gcp europe-west3-a, azure westeurope, alibaba eu-central-1). hetzner: nbg1/fsn1/hel1. NOTE gcp takes a ZONE: a bare region makes the GKE cluster regional, which multiplies every node count by the zone count AND skips the capacity preflight."
        type: string
        default: ""
      dimension:
        description: "Which DIMENSION to prove. Blank keeps the old floor/full_bar behaviour. The middle values were previously reachable ONLY from a laptop — a boolean cannot express them — so a cell whose cause had been fixed could sit stale with no way to re-drive it from CI. `gitops` is the A0.6 apps-repo + BYO Helm chart proof (renamed from `byo`, which still works); `byo-iac` is the separate seven-job customer-OpenTofu custody chain. Costs scale with the dimension, not with this input: addons and maxconfig are heavy, gitops/byo-iac/day2 are near-floor."
        type: choice
        options:
          - ""
          - floor
          - maxconfig
          - addons
          - gitops
          - byo-iac
          - byo
          - day2
          - cli-demo
          - full
        default: ""
      full_bar:
        description: "Run the FULL-BAR dimension (max-config: 11 kinds + all 18 add-ons) instead of the cheap green-floor smoke. Heavy + costly, and NO schedule fires it — a dispatch is the only way in. The raised cost ceiling applies on aws; gcp/azure/alibaba/hetzner are unpriced, so dispatch those one at a time and watch them."
        type: boolean
        default: false
      azure_redis_allow_known_bad:
        description: "AZURE ONLY, THIS RUN ONLY. Re-test an azure region whose Managed Redis capacity is a MEASURED failure. The pre-spend gate refuses westeurope/Balanced_B0 outright — run 33108860073 died ~1724s into a paid apply there with InsufficientCapacity, orphan risk likely (#3078) — and Azure publishes no capacity API to re-ask with, so the only way to learn whether capacity came back is to buy an apply. Tick this to buy it. Leave it off and the gate keeps refusing, which is the intended steady state. Deliberately an INPUT and not a repo variable: a variable would keep waving the refusal through on every nightly forever."
        type: boolean
        default: false
      argo_timeout:
        description: "ArgoCD convergence budget for THIS RUN ONLY, as a Go duration (e.g. 45m). Blank keeps vars.E2E_ARGO_TIMEOUT, and blank there keeps the derived default — which is now the MEASURED 35m for the 18-chart surface, not the 19m30s guess this input was added to test. It answered #2717 class (b) on run 33107415369: kube-prometheus-stack, loki and vault were slow, not stuck (all three cleared by 35m); falco and harbor were still Progressing and are real defects. Keep it for the next question of the same shape — a chart still Progressing with generous room is a ceiling, not a slow start."
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # ── Which dimension is this, resolved ONCE, before anything is built or bought. ──
  #
  # `provision` resolves the dimension again for its own env, from the SAME pure script with the
  # SAME inputs — that is mirroring one deriver, not forking it (#1755). This job exists only
  # because a job-level `if:` cannot call a script, and the runner-image build below has to be
  # skippable: it is 8 minutes that only a vault-installing dimension needs.
  resolve:
    name: Resolve dimension
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      dimension: ${{ steps.d.outputs.dimension }}
      heavy: ${{ steps.d.outputs.heavy }}
    steps:
      - uses: actions/checkout@v7
      - id: d
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_FULL: ${{ github.event.inputs.full_bar }}
          DISPATCH_DIMENSION: ${{ github.event.inputs.dimension }}
          SCHEDULE: ${{ github.event.schedule }}
          E2E_SOAK: ${{ vars.E2E_SOAK }}
        run: |
          dim="$(bash scripts/e2e/resolve-dimension.sh)"
          heavy="$(bash scripts/e2e/resolve-dimension.sh --heavy "$dim")"
          {
            echo "dimension=$dim"
            echo "heavy=$heavy"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::dimension=$dim heavy=$heavy"

  # ── The image the in-cluster bootstrap Jobs run, built FROM THE COMMIT UNDER TEST. ──
  #
  # WHY THIS EXISTS. `EnsureAddOnBootstraps` and `EnsureHetznerVault` render a one-shot Job whose
  # image is `selfimage.Ref()`. The e2e runs the runner as a NATIVELY BUILT BINARY, so neither
  # ALETHIA_RUNNER_IMAGE nor the baked ALETHIA_RUNNER_SELF_IMAGE is set, `Ref()` correctly returns
  # "", and both renderers fail closed with "refusing to render a Vault bootstrap Job with no
  # runner image". The add-on then sits Progressing forever. That is why `addon-vault` has never
  # been green on any cloud, and why hetzner/maxconfig's `secrets` cell — which needs a Ready
  # ClusterSecretStore, i.e. an actually-UNSEALED Vault — could not pass either (#3216).
  #
  # WHY NOT JUST POINT AT A PUBLISHED TAG. Because the e2e would then prove a DIFFERENT BINARY
  # than the one it is testing: a released image is built from some earlier commit, while
  # everything else in the run is built from this SHA. Two binaries in one run is how a regression
  # ships green — the run proves something nobody ships, or ships something nobody proved. So the
  # image is built here, from this commit, and consumed BY DIGEST (below) rather than by tag, so
  # there is no tag-reuse window and no `retag-unchanged` class of staleness to guard against.
  #
  # WHY IT IS ITS OWN JOB. `packages: write` and NOTHING else — no `id-token: write`, no cloud
  # credential step, no SSH. The `provision` job's permission block is untouched, so the job that
  # holds live credentials for five clouds never gains registry-write. Per-job permissions are
  # already how this workflow separates `provision` from `rollup`.
  runner-image:
    name: Publish the runner image the bootstrap Jobs run
    needs: resolve
    # Only a dimension that installs Vault needs it. `heavy` is true for exactly maxconfig, addons
    # and full — derived by resolve-dimension.sh from the FIDELITY, so it cannot drift from the
    # set of dimensions that switch ALL_ADDONS/MAX_CONFIG on.
    if: ${{ needs.resolve.outputs.heavy == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # amd64 only: every heavy node shape in this workflow is amd64 (t3/e2-standard/E2s_v3/cpx),
      # so the arm64 half deploy-console builds for the fleet would be 5 minutes bought for nothing.
      - name: Build runner-base (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/runner/Dockerfile.base
          platforms: linux/amd64
          build-args: |
            VERSION=${{ github.sha }}
          tags: ghcr.io/alethialabs-io/runner-base:e2e-${{ github.sha }}
          push: true
          # BOTH scopes, own first. This job WRITES e2e-runner-base-amd64, so reading only
          # deploy-console's scope meant every heavy dispatch paid the full build while the cache
          # it had just written was never read by anything. deploy-console's stays as the fallback
          # for the first run after a cache eviction — it is built from the same Dockerfile.
          cache-from: |
            type=gha,scope=e2e-runner-base-amd64
            type=gha,scope=runner-base-amd64
          cache-to: type=gha,mode=max,scope=e2e-runner-base-amd64
      - name: Build runner (amd64)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/runner/Dockerfile
          platforms: linux/amd64
          build-args: |
            VERSION=${{ github.sha }}
            RUNNER_BASE=ghcr.io/alethialabs-io/runner-base:e2e-${{ github.sha }}
            SELF_IMAGE=ghcr.io/alethialabs-io/runner:e2e-${{ github.sha }}
          tags: ghcr.io/alethialabs-io/runner:e2e-${{ github.sha }}
          push: true
          cache-from: |
            type=gha,scope=e2e-runner-amd64
            type=gha,scope=runner-amd64
          cache-to: type=gha,mode=max,scope=e2e-runner-amd64
      # Consume the DIGEST, never the tag. A tag can be moved; a digest names these exact bytes, so
      # the cluster cannot pull an image built from a different commit however the tag is reused.
      - name: Pin the digest
        id: ref
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [ -z "$DIGEST" ]; then
            echo "::error::the build produced no digest — refusing to hand the run an unpinned image"
            exit 1
          fi
          echo "image=ghcr.io/alethialabs-io/runner@${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "::notice::bootstrap Job image ghcr.io/alethialabs-io/runner@${DIGEST} (tag e2e-${GITHUB_SHA})"

  provision:
    name: Provision + verify + teardown (real cloud)
    needs: [resolve, runner-image]
    # `needs:` implies success(), and a skipped dependency is NOT a success — so without this the
    # whole provision matrix would silently skip on every non-heavy dimension (floor, gitops,
    # byo-iac, day2), which is every cheap run. `!cancelled()` rather than `always()` so a Ctrl-C
    # still cancels, and an explicit `!= 'failure'` so a BROKEN image build stops the run before it
    # buys a cluster it cannot finish.
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.runner-image.result != 'failure' }}
    runs-on: ubuntu-latest
    # `id-token: write` mints the GitHub OIDC token the AWS path exchanges for the
    # `alethia-e2e-nightly` role (aws-actions/configure-aws-credentials). This is SAFE: the
    # whole workflow triggers ONLY on `schedule` / `workflow_dispatch` — never `pull_request` /
    # `pull_request_target` — so no fork/PR can ever reach the token (program invariant 1,
    # enforced by scripts/check-workflow-oidc-isolation.mjs). `contents: read` stays the default.
    permissions:
      contents: read
      id-token: write
    # ── Federating from `dev` on a DISPATCH (the cadence unblock). ──
    #
    # The scheduled nightly federates as `repo:<repo>:ref:refs/heads/main`, because the crons only fire
    # on the default branch. That is correct for a timer and stays untouched: this expression is empty
    # on `schedule`, so the SCHEDULED spend surface does not widen at all.
    #
    # A DISPATCH is different. Every phase of the MVP programme is a loop of dispatch → read → fix, and
    # with a main-only subject each iteration first needs a promotion to `main` — which also ships the
    # product, because `main` triggers release-please, the console/fleet deploys and the CLI release. So
    # a dispatch declares the `e2e-dev` environment, whose OIDC subject is
    # `repo:<repo>:environment:e2e-dev`, and each cloud's trust admits that subject alongside the ref.
    #
    # WHAT ACTUALLY RESTRICTS IT TO `dev` is the environment's own deployment-branch policy (a single
    # custom policy, `dev`), enforced GitHub-side — not this line, and not the tofu trust, which only
    # says "this environment". That is deliberate: the branch list becomes an auditable control that
    # can be tightened without a `tofu apply`.
    #
    # THE COMPENSATING CONTROL, and the reason this is safe at all: a ruleset on `dev` requiring
    # CODEOWNERS review for `.github/workflows/**` and `infra/**`. Widening to `dev` is only dangerous
    # because Mergify auto-lands PRs there and CODEOWNERS is advisory off `main`/`staging`; two globs
    # remove exactly that path — a PR editing the file that HOLDS the credential — and leave every other
    # lane autonomous. Required *reviewers* on the environment are deliberately NOT set: that would put
    # a human in every run, which is the thing being removed.
    environment: ${{ github.event_name == 'workflow_dispatch' && 'e2e-dev' || '' }}
    # Hard cost cap: even if every finer timeout failed, the job cannot bill past this.
    # Raised 60→90 to fit the opt-in day-2 SOAK window (BYOC A0.3): the base
    # deploy→ArgoCD→teardown chain still finishes well inside the old bound (a tiny Talos
    # cluster provisions in ~10-15m), and the soak adds a bounded ~10-25m of day-2 loops on
    # that same cheap cluster (cents/hour). The finer step timeout below kills a hang first.
    #
    # The raise is conditional because a fabric-demo night roughly doubles the billed cluster-hours
    # per cloud; with E2E_FABRIC_DEMO unset the bound is unchanged and so is the cost.
    #
    # ⚠️ THESE TWO NUMBERS ARE NOT THE LADDER — they are its outermost rung, and they are VERIFIED
    # rather than reasoned about. `test/e2e/cmd/t2budget` computes the ladder from the harness's own
    # arithmetic (ResolveT2Budget) at the top of the T2 step and FAILS THE STEP if this cap cannot
    # contain it. That check exists because the previous numbers were wrong for four of five clouds:
    # the old comment asserted a "40m base" ctx, which is HETZNER's (25m deploy wait), while every
    # managed cloud waits 50m and the workflow turns the soak on by default (`vars.E2E_SOAK || '10m'`
    # below) — a real ctx of 90m against a 75m step cap. The step killed the process before the ctx
    # could cancel, which loses the named scenario failure AND skips the in-process t.Cleanup
    # teardown, leaking the cluster to the sweeper. Do not hand-tune these; run t2budget.
    #
    # 160 → 180 (fabric 265 → 275) with #2717's measured ArgoCD budget. See the step cap below for
    # the arithmetic; the two move together, and TestArgoBudgetCeilingFitsTheWorkflowCaps now holds
    # them to it offline instead of leaving it to t2budget on a paid run.
    #
    # 180 → 195 (fabric 275 → 290) with the managed teardown window's 30m → 45m, measured on
    # aws/floor run 33155063965. Same rule as every other move here: the ladder rung moved, so its
    # outermost backstop moves with it, and the offline guard is what said so.
    timeout-minutes: ${{ vars.E2E_FABRIC_DEMO != '' && 300 || 205 }}
    # Serialize PER PROVIDER: never let two nightly runs provision into the SAME shared
    # cloud account at once — but let DIFFERENT providers run concurrently (they share no
    # account, and serializing them would stretch the nightly to the sum of every cloud).
    #
    # This MUST live on the job, not the workflow: `matrix.provider` does not exist at
    # workflow level. The old workflow-level group keyed off `github.event.inputs.provider`,
    # which is NULL on the `schedule` trigger — so on the nightly (the only run that
    # matters) every provider collapsed into the single literal fallback group, silently
    # serializing the whole matrix.
    #
    # cancel-in-progress:false so an in-flight run finishes (and tears down) before the next
    # starts — a cancelled mid-apply run would leak, and though the always() cleanup would
    # catch it, not racing is safer.
    concurrency:
      group: e2e-nightly-${{ matrix.provider }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      # Never run more than 3 real provisions at once (cost + shared-account API pressure);
      # the per-provider concurrency group already serializes same-cloud runs (BYOC A3.2).
      max-parallel: 3
      matrix:
        # On the nightly `schedule` run the full set; on a manual `workflow_dispatch` run ONLY
        # the chosen provider (so dispatching "aws" doesn't also spin up hetzner). Derived from
        # the input so the choice list is the single source of truth. Every provider is in the
        # schedule set but each GREEN-SKIPS until a maintainer sets its gate secret/var (the
        # established inert pattern) — so setting the gate IS the "enable on cron" action, by
        # design, and only happens AFTER that cloud's manual dispatch + kill-drill. To add a
        # cloud: extend the `options:` above, this array, the gate `case`, the credential step,
        # and the sweeper `case` in teardown.
        provider: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.event.inputs.provider)) || fromJSON('["hetzner","aws","gcp","azure","alibaba"]') }}
    services:
      # Mirrors ci.yml's integration/provision-e2e jobs: a throwaway Postgres that
      # db:migrate turns into the real control-plane schema + programmables
      # (claim_next_job / update_job_status / insert_job_log) the runner exercises.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: alethia
          POSTGRES_PASSWORD: alethia-dev-secret
          POSTGRES_DB: alethia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alethia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The gated cloud secret. Empty when a maintainer hasn't opted in → the gate
      # skips the real work. Also read directly by the T2 runner process (HCLOUD_TOKEN
      # is the env var the hcloud/imager/talos providers authenticate from).
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      # Hetzner OBJECT STORAGE — a SECOND, unrelated credential pair, and the only way the `bucket`
      # kind can be proven on hetzner. Object Storage is S3-compatible and driven through the
      # aminueza/minio provider; HCLOUD_TOKEN does not authenticate it, and Hetzner has no API to mint
      # these (a human generates them in the console), so they cannot be derived from anything already
      # here. Unset is fine for a FLOOR run — no bucket is seeded, and the runner simply omits the
      # tfvars. On a FULL-BAR run the hetzner row's credential gate (hetznerCredsPresent,
      # test/e2e/t2_providers.go) HARD-FAILS on them before any spend, because the alternative is a
      # full cluster provisioned and then an apply that dies at the bucket.
      HETZNER_S3_ACCESS_KEY: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
      HETZNER_S3_SECRET_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
      # The AWS gate. A repo VARIABLE (not a secret — a role ARN is not sensitive), so it can
      # be read in a plain `if:`/`case`. Empty until a maintainer applies infra/aws-oidc and
      # sets it → the aws path green-skips (mirrors the HCLOUD_TOKEN gate). The role itself is
      # assumed via OIDC below; no long-lived AWS keys ever exist.
      E2E_AWS_ROLE_ARN: ${{ vars.E2E_AWS_ROLE_ARN }}
      # The GCP/Azure/Alibaba gates — all keyless, all repo VARIABLES (an OIDC/WIF handle is not
      # sensitive). Empty until a maintainer applies that cloud's e2e stack (infra/gcp-e2e /
      # infra/azure-e2e / infra/alibaba-e2e) and sets the var → that path green-skips. GCP uses
      # Workload Identity Federation (no key file); Azure a federated Entra app; Alibaba a RAM
      # OIDC role. The gate var is the WIF provider / client id / role ARN respectively.
      E2E_GCP_WIF_PROVIDER: ${{ vars.E2E_GCP_WIF_PROVIDER }}
      E2E_GCP_SA_EMAIL: ${{ vars.E2E_GCP_SA_EMAIL }}
      E2E_AZURE_CLIENT_ID: ${{ vars.E2E_AZURE_CLIENT_ID }}
      E2E_AZURE_TENANT_ID: ${{ vars.E2E_AZURE_TENANT_ID }}
      E2E_AZURE_SUBSCRIPTION_ID: ${{ vars.E2E_AZURE_SUBSCRIPTION_ID }}
      # AZURE SELF-ADMIN (BYOC A2.2) — the Entra group object id from infra/azure-e2e's
      # `aks_admin_group_object_id` output. t2_providers.go reads THIS env var and maps it into the
      # cluster snapshot's `aks_admin_group_object_ids` tfvar, which is what authorizes the runner's
      # AAD token as AKS cluster-admin AT CREATE TIME. AKS AAD-integrated RBAC has no post-hoc
      # escalation path, so leaving it unset does not degrade gracefully: the cluster comes up and
      # the runner is simply not authorized on it — the leg then fails as "cluster provisioned but
      # not reachable — AUTH REJECTED", the same shape as the EKS #1040 outage. Empty is still fine
      # for every non-azure leg (the mapper no-ops unless provider == azure).
      ALETHIA_E2E_AZURE_ADMIN_GROUP_OBJECT_ID: ${{ vars.ALETHIA_E2E_AZURE_ADMIN_GROUP_OBJECT_ID }}
      E2E_ALIBABA_ROLE_ARN: ${{ vars.E2E_ALIBABA_ROLE_ARN }}
      E2E_ALIBABA_OIDC_PROVIDER_ARN: ${{ vars.E2E_ALIBABA_OIDC_PROVIDER_ARN }}
      ALETHIA_DATABASE_URL: postgres://alethia:alethia-dev-secret@localhost:5432/alethia
      ALETHIA_APP_DATABASE_URL: postgres://alethia_app:alethia-app-dev-secret@localhost:5432/alethia
      ALETHIA_APP_DB_PASSWORD: alethia-app-dev-secret
      # A missing prerequisite/token, once we've decided to run, is a HARD FAIL — never
      # a green skip. (The gate below decides WHETHER to run; this makes the run honest.)
      ALETHIA_E2E_T2_REQUIRE: "1"
    steps:
      - uses: actions/checkout@v7

      # ── Proof-scrub self-test (BYOC A0.4). Runs UNCONDITIONALLY (no cloud, no secret) so
      #    the proof-bundle secret scrub is exercised on every nightly/dispatch: it seeds a
      #    fake secret of every shape, scrubs it, and asserts the tripwire is non-vacuous.
      #    A regression in the denylist reds the workflow here, before any capture runs. ──
      - name: Proof-scrub self-test (denylist non-vacuity)
        run: bash demos/proofs/scrub.sh --self-test

      # ── Secret gate: decide whether the real proof runs. Absent secret ⇒ skip
      #    cleanly with a LOUD warning (never red). Present ⇒ run for real. Secrets
      #    can't be used in a job-level `if:`, so we gate every heavy step on this
      #    step's output instead. ──
      - name: Gate on the provider secret
        id: gate
        env:
          PROVIDER: ${{ matrix.provider }}
        run: |
          case "$PROVIDER" in
            hetzner) TOKEN="$HCLOUD_TOKEN";              SECRET_NAME="HCLOUD_TOKEN (repo secret)" ;;
            aws)     TOKEN="$E2E_AWS_ROLE_ARN";          SECRET_NAME="E2E_AWS_ROLE_ARN (repo variable)" ;;
            gcp)     TOKEN="$E2E_GCP_WIF_PROVIDER";      SECRET_NAME="E2E_GCP_WIF_PROVIDER (repo variable)" ;;
            azure)   TOKEN="$E2E_AZURE_CLIENT_ID";       SECRET_NAME="E2E_AZURE_CLIENT_ID (repo variable)" ;;
            alibaba) TOKEN="$E2E_ALIBABA_ROLE_ARN";      SECRET_NAME="E2E_ALIBABA_ROLE_ARN (repo variable)" ;;
            *) echo "::error::unknown provider '$PROVIDER'"; exit 1 ;;
          esac
          if [ -n "$TOKEN" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "::notice::T2 real-cloud proof ENABLED for $PROVIDER ($SECRET_NAME present) — provisioning a real ephemeral cluster."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning::T2 real-cloud proof SKIPPED for $PROVIDER — repo secret $SECRET_NAME is not set. This nightly is a no-op (green) until a maintainer opts in. To enable it: docs/testing/e2e-nightly-enablement.md (apply the stack, set the companion vars FIRST, dispatch this cloud alone, kill-drill, then set the gate)."
          fi

      # A gate-off matrix job still exists in the Actions jobs API, so job existence cannot say
      # whether this cloud ran. Emit the same run-scoped summary contract as a real proof instead:
      # the rollup can then distinguish an explicit inert leg from a job that started but failed
      # before proof capture. If the gate itself fails, this step does not run and the missing
      # current-run summary remains a hard failure.
      #
      # `emitted_by: "gate-off"` is this emitter declaring its own provenance (#1922). The rollup
      # currently INFERS it — `is_gate_off_summary()` checks the directory is literally
      # `gate-<run_id>-<attempt>` and that the payload has no `deploy_stage` — and says so itself:
      # "The airtight fix is for the gate-off step to STAMP its own provenance
      # (e.g. `emitted_by: \"gate-off\"`), which this rollup would then read." Without it, renaming
      # this step's OUT path silently turns every inert leg into a false red, from a file that
      # never mentions this one. Purely ADDITIVE: the path and every existing field are unchanged,
      # so the existing inference keeps working until the rollup is taught to prefer the stamp.
      - name: Record gate-off proof
        if: steps.gate.outputs.run == 'false'
        env:
          PROVIDER: ${{ matrix.provider }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          OUT="demos/proofs/${PROVIDER}/gate-${RUN_ID}-${RUN_ATTEMPT}"
          mkdir -p "$OUT"
          jq -n \
            --arg provider "$PROVIDER" \
            --arg run_tag "nightly-${RUN_ID}-${RUN_ATTEMPT}" \
            --arg verdict "${PROVIDER}: SKIPPED — gate off, no secret/var wired" \
            '{provider: $provider, run_tag: $run_tag, outcome: "skipped", emitted_by: "gate-off", verdict: $verdict}' \
            > "$OUT/provision-summary.json"

      # ── Deterministic, unique-per-run cluster identity + region. `<project>-<env>` is the
      #    logical run identity: for hetzner it IS the `cluster` label every resource carries;
      #    for the managed clouds the unique handle is the `alethia:environment-id=<env>` tag
      #    (env = run_id-attempt) that label-at-source stamps and every sweeper filters on — so
      #    the belt-and-suspenders cleanup can only ever match THIS run either way. Region:
      #    the dispatch input wins; otherwise the per-provider cheap default. AWS MUST be
      #    us-east-1 — the alethia-e2e-nightly role is region-locked there (infra/aws-oidc),
      #    and eu-central-1 is a prod region the role forbids. Exported as the generalized
      #    ALETHIA_E2E_REGION (the T2 harness reads this for every provider). ──
      - name: Compute unique cluster name + region
        if: steps.gate.outputs.run == 'true'
        env:
          REGION_INPUT: ${{ github.event.inputs.region }}
          PROVIDER: ${{ matrix.provider }}
        run: |
          PROJECT="alethia-nl"
          ENVNAME="${{ github.run_id }}-${{ github.run_attempt }}"
          case "$PROVIDER" in
            hetzner) DEFAULT_REGION="nbg1" ;;
            aws)     DEFAULT_REGION="us-east-1" ;;
            gcp)     DEFAULT_REGION="europe-west3-a" ;;
            azure)   DEFAULT_REGION="westeurope" ;;
            alibaba) DEFAULT_REGION="eu-central-1" ;;
            *) echo "::error::unknown provider '$PROVIDER'"; exit 1 ;;
          esac
          REGION="${REGION_INPUT:-$DEFAULT_REGION}"
          {
            echo "E2E_PROJECT=$PROJECT"
            echo "E2E_ENV=$ENVNAME"
            echo "E2E_CLUSTER=$PROJECT-$ENVNAME"
            echo "E2E_REGION=$REGION"
            # Generalized region the T2 harness resolves for every provider (resolveT2Region).
            echo "ALETHIA_E2E_REGION=$REGION"
            # Wall-clock anchor for the proof bundle's duration_seconds (BYOC A0.4).
            echo "ALETHIA_E2E_PROOF_START_EPOCH=$(date -u +%s)"
          } >> "$GITHUB_ENV"
          echo "::notice::T2 cluster for this run: $PROJECT-$ENVNAME ($PROVIDER, region $REGION)"

      # ── Resolve the FULL-BAR dimension (P2-F, #1068). Off by default, and no schedule turns it on
      #    any more (see the `on.schedule` block) — a workflow_dispatch with full_bar=true is the only
      #    live path. The cron branch in resolve-dimension.sh is kept for the day one is re-added.
      #    When on, export ALETHIA_E2E_MAX_CONFIG=1 + ALETHIA_E2E_ALL_ADDONS=1 (the T2 harness reads
      #    these from the process env — $GITHUB_ENV carries them into the go-test step) so the run
      #    proves all 11 resource kinds land in tofu state AND all 18 marketplace add-ons converge.
      #    E2E_DIMENSION labels the rollup's ledger row and its issue titles; E2E_HEAVY_SHAPE gates
      #    BOTH the node pool below and the raised aws cost ceiling, because those two must price the
      #    same cluster. $GITHUB_ENV is per-JOB, so neither reaches the rollup job — it calls the SAME
      #    resolve-dimension.sh rather than retyping the cron (#1755).
      #
      #    This MUST resolve BEFORE the cluster shape is chosen: the two are coupled, because the
      #    full-bar surface needs a bigger node pool than the cheap floor (see the next step). It used
      #    to run after, so a full-bar run kept the 1-node floor shape and died on the FT-5 guard
      #    before provisioning anything (#1259). ──
      - name: Resolve full-bar dimension
        if: steps.gate.outputs.run == 'true'
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_FULL: ${{ github.event.inputs.full_bar }}
          DISPATCH_DIMENSION: ${{ github.event.inputs.dimension }}
          SCHEDULE: ${{ github.event.schedule }}
          # The soak window a maintainer chose, forwarded so fidelity_env can honour it on the
          # dimensions the soak belongs to. `vars.` is not automatically in a step's environment, so
          # WITHOUT this line the table would silently fall back to 10m and a widened window set on
          # the repo would be quietly ignored — a regression hidden inside a fix.
          E2E_SOAK: ${{ vars.E2E_SOAK }}
        run: |
          # ONE deriver, every consumer (#1755). This step, the rollup's issue titles and the parity
          # ledger all read the answer from scripts/e2e/resolve-dimension.sh — which owns the
          # `17 5 * * 0` cron string and is self-tested — instead of each retyping the comparison.
          dim="$(bash scripts/e2e/resolve-dimension.sh)"
          # E2E_HEAVY_SHAPE is NOT `full` by another name, and the difference is the bug it fixes.
          # The node shape and the cost ceiling both used to key on E2E_FULL_BAR, which is true for
          # exactly ONE of the six dimensions — so `maxconfig` and `addons` provisioned the cheapest
          # floor pool and then asserted a surface that cannot fit on it. Derived by the same script
          # that owns the fidelity, from the fidelity, so the two cannot disagree (#1755).
          heavy="$(bash scripts/e2e/resolve-dimension.sh --heavy "$dim")"
          #
          # E2E_FULL_BAR IS GONE. It was `[ "$dim" = "full" ]` and, once the shape and the ceiling
          # moved to E2E_HEAVY_SHAPE, it had zero readers left in the repo — set every run, read by
          # nothing. A variable in that state is not harmless: the next thing that needs "is this a
          # big run?" reaches for the name that sounds right and silently gets `full`-only again,
          # which is precisely how this bug happened. Removed rather than kept for symmetry.
          {
            echo "E2E_DIMENSION=$dim"
            echo "E2E_HEAVY_SHAPE=$heavy"
          } >> "$GITHUB_ENV"

          # The dimension's FIDELITY comes from the same deriver, never from an inline list here
          # (#2356). This step used to emit MAX_CONFIG/ALL_ADDONS itself while the go-test step's
          # `env:` separately forced `ALETHIA_E2E_SOAK: vars.E2E_SOAK || '10m'` — so EVERY run,
          # including the floor, ran the A0.3 day-2 soak and its FATAL drift check, which the floor's
          # own definition ("provision + cluster_ready + ArgoCD converge") does not mention. Azure run
          # 31486339552 applied cleanly, reached Ready nodes, verified a receipt sealed to the plan
          # hash and tore down — and was filed a floor FAIL on `in_sync=false drifted=9` alone.
          #
          # A step-level `env:` key WINS over $GITHUB_ENV, which is why the soak line had to be
          # DELETED from the go-test step rather than merely changed here.
          fidelity="$(bash scripts/e2e/resolve-dimension.sh --fidelity "$dim")"
          printf '%s\n' "$fidelity" >> "$GITHUB_ENV"
          echo "::notice::dimension=$dim fidelity: $(printf '%s' "$fidelity" | tr '\n' ' ')"

          # The notice names the dimension that actually resolved. The old `else` branch fired for
          # every non-`full` token, so a `dimension: day2` dispatch — which exports
          # ALETHIA_E2E_SOAK=10m — announced "NO day-2 soak", and a `maxconfig` one called itself a
          # green floor. In a workflow whose whole point is that every dimension names itself, the
          # operator-facing line was the last place it did not.
          case "$dim" in
            full)
              echo "::notice::FULL-BAR dimension ENABLED — max-config (11 kinds) + all-add-ons (18) + the day-2 soak on this run (heavy node shape; raised cost ceiling on aws; UNPRICED elsewhere)." ;;
            maxconfig)
              echo "::notice::MAX-CONFIG dimension — the 11-kind surface on the heavy node shape. No add-on sweep, no day-2 soak." ;;
            addons)
              echo "::notice::ADD-ONS dimension — the 18-chart sweep to Healthy+Synced on the heavy node shape. No max-config surface, no day-2 soak." ;;
            day2)
              # Read back out of $fidelity, NOT out of the environment: the line above wrote
              # ALETHIA_E2E_SOAK to $GITHUB_ENV, which does not take effect until the NEXT step, so
              # "${ALETHIA_E2E_SOAK}" is empty right here and the window would always print as the
              # default even when a caller widened it.
              soak="$(printf '%s\n' "$fidelity" | sed -n 's/^ALETHIA_E2E_SOAK=//p')"
              echo "::notice::DAY-2 dimension — floor shape, then the A0.3 soak for ${soak:-10m} with its FATAL drift check." ;;
            gitops | byo)
              echo "::notice::GITOPS dimension — floor shape plus the A0.6 apps-repo + BYO Helm chart proof, REQUIRED on this dimension (it reds rather than skipping when the apps-repo env is unset). This is NOT the BYO-IaC custody chain; that is the byo-iac dimension." ;;
            cli-demo)
              echo "::notice::CLI-DEMO dimension — a FLOOR-shaped cluster provisioned through the real \`alethia\` binary rather than a seeded job row (MVP predicate 4). No max-config, no add-on sweep, no day-2 soak: what is under test is the ACTOR, not the surface area. Needs a built console and a seeded service token, so it is dispatch-only by construction." ;;
            byo-iac)
              echo "::notice::BYO-IaC dimension — floor shape plus the seven-job custody chain: a customer OpenTofu module refused when unsafe, applied through the state proxy, drifted, healed, destroyed, state cleared. No partial credit." ;;
            *)
              echo "::notice::green-floor dimension — provision + cluster_ready + ArgoCD Healthy+Synced (+ A0.6 repos when wired). NO day-2 soak: that is the day2/full dimension (#2356)." ;;
          esac

      # ── Cheapest-shape override (BYOC F4). The managed-cloud templates default to LARGE nodes
      #    (AWS m5a.4xlarge×2 SPOT ≈ $0.30/run); the harness cost guard HARD-FAILS a managed run
      #    that inherits that default, so we pin a small node shape per provider here. Merged
      #    into the snapshot `cluster` block (t2MergeClusterJSON): small instance ×1, min disk.
      #    Hetzner keeps its proven cents/run default (no override). Per-cloud SKUs/disk floors
      #    are validated in each cloud's wave.
      #
      #    On a FULL-BAR run the floor shape is the WRONG shape: max-config + all-add-ons need a pool
      #    big enough for the 7 heavy charts + the 11 kinds' controllers, which the FT-5 guard
      #    (t2RequireMaxConfigNodeShape, test/e2e/t2_providers.go) enforces before any spend. So
      #    full-bar loads the per-provider heavy profile instead — the fixtures the guard's own error
      #    message names, which is the part that cannot drift: both sides name the same path.
      #
      #    The FLOOR NUMBERS are deliberately NOT restated here. They live in t2_providers.go
      #    (heavyMinNodes / heavyMinMemGB, and the PER-CLOUD heavyMinVCPUFor), and this comment used
      #    to say ">= 3 nodes / 12 vCPU / 48 GB" one line above claiming guard and workflow cannot
      #    drift. They did: azure's e2e subscription has a 10 vCPU Total Regional quota, so its floor
      #    was lowered to 6 and its heavy fixture is Standard_E2s_v5 x3 — a maintainer following the
      #    prose would have built a shape azure cannot create. Read the constants; the guard prints
      #    the exact shortfall when a profile misses. ──
      - name: Compute cluster shape
        if: steps.gate.outputs.run == 'true'
        env:
          PROVIDER: ${{ matrix.provider }}
          # Read here, not only in the T2 step, because the fabric demo needs a BIGGER POOL and the
          # shape is decided here. See the demo branch below.
          E2E_FABRIC_DEMO: ${{ vars.E2E_FABRIC_DEMO }}
        run: |
          # NET = per-provider network-block override (t2MergeNetworkJSON → snapshot `network`).
          # AWS folds single_nat_gateway=true into the FULL snapshot (one NAT vs one-per-AZ ≈ halves
          # the run's NAT cost); the A0.5 fidelity base is untouched. Other clouds leave it unset.
          NET=""
          case "$PROVIDER" in
            hetzner) SHAPE="" ;;
            aws)     SHAPE='{"instance_types":["t3.large"],"node_min_size":1,"node_max_size":2,"node_desired_size":1,"node_disk_size_gb":20,"provider_config":{"enable_karpenter":true}}'; NET='{"single_nat_gateway":true}' ;;
            # RESHAPED FOR #3855 — FEWER, BIGGER NODES. The axis that matters is PER NODE, not total.
            #
            # History, because the numbers only read correctly with it: a node pool's
            # initial_node_count and autoscaling min/max are PER ZONE, and gcp used to run REGIONAL
            # (europe-west3 = 3 zones), so the declared 1/2/1 was really delivering 3/6/3. #3566 made
            # the location zonal and restated 3/6/3 so the numbers became literal at exactly the cost
            # already proven — the location fix, tested alone. Its comment then reserved this change:
            # "Shrinking the floor is a separate change with its own evidence: ArgoCD's fit in
            # ~800-900Mi of allocatable has never been measured." It still has not been measured, and
            # this does NOT shrink the floor to fit that unmeasured number — it retires the question
            # by making the largest schedulable slot BIGGER than any of the three it replaces.
            #
            # The evidence #3566 asked for is #3855: two nightlies on the SAME sha (33605830312 and
            # 33731101952) both died at `argocd-ready` with `addon-byo-e2e` never completing ONE
            # manifest render — a kube-dns timeout resolving `argo-cd-argocd-repo-server` the first
            # night, repo-server's own gRPC DeadlineExceeded the second. In the same runs aws
            # (t3.large, 8 GiB) and azure (Standard_D2s_v3, 8 GiB) passed the SAME assertion on the
            # SAME BYO chart — each on ONE node. gcp is the only cloud whose floor node is under
            # 4 GiB, and the only one whose floor is red.
            #
            # Per node, from GKE's published reservation formula (25% of the first 4 GiB of memory
            # plus a 100 MiB eviction threshold; a flat 1060 mCPU on every E2 SHARED-CORE type):
            #
            #   was    3 x e2-small   2 GiB ea.  ~1436 MiB allocatable per node, ~800-900 Mi once
            #                                    the GKE system DaemonSets are placed — three times
            #   now    1 x e2-medium  4 GiB      ~2972 MiB allocatable, ~2.4 GiB after the same
            #                                    DaemonSets, which are now placed ONCE
            #
            # Per-node CPU does not move at all: e2-small and e2-medium both have 2 shared cores and
            # both pay the same flat 1060 mCPU reservation, so allocatable stays ~940m either way.
            # The reshape is therefore ~2x the memory in the slot that matters, at no CPU cost to it.
            #
            # Total cluster memory FALLS, 6 GiB -> 4 GiB. Stated, not hidden — and it is the wrong
            # axis: argocd-repo-server is one pod that must fit on one node, and a ~900 Mi slot is
            # what it does not fit in. Node count 3 -> 1 also matches aws and azure, which is the
            # count the floor is green at everywhere it IS green; max 2 stays as their safety valve.
            # Nothing in the floor path needs a second node: the harness asserts >= 1 Ready node
            # (HasReadyNode), heavyMinNodes=3 and fabricDemoMinNodes=2 are both gated off here, and
            # no chart the floor installs (ArgoCD + external-secrets-operator + reloader) sets a
            # required anti-affinity, a topology spread or a PDB.
            #
            # THE COUNTER-EVIDENCE, because it belongs next to the claim. versions.go:146 measured
            # this pool and recorded that FIVE OF THE SEVEN ArgoCD pods already landed on ONE of the
            # three e2-smalls — so the 3-node spread was not buying separation, which is the strongest
            # argument for this reshape and also its warning: the pile-up moves from 5 of 7 to 7 of 7,
            # onto ONE 20 GB pd-standard disk whose concurrent pull throughput was measured at
            # ~43 KB/s (run 33156252646). The disk is DELIBERATELY not touched in the same change:
            # it is the second lever the repo already names, and moving both at once means a green
            # run cannot say which one did it. If this stays red, the disk is next.
            #
            # COST (europe-west3, on-demand list, compute only): e2-small $0.0216/h, e2-medium
            # $0.0432/h — the E2 shared-core ladder is exactly proportional — so 3 x $0.0216 =
            # $0.0648/h becomes $0.0432/h, 33% CHEAPER, plus two fewer 20 GB pd-standard disks.
            # Matching the green clouds' 8 GiB instead means 1 x e2-standard-2 at $0.0863/h: +33%,
            # a spend increase, and therefore the maintainer's call rather than this change.
            #
            # THIS IS NOT A CLAIM THAT #3855 IS FIXED. 4 GiB is still HALF of what aws and azure use,
            # and no offline check can settle whether ArgoCD converges in it. One paid gcp floor run
            # is the only honest test.
            gcp)     SHAPE='{"instance_types":["e2-medium"],"node_min_size":1,"node_max_size":2,"node_desired_size":1,"node_disk_size_gb":20}' ;;
            # Standard_B2s (v1) is NOT offered by AKS on a modern subscription: a real apply fails with
            # "The VM size of Standard_B2s is not allowed in your subscription" — only the v2/v3+
            # generations are served. (`az vm list-skus` disagrees and reports B2s unrestricted; AKS is
            # authoritative.) D2s_v3 = 2 vCPU/8GiB, DSv3 family, broadly available. Verified on a real AKS apply.
            azure)   SHAPE='{"instance_types":["Standard_D2s_v3"],"node_min_size":1,"node_max_size":2,"node_desired_size":1,"node_disk_size_gb":32}' ;;
            alibaba) SHAPE='{"instance_types":["ecs.e-c1m2.large"],"node_min_size":1,"node_max_size":2,"node_desired_size":1,"node_disk_size_gb":40}' ;;
            *) echo "::error::unknown provider '$PROVIDER'"; exit 1 ;;
          esac
          # FULL-BAR: swap the floor shape for the provider's heavy profile. The fixture PATH is the
          # one the FT-5 guard names in its own failure message, so guard and workflow cannot disagree
          # about which file is used. The floor NUMBERS are the guard's, not this file's.
          if [ "${E2E_HEAVY_SHAPE:-false}" = "true" ]; then
            HEAVY="test/e2e/fixtures/cluster_json.heavy.${PROVIDER}.json"
            if [ ! -f "$HEAVY" ]; then
              # Documented exclusion, not a silent gap (cloud-parity rule): a cloud without a heavy
              # profile cannot host the full bar, and must say so rather than trip the guard later
              # with a message about node counts.
              echo "::error::full-bar requested for '$PROVIDER' but $HEAVY does not exist — that cloud has no heavy profile. Add the fixture sized to that cloud's floor (heavyMinNodes / heavyMinMemGB / heavyMinVCPUFor(\"$PROVIDER\") in test/e2e/t2_providers.go — the per-cloud vCPU floor differs where a quota forces it) or exclude the cloud from full-bar runs. TestMaxConfigNodeShapeGuard checks a new fixture against its own cloud's floor for free on every PR."
              exit 1
            fi
            SHAPE="$(jq -c . "$HEAVY")"
            echo "::notice::T2 heavy shape for $PROVIDER on dimension '${E2E_DIMENSION:-?}' (from $HEAVY): $SHAPE"
          elif printf '%s' "${E2E_FABRIC_DEMO:-}" | grep -qiE '^(1|true|yes|on)$'; then
            # FABRIC DEMO (#845): the other heavy scenario, and until #2295-era it was the only one
            # with no shape override — so it ran on the cheapest floor shape above. On gcp that is ONE
            # e2-small (2 GiB) against a workload measured at 4.91 vCPU / 4.14 GiB (the boutique
            # overlays placed once per tier PLUS once more inside the vcluster, whose pods schedule on
            # the host). Those pods sit Pending, nothing recovers them, and the run burns the whole
            # 165-minute cap on every cloud before reporting — ~11 hours of billed cluster time to
            # learn a node size. t2RequireFabricDemoNodeShape now refuses that in seconds, and this is
            # the shape that satisfies it.
            #
            # The truthiness test MATCHES THE HARNESS (t2Truthy: 1|true|yes|on) rather than the
            # `!= ''` the job/step caps use, so E2E_FABRIC_DEMO=0 does not silently buy a big pool for
            # a scenario that will not run.
            DEMO="test/e2e/fixtures/cluster_json.demo.${PROVIDER}.json"
            if [ ! -f "$DEMO" ]; then
              # Documented exclusion, not a silent gap (cloud-parity rule) — same posture as full-bar.
              echo "::error::fabric demo requested for '$PROVIDER' but $DEMO does not exist — that cloud has no demo profile. Add the fixture sized to clear fabricDemoNodeFloor() in test/e2e/t2_providers.go (its floor scales with the tier count, and the guard prints the shortfall), or exclude the cloud from fabric-demo runs. TestDemoProfilesSatisfyTheFabricDemoGuard checks a new fixture for free on every PR."
              exit 1
            fi
            SHAPE="$(jq -c . "$DEMO")"
            echo "::notice::T2 FABRIC-DEMO shape for $PROVIDER (from $DEMO): $SHAPE"
          elif [ -n "$SHAPE" ]; then
            echo "::notice::T2 cheapest shape for $PROVIDER: $SHAPE"
          fi
          if [ -n "$SHAPE" ]; then
            echo "ALETHIA_E2E_CLUSTER_JSON=$SHAPE" >> "$GITHUB_ENV"
          fi
          if [ -n "$NET" ]; then
            echo "ALETHIA_E2E_NETWORK_JSON=$NET" >> "$GITHUB_ENV"
            echo "::notice::T2 network override for $PROVIDER: $NET"
          fi

      - uses: pnpm/action-setup@v6
        if: steps.gate.outputs.run == 'true'
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v7
        if: steps.gate.outputs.run == 'true'
        with:
          go-version-file: go.work
      - uses: opentofu/setup-opentofu@v2
        if: steps.gate.outputs.run == 'true'
        with:
          tofu_version: "1.9.0"

      # Provider plugin cache. Unlike production — where the runner IMAGE bakes a pre-initialized
      # .terraform tree and copyDir carries it into each job workdir — this harness drives a natively
      # built runner against the templates straight from the checkout, so its `tofu init` starts cold.
      #
      # The committed .terraform.lock.hcl already removes the checksum/signature fetch (the call that
      # 500'd on 2026-07-27 and killed the run at 47s having provisioned nothing). This removes the
      # DOWNLOAD too, so a warm nightly needs the registry for nothing. Keyed on the lock files: a
      # provider bump changes the key and repopulates.
      - name: Cache OpenTofu provider plugins
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.terraform.d/plugin-cache
          key: tofu-plugins-1.9.0-${{ runner.os }}-${{ hashFiles('infra/templates/project/*/.terraform.lock.hcl') }}
          restore-keys: |
            tofu-plugins-1.9.0-${{ runner.os }}-
      - name: Point OpenTofu at the plugin cache
        if: steps.gate.outputs.run == 'true'
        run: |
          mkdir -p ~/.terraform.d/plugin-cache
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"

      - uses: azure/setup-helm@v5
        if: steps.gate.outputs.run == 'true'
        with:
          version: v3.16.4
      - uses: azure/setup-kubectl@v5
        if: steps.gate.outputs.run == 'true'

      - name: Install hcloud CLI (belt-and-suspenders teardown)
        if: steps.gate.outputs.run == 'true' && matrix.provider == 'hetzner'
        env:
          # v1.49.1 was never released — the download 404'd on every run. The leg green-skipped
          # while HCLOUD_TOKEN was unset, so the pin was never exercised until the gate opened.
          HCLOUD_CLI_VERSION: v1.67.0
        run: |
          # pipefail is load-bearing: without it `curl | tar` reports TAR's status, so a 404
          # surfaced as "gzip: stdin: unexpected end of file" instead of the HTTP error.
          set -euo pipefail
          curl -fsSL "https://github.com/hetznercloud/cli/releases/download/${HCLOUD_CLI_VERSION}/hcloud-linux-amd64.tar.gz" \
            | tar -xz hcloud
          sudo mv hcloud /usr/local/bin/hcloud
          hcloud version

      - name: Install workspace deps
        if: steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Migrate the control-plane database (schema + programmables/RLS + app role)
        if: steps.gate.outputs.run == 'true'
        run: pnpm -C apps/console run db:migrate

      # ── AWS: exchange the GitHub OIDC token for the ref-bound `alethia-e2e-nightly` role
      #    (no long-lived keys). Only runs for the aws provider once a maintainer has applied
      #    infra/aws-oidc and set vars.E2E_AWS_ROLE_ARN; otherwise the gate above already
      #    green-skipped the whole run. The role is region-locked + boundary-capped + budgeted
      #    (see infra/aws-oidc/e2e-nightly.tf). aws-region MUST equal the role's locked region
      #    (E2E_REGION defaults to us-east-1 for aws — set in the compute step). ──
      - name: Configure AWS credentials (OIDC)
        id: aws_creds
        if: steps.gate.outputs.run == 'true' && matrix.provider == 'aws'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.E2E_AWS_ROLE_ARN }}
          aws-region: ${{ env.E2E_REGION }}
          role-duration-seconds: 7200

      # ── The ACCOUNT ID, which credentials alone do not carry into the template. The T2 harness
      #    runs a self-operator runner with no stored CloudIdentity, so the runner falls through to
      #    resolveAmbientAccountID (apps/runner/internal/agent/runner.go) — which for aws reads
      #    $AWS_ACCOUNT_ID. Nothing set it, so every nightly emitted "aws_account_id":{"value":""}
      #    and the apply died hours in at the RDS secret's KMS key with `InvalidArnException`,
      #    naming KMS rather than the missing input (run 30738253176). configure-aws-credentials
      #    resolves the account for the role it just assumed; take it from there rather than
      #    parsing the role ARN, so a re-pointed role cannot silently disagree.
      #
      #    The template now REFUSES an empty value at plan time, so a regression here fails fast
      #    and says which input is wrong instead of burning an hour of real cloud first. ──
      - name: Export AWS_ACCOUNT_ID for the T2 harness
        if: steps.gate.outputs.run == 'true' && matrix.provider == 'aws'
        env:
          ACCOUNT_ID: ${{ steps.aws_creds.outputs.aws-account-id }}
        run: |
          set -euo pipefail
          if [ -z "${ACCOUNT_ID}" ]; then
            echo "::error::configure-aws-credentials returned no aws-account-id — the template would emit an empty aws_account_id and fail mid-apply."
            exit 1
          fi
          echo "AWS_ACCOUNT_ID=${ACCOUNT_ID}" >> "$GITHUB_ENV"
          echo "::notice::AWS_ACCOUNT_ID resolved for the T2 harness (${ACCOUNT_ID})."

      # ── Signal to the T2 harness that AWS creds are configured. The provider table's
      #    credsPresent() for aws requires ALETHIA_E2E_AWS_READY=1 AND a concrete handle
      #    (AWS_ROLE_ARN/AWS_ACCESS_KEY_ID, exported by configure-aws-credentials above) — so a
      #    missing/failed configure step surfaces as a HARD FAIL (under ALETHIA_E2E_T2_REQUIRE),
      #    never a green skip. Without this, the aws run would ALWAYS fail the cred gate. ──
      - name: Mark AWS ready for the T2 harness
        if: steps.gate.outputs.run == 'true' && matrix.provider == 'aws'
        run: echo "ALETHIA_E2E_AWS_READY=1" >> "$GITHUB_ENV"

      # ── GCP: exchange the GitHub OIDC token for the Workload-Identity-Federated service account
      #    (no key file). Only runs for the gcp provider once a maintainer has applied infra/gcp-e2e
      #    and set vars.E2E_GCP_WIF_PROVIDER + vars.E2E_GCP_SA_EMAIL; otherwise the gate above already
      #    green-skipped the whole run. google-github-actions/auth mints/exports the short-lived
      #    federated credentials; setup-gcloud puts `gcloud` on PATH for the T2 harness + sweeper.
      #    This uses the job's `id-token: write` — SAFE because the workflow is schedule/dispatch-only
      #    (program invariant 1), never reachable from a PR. ──
      - name: Configure GCP credentials (WIF / OIDC)
        if: steps.gate.outputs.run == 'true' && matrix.provider == 'gcp'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.E2E_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.E2E_GCP_SA_EMAIL }}
      - name: Install gcloud CLI
        if: steps.gate.outputs.run == 'true' && matrix.provider == 'gcp'
        uses: google-github-actions/setup-gcloud@v3

      # ── Azure: federated (OIDC) login — no client secret. Only runs for the azure provider once a
      #    maintainer has applied infra/azure-e2e + set the three E2E_AZURE_* vars; otherwise the gate
      #    green-skipped. `az` is preinstalled on the runner. We ALSO export ARM_USE_OIDC +
      #    ARM_CLIENT_ID/TENANT_ID/SUBSCRIPTION_ID to the job env so OpenTofu's azurerm provider
      #    authenticates from the SAME federated token (the T2 harness reads ARM_*). Uses the job's
      #    `id-token: write` — schedule/dispatch-only, never PR-reachable (invariant 1). ──
      - name: Configure Azure credentials (OIDC)
        if: steps.gate.outputs.run == 'true' && matrix.provider == 'azure'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.E2E_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.E2E_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.E2E_AZURE_SUBSCRIPTION_ID }}
      - name: Export ARM_* for the azurerm OpenTofu provider (federated OIDC)
        if: steps.gate.outputs.run == 'true' && matrix.provider == 'azure'
        run: |
          {
            echo "ARM_USE_OIDC=true"
            echo "ARM_CLIENT_ID=${{ vars.E2E_AZURE_CLIENT_ID }}"
            echo "ARM_TENANT_ID=${{ vars.E2E_AZURE_TENANT_ID }}"
            echo "ARM_SUBSCRIPTION_ID=${{ vars.E2E_AZURE_SUBSCRIPTION_ID }}"
          } >> "$GITHUB_ENV"

      # ── AZURE_* + a REFRESHED federated token file — what makes the RUNNER keyless on azure.
      #
      #    The step above gives the azurerm OpenTofu provider a credential. It gives the RUNNER
      #    nothing, and that is why the azure floor has never gone green.
      #
      #    `apps/runner/internal/agent/kube_token.go` builds a ChainedTokenCredential:
      #    WorkloadIdentityCredential → DefaultAzureCredential (→ Environment, ManagedIdentity,
      #    AzureCLI). The first two read AZURE_CLIENT_ID / AZURE_TENANT_ID /
      #    AZURE_FEDERATED_TOKEN_FILE — which nothing set — so both were skipped and the chain fell
      #    all the way through to AzureCLICredential, i.e. the `az login` session from `azure/login`.
      #
      #    That session's client assertion IS the GitHub OIDC token, and it is valid for FIVE
      #    MINUTES. Observed on run 31474582109:
      #
      #      AADSTS700024: Client assertion is not within its valid time range.
      #        Current time: 09:11:49Z · valid from: 08:46:08Z · expiry: 08:51:08Z
      #
      #    AKS provisioned correctly; the reachability probe then ran 20 minutes after the assertion
      #    expired and the leg died as "cluster provisioned but not reachable". AKS never comes up in
      #    under five minutes, so this failed DETERMINISTICALLY on every azure run — it was never
      #    flaky, and it is why the leg has no green in its history.
      #
      #    ⚠️ EXPORTING THE VARIABLES IS NOT ENOUGH, which is the part worth reading twice.
      #    WorkloadIdentityCredential re-reads the token file on every GetToken — it is built for
      #    Kubernetes projected tokens, which the kubelet rotates. On a GitHub runner NOTHING rotates
      #    it, so a probe 20 minutes later would read the same expired assertion and fail identically.
      #    The file has to be kept fresh, hence the refresher.
      #
      #    Why the fix belongs HERE and not in the runner: the runner's chain is already correct for
      #    production, where it runs inside a customer's AKS cluster with a real projected
      #    service-account token. Teaching it to mint GitHub OIDC tokens would put CI-specific
      #    behaviour into the product. The gap is that the HARNESS never gave it a credential.
      #
      #    ACTIONS_ID_TOKEN_REQUEST_URL / _TOKEN stay valid for the whole job (that is what
      #    `id-token: write` grants), so a background loop can keep minting. It writes atomically —
      #    a reader that catches a half-written file gets a malformed assertion and a confusing
      #    AADSTS error instead of this comment. ──
      - name: Export AZURE_* + start the federated-token refresher
        if: steps.gate.outputs.run == 'true' && matrix.provider == 'azure'
        env:
          AZ_CLIENT_ID: ${{ vars.E2E_AZURE_CLIENT_ID }}
          AZ_TENANT_ID: ${{ vars.E2E_AZURE_TENANT_ID }}
        run: |
          set -euo pipefail
          TOKEN_FILE="${RUNNER_TEMP}/azure-federated-token"
          MINT="${RUNNER_TEMP}/mint-azure-token.sh"

          # A real script rather than an inlined function: the refresher runs detached, and a
          # here-doc'd file is something a maintainer can read, run by hand, and reason about when a
          # run goes wrong at 03:17.
          cat > "$MINT" <<'MINTEOF'
          #!/usr/bin/env bash
          # Mint a GitHub OIDC token for the Azure federated-credential audience, atomically.
          # A reader that catches a half-written file gets a malformed assertion and a confusing
          # AADSTS error, so write-then-rename rather than write-in-place.
          set -uo pipefail
          out="$1"
          curl -fsSL "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            | jq -r '.value' > "${out}.tmp" || exit 1
          [ -s "${out}.tmp" ] || exit 1
          mv "${out}.tmp" "$out"
          MINTEOF
          sed -i 's/^          //' "$MINT"
          chmod +x "$MINT"

          # Fail fast and loudly if the very first mint does not work: a refresher that silently
          # never writes leaves the credential chain exactly as broken as it is today, and the next
          # person would re-diagnose AADSTS700024 from scratch.
          if ! "$MINT" "$TOKEN_FILE" || [ ! -s "$TOKEN_FILE" ]; then
            echo "::error::could not mint the Azure federated token — refusing to continue; the runner would fall back to the 5-minute az session (see #2259)."
            exit 1
          fi

          # Every 4 minutes, comfortably inside the ~5-minute assertion lifetime. Detached so it
          # outlives this step; the job ending reaps it. Failures are tolerated per-iteration — one
          # flaky mint must not stop the loop, and the NEXT tick repairs the file well before the
          # current assertion expires.
          # shellcheck disable=SC2016  # $0/$1 are the loop's OWN positional args (the two passed
          # after the -c string), so they must NOT expand here — expanding them in this shell is
          # exactly the bug the quoting prevents.
          nohup bash -c 'while true; do sleep 240; "$0" "$1" || true; done' "$MINT" "$TOKEN_FILE" \
            >/dev/null 2>&1 &
          echo "::notice::azure federated-token refresher started (every 240s → $TOKEN_FILE)"

          {
            echo "AZURE_CLIENT_ID=${AZ_CLIENT_ID}"
            echo "AZURE_TENANT_ID=${AZ_TENANT_ID}"
            echo "AZURE_FEDERATED_TOKEN_FILE=${TOKEN_FILE}"
          } >> "$GITHUB_ENV"

      # ── Alibaba: keyless RAM OIDC. Install aliyun-cli (release tgz, like the hcloud step) for the
      #    sweeper, then fetch a GitHub OIDC token (audience sts.aliyuncs.com) to a file and export the
      #    RAM-OIDC trio that BOTH the aliyun CLI sweeper AND the alicloud OpenTofu provider read:
      #    ALICLOUD_OIDC_TOKEN_FILE + ALICLOUD_ROLE_ARN + ALICLOUD_OIDC_PROVIDER_ARN. Only runs for the
      #    alibaba provider once a maintainer has applied infra/alibaba-e2e + set the two E2E_ALIBABA_*
      #    vars; otherwise the gate green-skipped. The OIDC token comes from the job's `id-token: write`
      #    (ACTIONS_ID_TOKEN_REQUEST_* are injected into the step) — schedule/dispatch-only (invariant 1). ──
      - name: Configure Alibaba credentials (RAM OIDC)
        if: steps.gate.outputs.run == 'true' && matrix.provider == 'alibaba'
        env:
          ALIYUN_CLI_VERSION: "3.0.263"
          ROLE_ARN: ${{ vars.E2E_ALIBABA_ROLE_ARN }}
          OIDC_PROVIDER_ARN: ${{ vars.E2E_ALIBABA_OIDC_PROVIDER_ARN }}
        run: |
          curl -fsSL "https://github.com/aliyun/aliyun-cli/releases/download/v${ALIYUN_CLI_VERSION}/aliyun-cli-linux-${ALIYUN_CLI_VERSION}-amd64.tgz" \
            | tar -xz aliyun
          sudo mv aliyun /usr/local/bin/aliyun
          aliyun version
          # Fetch the GitHub OIDC token (RAM audience) to a file the CLI + tofu provider both read.
          TOKEN_FILE="${RUNNER_TEMP}/alibaba-oidc-token"
          curl -fsSL "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.aliyuncs.com" \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            | jq -r '.value' > "$TOKEN_FILE"
          if [ ! -s "$TOKEN_FILE" ]; then
            echo "::error::failed to mint the Alibaba RAM OIDC token — refusing to continue."
            exit 1
          fi

          # ── Perform the exchange. NOBODY USED TO (#1875). ──
          # The step exported the token file + the two ARNs and stopped, so the workflow assumed the
          # alicloud PROVIDER would call AssumeRoleWithOIDC, while the template
          # (infra/templates/project/alibaba/main.tf:20) documents that it reads credentials the
          # RUNNER already materialised. Neither half called it, and the deploy died at plan with
          # "no valid credential sources for Terraform Alibaba Cloud Provider found" — accurately.
          #
          # AssumeRoleWithOIDC is an ANONYMOUS API: per Alibaba's reference it "allows anonymous
          # access. Therefore, you do not need to specify the Signature, SignatureMethod,
          # SignatureVersion, or AccessKeyId common request parameters." So a plain POST does it,
          # with no chicken-and-egg profile to configure first — which is why this is curl and not
          # `aliyun sts`, since the CLI has no credentials to run with at this point either.
          #
          # ANONYMITY WAIVES THE SIGNATURE PARAMETERS, NOT THE COMMON PARAMETERS (#1582).
          # That sentence lists exactly four names, and it is exhaustive. Everything else in the
          # RPC common-parameter set still applies — which is why Action, Format and Version are
          # already here. Timestamp is one of them, and omitting it cost a whole nightly:
          #   AssumeRoleWithOIDC failed (HTTP 400): MissingTimestamp: Timestamp is mandatory for
          #   this action.
          # So, for an anonymous AssumeRoleWithOIDC:
          #   WAIVED   — Signature, SignatureMethod, SignatureVersion, AccessKeyId, and with them
          #              SignatureNonce, which exists only to salt a signature that is not computed.
          #   REQUIRED — Action, Version, Timestamp (+ Format, to get JSON instead of the XML default).
          # Cross-checked against Alibaba's own credentials-go, which builds this same call with
          # exactly Version/Action/Format/Timestamp and no nonce:
          #   https://github.com/aliyun/credentials-go/blob/master/credentials/providers/oidc.go
          #
          # Timestamp must be ISO-8601 UTC, `yyyy-MM-ddTHH:mm:ssZ`, and is valid for 31 minutes —
          # so it is generated HERE, at call time, never hoisted to a step env. `date -u
          # +%Y-%m-%dT%H:%M:%SZ` yields that on GNU date (the ubuntu runner) and BSD date (macOS)
          # alike; the literal Z is safe because -u already forces UTC.
          # Docs: https://www.alibabacloud.com/help/en/ram/developer-reference/api-sts-2015-04-01-assumerolewithoidc
          #       https://www.alibabacloud.com/help/en/sdk/product-overview/rpc-mechanism
          RESP="${RUNNER_TEMP}/alibaba-sts-response.json"
          HTTP_CODE=$(curl -sS -o "$RESP" -w '%{http_code}' -X POST "https://sts.aliyuncs.com/" \
            --data-urlencode "Action=AssumeRoleWithOIDC" \
            --data-urlencode "Format=JSON" \
            --data-urlencode "Version=2015-04-01" \
            --data-urlencode "Timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --data-urlencode "RoleArn=${ROLE_ARN}" \
            --data-urlencode "OIDCProviderArn=${OIDC_PROVIDER_ARN}" \
            --data-urlencode "OIDCToken=$(cat "$TOKEN_FILE")" \
            --data-urlencode "RoleSessionName=e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")
          if [ "$HTTP_CODE" != "200" ]; then
            # Only Code/Message/RequestId — never the raw body, which can echo the request back.
            echo "::error::AssumeRoleWithOIDC failed (HTTP ${HTTP_CODE}): $(jq -r '"\(.Code // "?"): \(.Message // "?") [RequestId \(.RequestId // "?")]"' <"$RESP" 2>/dev/null || echo 'unparseable response')"
            rm -f "$RESP"
            exit 1
          fi

          ALICLOUD_AK=$(jq -r '.Credentials.AccessKeyId' <"$RESP")
          ALICLOUD_SK=$(jq -r '.Credentials.AccessKeySecret' <"$RESP")
          ALICLOUD_ST=$(jq -r '.Credentials.SecurityToken' <"$RESP")
          rm -f "$RESP"
          if [ -z "$ALICLOUD_AK" ] || [ "$ALICLOUD_AK" = "null" ]; then
            echo "::error::AssumeRoleWithOIDC returned 200 with no credentials — refusing to continue."
            exit 1
          fi

          # These three are REAL SECRETS, unlike every other cloud's handle on this leg. Mask them
          # before they can reach a log line, and see scrub.sh for the artifact side (#1854).
          echo "::add-mask::${ALICLOUD_AK}"
          echo "::add-mask::${ALICLOUD_SK}"
          echo "::add-mask::${ALICLOUD_ST}"

          # SIX variables from one exchange, because the two consumers do not agree on names:
          # the alicloud OpenTofu provider reads ALICLOUD_ACCESS_KEY / _SECRET_KEY / _SECURITY_TOKEN,
          # and the aliyun CLI — which the always() sweeper (scripts/e2e/alibaba-cleanup.sh) runs —
          # reads ALIBABA_CLOUD_ACCESS_KEY_ID / _ACCESS_KEY_SECRET / _SECURITY_TOKEN. Exporting only
          # one set leaves the other half of the leg unauthenticated: the sweeper is the guarantee
          # that a hard-killed run does not leak billable ACK clusters, so it must not be the half
          # that silently has no credentials.
          {
            echo "ALICLOUD_ACCESS_KEY=${ALICLOUD_AK}"
            echo "ALICLOUD_SECRET_KEY=${ALICLOUD_SK}"
            echo "ALICLOUD_SECURITY_TOKEN=${ALICLOUD_ST}"
            echo "ALIBABA_CLOUD_ACCESS_KEY_ID=${ALICLOUD_AK}"
            echo "ALIBABA_CLOUD_ACCESS_KEY_SECRET=${ALICLOUD_SK}"
            echo "ALIBABA_CLOUD_SECURITY_TOKEN=${ALICLOUD_ST}"
          } >> "$GITHUB_ENV"

          # ── Assert the exchange WORKS, not that a file is non-empty. ──
          # The old step's only check was `[ -s "$TOKEN_FILE" ]`, which is why this survived until
          # the gate opened: it went green on every run while proving nothing about federation. One
          # GetCallerIdentity fails loudly HERE instead of three minutes later inside a deploy job,
          # where a missing credential reads as a template problem.
          export ALIBABA_CLOUD_ACCESS_KEY_ID="${ALICLOUD_AK}"
          export ALIBABA_CLOUD_ACCESS_KEY_SECRET="${ALICLOUD_SK}"
          export ALIBABA_CLOUD_SECURITY_TOKEN="${ALICLOUD_ST}"
          if ! IDENTITY=$(aliyun sts GetCallerIdentity --region "${E2E_REGION:-eu-central-1}" 2>&1); then
            echo "::error::the assumed Alibaba identity cannot call STS — federation is broken: ${IDENTITY}"
            exit 1
          fi
          echo "assumed $(jq -r '.Arn // "?"' <<<"$IDENTITY")"

      # ── Stale-cluster preflight (BYOC A1.4). BEFORE provisioning, sweep any leaked e2e
      #    orphans from PRIOR runs — a nightly hard-killed before both its graceful destroy AND
      #    its always() sweep keeps billing until something notices. PREFLIGHT=1 discovers every
      #    OTHER e2e-<env> handle in the region and sweeps it scope-locked (never this run, never
      #    prod). Best-effort + loud: it warns on residual but exits 0, so a flaky tag/API call
      #    can't red an otherwise-healthy provisioning night (the always() teardown stays the
      #    fail-closed guarantee for THIS run). Same-cloud runs are serialized by the concurrency
      #    group, so any other e2e-* handle is genuinely an orphan. aws-only (its sweeper). ──
      #
      #    ⏱ BOUNDED (#2257). The script's own budget stops it STARTING a sweep it cannot finish,
      #    but a single hung AWS call inside one sweep is outside its reach — so the step carries a
      #    hard cap too, the same finer-than-the-job-cap pattern the provision step below uses.
      #    `continue-on-error` is what keeps the posture honest: the ONLY ways this step can fail
      #    are a timeout or a crash (preflight mode always `exit 0`s), and neither must red an
      #    otherwise-healthy provisioning night. Without it, adding a timeout would convert the
      #    cancellation into a failure rather than removing it. On run 31356854945 this step ran
      #    04:52→06:22 against two unsweepable orphans and the JOB was cancelled at its 90m cap —
      #    the aws leg provisioned nothing, and `exit 0` was never reached.
      - name: Stale-cluster preflight (sweep prior-run e2e orphans)
        if: steps.gate.outputs.run == 'true' && matrix.provider == 'aws'
        timeout-minutes: 20
        continue-on-error: true
        env:
          PREFLIGHT: "1"
          ALETHIA_E2E_ENV: ${{ env.E2E_ENV }}
          ALETHIA_E2E_REGION: ${{ env.E2E_REGION }}
        run: ./scripts/e2e/aws-cleanup.sh

      # ── The real proof. A finer step-level timeout than the job cap so a hung apply
      #    is KILLED here (the step fails) and the always() teardown below still runs
      #    normally — rather than the whole job hitting its cap. ──
      # The LADDER is ctx < go-timeout < step < job, and each rung has a job:
      #
      #   ctx      cancels first  → the scenario reports its own bounded failure, and t.Cleanup tears down
      #   teardown reserved       → the in-process t.Cleanup destroy's OWN window, inside the go-timeout
      #   go       +5m            → if the ctx is not honored, go panics with a stack naming the test
      #   step     +5m            → if go is wedged, the step kills it and the run still reaches teardown
      #   job      +15m           → the WORKFLOW sweeper, proof capture and the scrub, after the step
      #
      # The teardown rung is a rung, not a footnote: the sweeper the job's +15m pays for runs AFTER
      # the step, while the t.Cleanup destroy runs INSIDE the go test process, so only the go-timeout
      # can bound it. A window too small does not just leak resources — terraform-exec cancels with
      # SIGINT, so the harness gets `signal: interrupt` and loses the destroy's own named error.
      #
      # The two inner rungs are DERIVED, not written here: the step's `run:` asks
      # test/e2e/cmd/t2budget for the go-timeout, computed by the same ResolveT2Budget the test uses
      # for its ctx — so they cannot disagree. The two outer rungs are `timeout-minutes` values, which
      # GitHub evaluates before the step body runs, so they stay expressions and t2budget VERIFIES
      # them (failing at the top of the step, ~1 minute in, rather than by a mid-scenario kill).
      #
      # TestT2BudgetLadderHolds proves the ordering across every cloud × all 128 scenario
      # combinations on every PR. It is the reason there are no arithmetic claims in this comment.
      # ── CLI-ONLY DEMO BAR (test/e2e/t2_cli_demo.go). Deliberately its OWN step, and deliberately
      #    BEFORE the apply, for two reasons:
      #
      #    1. The T2 step runs `-run TestT2RealCloudProvisioning`. A test that is not named by that
      #       regex NEVER EXECUTES — it compiles, its unit tests pass, the board says the harness
      #       shipped, and it runs zero times. That is the #1341 failure this repo has already paid
      #       for once, and adding a scenario as a sibling `go test` invocation is how it is avoided
      #       rather than re-discovered.
      #    2. It provisions nothing and takes seconds, so a table that has gone stale reds the run
      #       immediately instead of after a 50-minute apply. It also stays outside ResolveT2Budget,
      #       because it consumes none of the ctx that arithmetic is protecting.
      #
      #    The binary: ALETHIA_E2E_CLI_BIN wins if a maintainer set it (point it at a RELEASE
      #    artifact to prove the bar against what actually ships). Otherwise the step builds the CLI
      #    from this checkout — and the harness logs `alethia --version`, so the proof bundle always
      #    records WHICH binary earned the verdict. A green run against the wrong binary is the one
      #    way this check could mislead, so it is made unambiguous rather than assumed. ──
      # ── THE `cli-demo` DIMENSION'S CONSOLE (#3038). Four steps, all skipped on every other
      #    dimension, because they cost ~10 minutes and only this one needs them.
      #
      #    WHY A REAL CONSOLE AND NOT THE SHIM. test/e2e/controlplane.go implements the endpoints a
      #    RUNNER calls (/api/jobs/claim, X-Runner-ID …). The CLI talks to the USER-FACING API with a
      #    bearer token, and none of those endpoints exist on the shim. Extending it to fake them
      #    would prove the CLI against a mock, which is the one thing this bar must not do. The two
      #    halves meet in the `jobs` table instead: the CLI writes through the console, and the shim's
      #    claim calls the same `claim_next_job` over the same Postgres this job already migrated.
      #
      #    The database and the workspace are already here — the job has a postgres service, and
      #    `pnpm install` + `db:migrate` ran above. ──
      - name: cli-demo — build @alethia/ee, then the console
        if: steps.gate.outputs.run == 'true' && env.E2E_DIMENSION == 'cli-demo'
        # ── THE BUILD NEEDS THE AUTH SETTINGS TOO, AND THAT IS NOT OBVIOUS ──
        # These were originally given only to the step that STARTS the console, on the reasonable
        # assumption that a build is not a runtime. It is not true of Next: `next build` collects
        # page data by EVALUATING each route module, and `/sso/[slug]` pulls `lib/auth/index.ts`,
        # which builds the better-auth config at module scope. `lib/config/auth.ts:128` then throws
        # on an absent secret/baseURL and the whole build fails at "Collecting page data".
        #
        # That is why `cli-demo` was 0/5 on the proof grid with no cloud ever implicated: its very
        # first dispatch (hetzner, run 33723313317) died here, before `project apply` and before any
        # runner — so nothing was ever provisioned and nothing named a cause. See #4088.
        #
        # The set below is ci.yml's build smoke (ci.yml:181-187), which is the configuration already
        # PROVEN to build this console, plus NEXT_PUBLIC_APP_URL to match the start step. The auth
        # values must stay identical to that step's; GitHub Actions does not support YAML anchors,
        # so this is a copy, and the two drifting apart is precisely the defect #4088 records.
        env:
          BETTER_AUTH_SECRET: e2e-cli-demo-placeholder-secret
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          ALETHIA_STORAGE_ENDPOINT: http://localhost:8333
          ALETHIA_STORAGE_ACCESS_KEY_ID: e2e
          ALETHIA_STORAGE_SECRET_ACCESS_KEY: e2e
        run: |
          # ee FIRST, and this ordering is not stylistic. ee/dist is gitignored with no prepare
          # hook, and `pnpm -C apps/console run build` calls the console's own script — bypassing turbo, so
          # `build.dependsOn: ["^build"]` never fires. Without it getEnterprise()'s tolerant require
          # throws and lib/auth/scope.ts falls back to `{ userId, orgId: userId }`, which is how
          # ci.yml's hero job was once VACUOUS (see its note at ci.yml:389). A cli-demo run on a
          # community-scope console would pass while proving the wrong tenancy.
          pnpm -F @alethia/ee build
          test -f ee/dist/index.js || { echo "::error::ee/dist/index.js missing — the console would resolve COMMUNITY scope and this dimension would prove the wrong thing"; exit 1; }
          pnpm -C apps/console run build

      - name: cli-demo — seed the org and mint a service token
        if: steps.gate.outputs.run == 'true' && env.E2E_DIMENSION == 'cli-demo'
        env:
          ALETHIA_DATABASE_URL: postgres://alethia:alethia-dev-secret@localhost:5432/alethia
          ALETHIA_APP_DATABASE_URL: postgres://alethia_app:alethia-app-dev-secret@localhost:5432/alethia
          ALETHIA_APP_DB_PASSWORD: alethia-app-dev-secret
        run: |
          # The token and the ORG travel together in one 0600 file. `claim_next_job`'s self-runner
          # branch scopes to `j.org_id = v_runner_org_id` (#392), so the harness registers its runner
          # in the token's org; reading both from one file is what makes them impossible to set
          # independently. Nothing is printed — a credential on stdout reaches the job log.
          pnpm -F console exec tsx scripts/seed-cli-demo-token.mts --out "${RUNNER_TEMP}/cli-demo-creds.json"
          echo "ALETHIA_E2E_CLI_DEMO_CREDS=${RUNNER_TEMP}/cli-demo-creds.json" >> "$GITHUB_ENV"

      - name: cli-demo — start the console and wait for it to answer
        if: steps.gate.outputs.run == 'true' && env.E2E_DIMENSION == 'cli-demo'
        env:
          ALETHIA_DATABASE_URL: postgres://alethia:alethia-dev-secret@localhost:5432/alethia
          ALETHIA_APP_DATABASE_URL: postgres://alethia_app:alethia-app-dev-secret@localhost:5432/alethia
          ALETHIA_APP_DB_PASSWORD: alethia-app-dev-secret
          BETTER_AUTH_SECRET: e2e-cli-demo-placeholder-secret
          # BASE64, 32 bytes decoded — lib/crypto/secrets.ts does `Buffer.from(raw, "base64")` and
          # refuses anything else with "must decode to 32 bytes". Without it the `connector` beat
          # fails at credential submission with a 400 that names the key, which reads as a CLI
          # defect and is a missing console setting.
          #
          # A fixed non-secret value on purpose: this console lives for one job against a throwaway
          # database, nothing it encrypts outlives the run, and a generated key would make a failed
          # decrypt unreproducible. It must never be reused anywhere real.
          ALETHIA_CRED_ENCRYPTION_KEY: YWxldGhpYS1lMmUtY2xpLWRlbW8tdGhyb3dhd2F5ISE=
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          ALETHIA_STORAGE_ENDPOINT: http://localhost:8333
          ALETHIA_STORAGE_ACCESS_KEY_ID: e2e
          ALETHIA_STORAGE_SECRET_ACCESS_KEY: e2e
        run: |
          pnpm -F console exec next start -p 3000 >"${RUNNER_TEMP}/cli-demo-console.log" 2>&1 &
          # POLL for a real answer rather than sleeping. A fixed sleep is either too short — and the
          # first beat fails on a console that was still booting, reported as "the CLI cannot reach
          # whoami" — or too long on every run that did not need it.
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null "http://localhost:3000/api/health" 2>/dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ -z "${ok:-}" ]; then
            echo "::error::the console did not answer /api/health within 120s — the cli-demo beats would all fail as unreachable commands"
            tail -60 "${RUNNER_TEMP}/cli-demo-console.log" || true
            exit 1
          fi
          echo "ALETHIA_E2E_CONSOLE_URL=http://localhost:3000" >> "$GITHUB_ENV"

      - name: cli-demo — build the `alethia` binary under test
        if: steps.gate.outputs.run == 'true' && env.E2E_DIMENSION == 'cli-demo'
        run: |
          # Built from THIS checkout unless a maintainer pinned a release artifact — the same rule
          # the reachability bar states, and for the same reason: a green run against the wrong
          # binary is the one way this check could mislead.
          if [ -n "${{ vars.E2E_CLI_BIN }}" ]; then
            echo "ALETHIA_E2E_CLI_BIN=${{ vars.E2E_CLI_BIN }}" >> "$GITHUB_ENV"
          else
            GOWORK=off go build -C apps/cli -o "${RUNNER_TEMP}/alethia" .
            echo "ALETHIA_E2E_CLI_BIN=${RUNNER_TEMP}/alethia" >> "$GITHUB_ENV"
          fi

      - name: T2 — real runner provisions a real cloud cluster
        id: t2
        if: steps.gate.outputs.run == 'true'
        timeout-minutes: ${{ vars.E2E_FABRIC_DEMO != '' && 285 || 190 }}
        working-directory: test/e2e
        env:
          ALETHIA_E2E_PROVIDER: ${{ matrix.provider }}
          ALETHIA_E2E_PROJECT: ${{ env.E2E_PROJECT }}
          ALETHIA_E2E_ENV: ${{ env.E2E_ENV }}
          # Generalized region (the compute step also exports this to $GITHUB_ENV; explicit here
          # for clarity). resolveT2Region reads ALETHIA_E2E_REGION for every provider.
          ALETHIA_E2E_REGION: ${{ env.E2E_REGION }}
          ALETHIA_E2E_T2_RUNNER_LOG: ${{ runner.temp }}/t2-runner.log
          # ── Day-2 SOAK window (BYOC A0.3). The soak's WINDOW is deliberately NOT set here.
          #    It is exported by the "Resolve full-bar dimension" step from
          #    scripts/e2e/resolve-dimension.sh's fidelity table, because the soak belongs to the
          #    day2/full dimensions and not to the floor — its drift check is FATAL, and a floor run
          #    that satisfied every documented floor requirement was filed a floor FAIL on it (#2356).
          #    A step-level `env:` key WINS over $GITHUB_ENV, so setting the window here at all would
          #    silently re-break that. vars.E2E_SOAK is still honoured, via the table, for the
          #    dimensions whose assertion the soak actually is.
          #    The soak runs AFTER the readiness+ArgoCD asserts and BEFORE the guaranteed teardown:
          #    a liveness loop, a real DETECT_DRIFT → honest posture, a 1Gi PVC → Bound → cloud-side
          #    sweep-tag hard-fail, and an add-on health re-read. Its machine-readable summary is
          #    written for the A0.4 proof/verdict capture. ──
          ALETHIA_E2E_SOAK_SUMMARY: ${{ runner.temp }}/soak-summary.json
          # ── ArgoCD convergence counts (#2688). Written by AssertArgoAppsHealthy at the moment
          #    it asserts, because that is the ONLY moment the numbers exist: the proof capture
          #    runs after t.Cleanup has destroyed the cluster, so it counted a cluster that was
          #    gone and wrote 0/0 for every run — making a PASS bundle and a FAIL bundle
          #    numerically identical. Unconditional, not gated on a var: this is the base T2
          #    assertion's own evidence, not an opt-in scenario. ──
          ALETHIA_E2E_ARGOCD_SUMMARY: ${{ runner.temp }}/argocd-summary.json
          # ── ArgoCD-WITH-REPOS + BYO Helm proof (BYOC A0.6). Opt-in, ON TOP of the base T2
          #    proof: only activates when a maintainer sets the repo VARS + the git-token SECRET.
          #    The proof is cloud-agnostic (it works over ArgoCD CRs, never an ingress URL), so it
          #    runs on every gate-enabled leg — aws, gcp, azure (P2-D, #1066), with the per-cloud
          #    repo overrides below. The repo URLs are non-secret vars; the git token is a SECRET
          #    consumed only via the control plane's git-token handler (never written into the
          #    persisted config_snapshot). REQUIRE is derived from the apps-repo var (shared or a
          #    per-cloud override), so once the maintainer opts in, a half-wired config HARD-FAILS
          #    instead of silently disabling the assertion. Absent ⇒ a clean skip of the repos half
          #    (base A0.1–A0.5 still proves). This whole step (and thus the secret) is
          #    schedule/dispatch-only — never reachable from pull_request (program invariant 1). ──
          ALETHIA_E2E_ARGO_APPS_REPO: ${{ vars.E2E_ARGO_APPS_REPO }}
          ALETHIA_E2E_ARGO_BYO_CHART_REPO: ${{ vars.E2E_ARGO_BYO_CHART_REPO }}
          ALETHIA_E2E_ARGO_BYO_CHART_PATH: ${{ vars.E2E_ARGO_BYO_CHART_PATH }}
          ALETHIA_E2E_ARGO_BYO_CHART_REVISION: ${{ vars.E2E_ARGO_BYO_CHART_REVISION }}
          ALETHIA_E2E_ARGO_BYO_CHART_NAMESPACE: ${{ vars.E2E_ARGO_BYO_CHART_NAMESPACE }}
          ALETHIA_E2E_GIT_TOKEN: ${{ secrets.E2E_GIT_TOKEN }}
          # ── Per-cloud A0.6 repo overrides (P2-D, #1066). GCP + Azure often can't reuse the aws
          #    apps-repo / BYO chart: the manifests differ per cloud AND, per #687, the service-binding
          #    resolves against THAT cloud's tofu outputs. The T2 harness (t2ArgoEnvForProvider) prefers
          #    the "<var>_<PROVIDER>" sibling for the running leg, else the shared cross-cloud var above —
          #    so aws stays on its proven shared repo untouched, and a leg green-skips at the gate if its
          #    cloud secret isn't wired. The git token stays the single shared secret (it crosses only via
          #    the git-token API), so its account must grant read to every per-cloud repo. Parity: aws uses
          #    the shared vars (already proven); alibaba/hetzner add their siblings in their own waves. ──
          ALETHIA_E2E_ARGO_APPS_REPO_GCP: ${{ vars.E2E_ARGO_APPS_REPO_GCP }}
          ALETHIA_E2E_ARGO_BYO_CHART_REPO_GCP: ${{ vars.E2E_ARGO_BYO_CHART_REPO_GCP }}
          ALETHIA_E2E_ARGO_BYO_CHART_REVISION_GCP: ${{ vars.E2E_ARGO_BYO_CHART_REVISION_GCP }}
          ALETHIA_E2E_ARGO_APPS_REPO_AZURE: ${{ vars.E2E_ARGO_APPS_REPO_AZURE }}
          ALETHIA_E2E_ARGO_BYO_CHART_REPO_AZURE: ${{ vars.E2E_ARGO_BYO_CHART_REPO_AZURE }}
          ALETHIA_E2E_ARGO_BYO_CHART_REVISION_AZURE: ${{ vars.E2E_ARGO_BYO_CHART_REVISION_AZURE }}
          # REQUIRED whenever ANY apps-repo (shared OR a per-cloud gcp/azure override) is set — so a
          # half-wired per-cloud config HARD-FAILS at decide() (fail-closed) instead of silently skipping.
          #
          # DEFERS TO THE DIMENSION FIRST. A step-level `env:` key WINS over $GITHUB_ENV (see the
          # resolve step), so this line used to make the `gitops` dimension's own switch inert: the
          # resolver could emit ALETHIA_E2E_ARGO_REPOS_REQUIRE=1 and be silently overwritten by
          # whatever these repo variables happened to derive. The dimension is what a dispatcher
          # ASKED FOR, so it wins; the vars remain the default for every dimension that does not
          # care either way.
          ALETHIA_E2E_ARGO_REPOS_REQUIRE: ${{ env.ALETHIA_E2E_ARGO_REPOS_REQUIRE != '' && env.ALETHIA_E2E_ARGO_REPOS_REQUIRE || ((vars.E2E_ARGO_APPS_REPO != '' || vars.E2E_ARGO_APPS_REPO_GCP != '' || vars.E2E_ARGO_APPS_REPO_AZURE != '') && '1' || '') }}
          # ── NAMESPACE-PLACEMENT proof (#959 · wave:fabric). Opt-in, ON TOP of the base T2 proof:
          #    after the base run provisions a real cluster (the Fabric) and ArgoCD is Healthy, the
          #    harness layers a SECOND DEPLOY onto the SAME cluster with placement_mode=namespace and
          #    asserts the tenant app landed in <ns> on that cluster — no new cluster provisioned,
          #    ArgoCD not reinstalled, hardened per-namespace isolation applied (the #955+#956+#957
          #    activation). Runs on EVERY cloud since #1389 finished the activation — the harness's
          #    old `provider != aws` skip was a second literal that silently no-op'd 4 of the 5
          #    clouds and has been removed (#845); the product's own allowlist is the single
          #    control. REQUIRES the A0.6 apps repo above (E2E_ARGO_APPS_REPO) — the tenant-app
          #    routing assertion needs an apps destination to deliver into. Absent ⇒ a clean skip of
          #    this layer (the base T2 proof is unchanged). Real-apply is main-gated, so this
          #    exercises meaningfully only from `main`. Set the repo VARIABLE E2E_NAMESPACE_TENANT
          #    (truthy) to enable once the apps repo is wired. ──
          ALETHIA_E2E_NAMESPACE_TENANT: ${{ vars.E2E_NAMESPACE_TENANT }}
          # ── VCLUSTER-PLACEMENT layer (#1308/#1341). Same shape as the namespace tenant above: a
          #    second DEPLOY with placement_mode=vcluster onto the SAME Fabric, then a DESTROY that
          #    deregisters it. Its harness shipped WITHOUT this line, so the scenario was
          #    unreachable from the nightly and silently never ran — see the guard test
          #    TestScenarioEnablesReachTheNightly, which now fails if that happens again. Referenced
          #    here so a maintainer can turn it on; UNSET ⇒ empty ⇒ a clean skip, so adding the line
          #    changes nothing until E2E_VCLUSTER is set. Its own `provider != aws` skip was removed
          #    in #845 for the same reason as the namespace layer above — a vcluster runs ON the host
          #    Fabric, so it was never aws-specific, and the mirrored literal hid 4 clouds. ──
          ALETHIA_E2E_VCLUSTER: ${{ vars.E2E_VCLUSTER }}
          # ── DAY-2 ACCESS layer (BYOC A0.2). Same story as vcluster: harness present, never
          #    referenced by the nightly. Off unless E2E_DAY2_ACCESS is set. ──
          ALETHIA_E2E_DAY2_ACCESS: ${{ vars.E2E_DAY2_ACCESS }}
          ALETHIA_E2E_DAY2_ACCESS_SUMMARY: ${{ runner.temp }}/day2-access-summary.json
          # ── DAY-2 OFFER postures (#1440 classifier, #1495 harness). Where DAY2_ACCESS proves the
          #    CLUSTER is reachable, this proves the OFFERS on it survive day-2: it plans a tunable
          #    change, a resize and a teardown against live state and asserts tofu's own plan
          #    converges in place and tears down to zero. PLAN-ONLY — nothing is applied. Off unless
          #    E2E_DAY2_OFFER is set. ──
          ALETHIA_E2E_DAY2_OFFER: ${{ vars.E2E_DAY2_OFFER }}
          ALETHIA_E2E_DAY2_OFFER_SUMMARY: ${{ runner.temp }}/day2-offer-summary.json
          # ── FABRIC ENTERPRISE-DEMO acceptance gate (#845). Places dev+staging as NAMESPACE envs
          #    PLUS one vcluster env on the Fabric this leg just provisioned, each syncing its OWN
          #    Kustomize overlay (repositories.apps_path) from the apps-destination repo, and proves
          #    every placement genuinely CAUSED the ArgoCD artifacts it is credited with — the base
          #    deploy already populated this Fabric, so absent-before/present-after is the only
          #    honest evidence. It then re-proves the Fabric's drift posture and writes a verdict.
          #
          #    NOTE: this does NOT assert the apps-overlays ApplicationSet. That is rendered only on
          #    the DEDICATED path (provisioner/deploy.go) and never by a placement, so an earlier
          #    draft of this gate waited on an artifact no placement can create. The
          #    DeriveExpectedArgoApps blindness to ApplicationSet-generated apps is real, but it
          #    belongs to the A0.6 base leg where that ApplicationSet is genuinely rendered.
          #
          #    The default repo is the PUBLIC github.com/alethialabs-io/alethia-examples, which ArgoCD
          #    clones anonymously — so unlike the A0.6 layer above this needs NO git token, and
          #    E2E_FABRIC_DEMO is the only variable a maintainer must set to turn it on. UNSET ⇒
          #    empty ⇒ a clean skip, so these lines change nothing until then. Real-apply is
          #    main-gated, so this exercises meaningfully only from `main`. ──
          ALETHIA_E2E_FABRIC_DEMO: ${{ vars.E2E_FABRIC_DEMO }}
          ALETHIA_E2E_FABRIC_DEMO_REPO: ${{ vars.E2E_FABRIC_DEMO_REPO }}
          ALETHIA_E2E_FABRIC_DEMO_OVERLAYS: ${{ vars.E2E_FABRIC_DEMO_OVERLAYS }}
          ALETHIA_E2E_FABRIC_DEMO_VCLUSTER: ${{ vars.E2E_FABRIC_DEMO_VCLUSTER }}
          ALETHIA_E2E_FABRIC_DEMO_TIMEOUT: ${{ vars.E2E_FABRIC_DEMO_TIMEOUT }}
          ALETHIA_E2E_FABRIC_DEMO_SUMMARY: ${{ runner.temp }}/fabric-demo-summary.json
          # ── BRING-YOUR-OWN IaC continuous proof (#1765, the cloud-tier half of #845's BYO
          #    bullet). The ONE leg that runs OpenTofu Alethia did not write, and it proves the
          #    custody chain around it, not just that an apply worked:
          #
          #      a module at the same pinned commit declaring a NON-allowlisted provider is REFUSED
          #      → the real customer module clones at that pinned sha → fail-closed iacsafety gate
          #      → signed verify receipt over the CUSTOMER's plan → apply → state on ALETHIA's
          #      proxy → a change induced OUT OF BAND with this cloud's own CLI → the posture FLIPS
          #      to drifted → the same commit re-applies to HEAL → in-sync → DESTROY → state cleared
          #
          #    Inducing real drift (rather than re-proving one unchanged commit) was the call on
          #    #1765's open question, and it is why each cloud needs its OWN module owning one
          #    mutable resource. Each owns exactly one, chosen as the cheapest thing on that cloud
          #    that can genuinely drift — an SSM parameter, an empty resource group, a
          #    project-metadata item, an empty OSS bucket, an empty placement group. No cluster, no
          #    VM, no gateway: the module emits no `cluster_name`, which is precisely what keeps the
          #    kubeconfig → CNI → ArgoCD tail off.
          #
          #    The default repo is the PUBLIC github.com/alethialabs-io/alethia-examples, cloned
          #    ANONYMOUSLY (prepareByoIacWorkdir clones without auth when the token is empty), so
          #    like the fabric-demo gate above this needs NO git token and NO new secret.
          #    E2E_BYO_IAC is the only variable a maintainer must set to turn it on; the repo, ref,
          #    module path and blocked-fixture path all default correctly and the path defaults
          #    per-cloud to iac/drift/<provider>. UNSET ⇒ empty ⇒ a clean skip, so these lines
          #    change nothing until then. Real-apply is main-gated, so this exercises meaningfully
          #    only from `main`.
          #
          #    The out-of-band mutation shells out to that cloud's CLI, all five of which this job
          #    already puts on PATH and authenticates: aws + az ship with the runner image, gcloud
          #    is installed by setup-gcloud, aliyun by the Alibaba credential step, hcloud by the
          #    teardown step. ──
          #    THE BUG THIS LINE HAD. It was `${{ vars.E2E_BYO_IAC }}` alone, and a step-level `env:`
          #    key WINS over $GITHUB_ENV — so no dimension could ever switch this scenario on, even
          #    if one emitted it. E2E_BYO_IAC was never set as a repo variable either. Net effect:
          #    the seven-job custody chain in test/e2e/t2_byo_iac.go was written, shipped, and has
          #    NEVER EXECUTED IN CI on any dimension. Meanwhile the programme ledger's `byo` column
          #    was labelled "BYO-IaC" and described as this scenario, so three cells read as proven
          #    BYO-IaC while proving A0.6 — a different thing entirely.
          #
          #    The `byo-iac` dimension is now its vehicle, and the dimension wins here.
          ALETHIA_E2E_BYO_IAC: ${{ env.ALETHIA_E2E_BYO_IAC != '' && env.ALETHIA_E2E_BYO_IAC || vars.E2E_BYO_IAC }}
          ALETHIA_E2E_BYO_IAC_REPO: ${{ vars.E2E_BYO_IAC_REPO }}
          ALETHIA_E2E_BYO_IAC_REF: ${{ vars.E2E_BYO_IAC_REF }}
          ALETHIA_E2E_BYO_IAC_PATH: ${{ vars.E2E_BYO_IAC_PATH }}
          ALETHIA_E2E_BYO_IAC_BLOCKED_PATH: ${{ vars.E2E_BYO_IAC_BLOCKED_PATH }}
          ALETHIA_E2E_BYO_IAC_TIMEOUT: ${{ vars.E2E_BYO_IAC_TIMEOUT }}
          ALETHIA_E2E_BYO_IAC_SUMMARY: ${{ runner.temp }}/byo-iac-summary.json
          # ── CROSS-ACCOUNT KEYLESS CLOUD-SM READ (#1268). Layers ON TOP of the base T2 proof: the
          #    base DEPLOY carries a *-xacct connector row AND a secret-kind binding, so the runner
          #    renders secretstore-<cloud>-xacct and the ExternalSecret that reads through it; the
          #    layer then asserts the account-B value materialized in-cluster (compared by SHA-256,
          #    so the value never enters CI config, logs or the proof bundle) and that a placed
          #    tenant is still refused (#1306).
          #
          #    AWS-ONLY today. gcp/azure/alibaba resolve to a recorded BLOCKED reason and skip —
          #    their ESO identity cannot be pre-trusted (see docs/testing/xacct-secrets-parity.md).
          #    Account B's read grant is applied ONCE, out of band, by infra/aws-secrets-e2e.
          #
          #    All plain VARIABLES, not secrets: a role ARN, an account id, a region, a secret name
          #    and a digest are not sensitive — which is exactly why the canary is compared by hash.
          #    Unset ⇒ a clean skip. ──
          ALETHIA_E2E_SECRETS_XACCT: ${{ vars.E2E_SECRETS_XACCT }}
          ALETHIA_E2E_SECRETS_XACCT_ACCOUNT: ${{ vars.E2E_SECRETS_XACCT_ACCOUNT }}
          ALETHIA_E2E_SECRETS_XACCT_REGION: ${{ vars.E2E_SECRETS_XACCT_REGION }}
          ALETHIA_E2E_SECRETS_XACCT_ROLE_ARN: ${{ vars.E2E_SECRETS_XACCT_ROLE_ARN }}
          ALETHIA_E2E_SECRETS_XACCT_PROJECT_ID: ${{ vars.E2E_SECRETS_XACCT_PROJECT_ID }}
          ALETHIA_E2E_SECRETS_XACCT_VAULT_URL: ${{ vars.E2E_SECRETS_XACCT_VAULT_URL }}
          ALETHIA_E2E_SECRETS_XACCT_OIDC_ARN: ${{ vars.E2E_SECRETS_XACCT_OIDC_ARN }}
          ALETHIA_E2E_SECRETS_XACCT_EXTERNAL_ID: ${{ vars.E2E_SECRETS_XACCT_EXTERNAL_ID }}
          ALETHIA_E2E_SECRETS_XACCT_REMOTE_KEY: ${{ vars.E2E_SECRETS_XACCT_REMOTE_KEY }}
          ALETHIA_E2E_SECRETS_XACCT_SECRET_NAME: ${{ vars.E2E_SECRETS_XACCT_SECRET_NAME }}
          ALETHIA_E2E_SECRETS_XACCT_SERVICE: ${{ vars.E2E_SECRETS_XACCT_SERVICE }}
          ALETHIA_E2E_SECRETS_XACCT_PROBE_NAMESPACE: ${{ vars.E2E_SECRETS_XACCT_PROBE_NAMESPACE }}
          ALETHIA_E2E_SECRETS_XACCT_EXPECT_SHA256: ${{ vars.E2E_SECRETS_XACCT_EXPECT_SHA256 }}
          ALETHIA_E2E_SECRETS_XACCT_SUMMARY: ${{ runner.temp }}/secrets-xacct-summary.json
          # ── KEYLESS DATABASE AUTH (#1511) — the ship gate for epic #1500.
          #
          #    The first e2e for keyless (#722) on any cloud or engine. Until it runs, keyless is
          #    proven only by renderers that emit the right YAML — and the original AWS/Azure wiring
          #    rendered perfectly while being incapable of authenticating, for months, because no test
          #    ever opened a connection.
          #
          #    ENGINE_VERSION + INSTANCE_CLASS have NO defaults and are REQUIRED when enabled: the
          #    values valid on RDS are rejected by Cloud SQL and by Flexible Server, and again by the
          #    same cloud's other engine. Use the per-cloud siblings (…_ENGINE_VERSION_GCP) on a leg
          #    that differs. A missing one fails the run in seconds, before any provisioning spend.
          #
          #    REQUIRES the A0.6 apps repo above: the workload and its bootstrap Job reach the cluster
          #    only through GitOps, so without it there would be nothing to assert against.
          #
          #    Budget: the run holds a database session open past the cloud token's lifetime (16m by
          #    default) to prove the proxy mints per connection rather than caching one token. A
          #    shorter dwell would pass just as happily against a proxy that never rotates anything.
          #
          #    All plain VARIABLES. Unset ⇒ a clean skip; alibaba/hetzner resolve to the product's own
          #    documented exclusion and skip carrying it. ──
          ALETHIA_E2E_KEYLESS_DB: ${{ vars.E2E_KEYLESS_DB }}
          ALETHIA_E2E_KEYLESS_DB_ENGINE: ${{ vars.E2E_KEYLESS_DB_ENGINE }}
          ALETHIA_E2E_KEYLESS_DB_ENGINE_VERSION: ${{ vars.E2E_KEYLESS_DB_ENGINE_VERSION }}
          ALETHIA_E2E_KEYLESS_DB_INSTANCE_CLASS: ${{ vars.E2E_KEYLESS_DB_INSTANCE_CLASS }}
          ALETHIA_E2E_KEYLESS_DB_NAME: ${{ vars.E2E_KEYLESS_DB_NAME }}
          ALETHIA_E2E_KEYLESS_DB_SERVICE: ${{ vars.E2E_KEYLESS_DB_SERVICE }}
          ALETHIA_E2E_KEYLESS_DB_IMAGE: ${{ vars.E2E_KEYLESS_DB_IMAGE }}
          ALETHIA_E2E_KEYLESS_DB_CLIENT_IMAGE: ${{ vars.E2E_KEYLESS_DB_CLIENT_IMAGE }}
          ALETHIA_E2E_KEYLESS_DB_NAMESPACE: ${{ vars.E2E_KEYLESS_DB_NAMESPACE }}
          ALETHIA_E2E_KEYLESS_DB_SUMMARY: ${{ runner.temp }}/keyless-db-summary.json
          #    The per-cloud siblings the comment above TELLS a maintainer to use. They were missing,
          #    and this was worse than an unwired scenario: ENGINE_VERSION and INSTANCE_CLASS have no
          #    defaults and are REQUIRED, so a maintainer who followed the documentation and set
          #    E2E_KEYLESS_DB_ENGINE_VERSION_GCP got a run that died in seconds insisting a required
          #    variable was unset. t2ArgoEnvForProvider COMPOSES the name at runtime (base + "_" +
          #    upper(provider)), so `ALETHIA_E2E_KEYLESS_DB_ENGINE_VERSION_GCP` is written in no Go
          #    file and the literal-scanning reachability guard could never see the gap.
          #    TestPerCloudSiblingsReachTheNightly now can. gcp + azure only, matching the A0.6 repo
          #    wave above — alibaba/hetzner carry the product's own documented exclusion and skip.
          ALETHIA_E2E_KEYLESS_DB_ENGINE_GCP: ${{ vars.E2E_KEYLESS_DB_ENGINE_GCP }}
          ALETHIA_E2E_KEYLESS_DB_ENGINE_VERSION_GCP: ${{ vars.E2E_KEYLESS_DB_ENGINE_VERSION_GCP }}
          ALETHIA_E2E_KEYLESS_DB_INSTANCE_CLASS_GCP: ${{ vars.E2E_KEYLESS_DB_INSTANCE_CLASS_GCP }}
          ALETHIA_E2E_KEYLESS_DB_IMAGE_GCP: ${{ vars.E2E_KEYLESS_DB_IMAGE_GCP }}
          ALETHIA_E2E_KEYLESS_DB_CLIENT_IMAGE_GCP: ${{ vars.E2E_KEYLESS_DB_CLIENT_IMAGE_GCP }}
          ALETHIA_E2E_KEYLESS_DB_ENGINE_AZURE: ${{ vars.E2E_KEYLESS_DB_ENGINE_AZURE }}
          ALETHIA_E2E_KEYLESS_DB_ENGINE_VERSION_AZURE: ${{ vars.E2E_KEYLESS_DB_ENGINE_VERSION_AZURE }}
          ALETHIA_E2E_KEYLESS_DB_INSTANCE_CLASS_AZURE: ${{ vars.E2E_KEYLESS_DB_INSTANCE_CLASS_AZURE }}
          ALETHIA_E2E_KEYLESS_DB_IMAGE_AZURE: ${{ vars.E2E_KEYLESS_DB_IMAGE_AZURE }}
          ALETHIA_E2E_KEYLESS_DB_CLIENT_IMAGE_AZURE: ${{ vars.E2E_KEYLESS_DB_CLIENT_IMAGE_AZURE }}
          # ── CROSS-ACCOUNT KEYLESS REGISTRY PULL (#1047) — the last unproven link in epic #1046.
          #
          #    The `registry-token` MINT was proven in July 2026 against live ECR/GAR/ACR, but with
          #    AMBIENT LOCAL credentials and no cluster. The half the product actually ships — the B4
          #    tofu Workload-Identity pull role federating the in-cluster refresher, the refresher
          #    minting with NO local credential and patching the <slug>-pull Secret, and a real app
          #    pod pulling an image out of a DIFFERENT account/project/subscription through it — had
          #    never run. It LOOKED shipped: scripts/e2e/registry-e2e.sh invoked a test function that
          #    existed in no file, and this workflow set no variable for it at all.
          #
          #    Layers ON TOP of the base T2 proof, like #1268 and #1511: the base DEPLOY carries the
          #    *-xacct registry row (which activates the pull role) and a service whose image lives in
          #    the foreign registry, and the layer then asserts the mint, the pull, and — the control
          #    that makes it non-vacuous — that the SAME image does NOT pull without the Secret.
          #
          #    All THREE managed registry clouds are runnable (unlike #1268's aws-only lane): the
          #    grant the target account applies is a STANDING customer object, not a per-run identity.
          #    alibaba/hetzner resolve to the documented parity exclusion and skip carrying it.
          #
          #    REQUIRES the A0.6 apps repo above — the refresher and the probe workload reach the
          #    cluster only through GitOps.
          #
          #    All plain VARIABLES: an account id, a project, a registry host, an image reference and
          #    an identity REFERENCE are not sensitive. Nothing here is a pull token — the token is
          #    minted in-cluster and never leaves it. Unset ⇒ a clean skip.
          #
          #    NOT SET TODAY, deliberately: the target-account trust (an ECR repository policy, a
          #    cross-project artifactregistry.reader grant, an AcrPull assignment) plus a scoped
          #    canary image must be applied out of band first. See docs/testing/xacct-registry-parity.md. ──
          ALETHIA_E2E_XACCT_REGISTRY: ${{ vars.E2E_XACCT_REGISTRY }}
          ALETHIA_E2E_XACCT_REGISTRY_HOST: ${{ vars.E2E_XACCT_REGISTRY_HOST }}
          ALETHIA_E2E_XACCT_REGISTRY_IMAGE: ${{ vars.E2E_XACCT_REGISTRY_IMAGE }}
          ALETHIA_E2E_XACCT_REGISTRY_ACCOUNT: ${{ vars.E2E_XACCT_REGISTRY_ACCOUNT }}
          ALETHIA_E2E_XACCT_REGISTRY_PROJECT_ID: ${{ vars.E2E_XACCT_REGISTRY_PROJECT_ID }}
          ALETHIA_E2E_XACCT_REGISTRY_REGION: ${{ vars.E2E_XACCT_REGISTRY_REGION }}
          ALETHIA_E2E_XACCT_REGISTRY_ROLE_ARN: ${{ vars.E2E_XACCT_REGISTRY_ROLE_ARN }}
          ALETHIA_E2E_XACCT_REGISTRY_READER_SA: ${{ vars.E2E_XACCT_REGISTRY_READER_SA }}
          ALETHIA_E2E_XACCT_REGISTRY_CLIENT_ID: ${{ vars.E2E_XACCT_REGISTRY_CLIENT_ID }}
          ALETHIA_E2E_XACCT_REGISTRY_SERVICE: ${{ vars.E2E_XACCT_REGISTRY_SERVICE }}
          ALETHIA_E2E_XACCT_REGISTRY_NAMESPACE: ${{ vars.E2E_XACCT_REGISTRY_NAMESPACE }}
          #    The summary is written here but the nightly proof bundle does NOT fold it in yet: that
          #    belongs in the capture step + demos/proofs/capture-proof.sh, which PR #1941 is
          #    rewriting. Stated rather than half-wired — scripts/e2e/registry-e2e.sh points this at
          #    its own bundle, so the verdict already has a real consumer on the recording path.
          ALETHIA_E2E_XACCT_REGISTRY_SUMMARY: ${{ runner.temp }}/xacct-registry-summary.json

          # ── ACM certificate against the DELEGATED zone (#1773). ────────────────────────────────
          #    The only scenario that proves Alethia can issue a REAL, publicly-validated TLS
          #    certificate. It brings the STABLE zone created by infra/aws-oidc/e2e-dns.tf rather
          #    than letting the template make one, because ACM validates over the PUBLIC internet
          #    and a zone we merely created is delegated by nobody.
          #
          #    ⚠️ MUTUALLY EXCLUSIVE WITH E2E_MAX_CONFIG, and the harness refuses the combination
          #    LOUDLY rather than skipping: bringing a zone id makes cloud_dns_enabled false, so no
          #    aws_route53_zone is created and the max-config `dns` kind reports Missing. Run this
          #    on a floor night; the full bar proves the native-zone path.
          #
          #    ⚠️ PREREQUISITE OUTSIDE THIS REPO: e2e.alethialabs.io must be delegated from
          #    Cloudflare to that zone's four name servers. Until then ACM cannot issue no matter
          #    what is set here. `dig NS e2e.alethialabs.io` is the check.
          #
          #    aws-only and that is a real ceiling: GCP and Azure issue TLS in-cluster via
          #    cert-manager (#1858 deleted GCP's managed-certificate resource), so there is no
          #    cloud-side certificate for this to assert. UNSET ⇒ empty ⇒ a clean skip.
          #    ⚠️ WITHHELD ON A MAX-CONFIG DIMENSION, or aws's two heaviest cells cannot run AT ALL.
          #
          #    `t2_acm_cert.go:161` refuses LOUDLY when this and ALETHIA_E2E_MAX_CONFIG are both set,
          #    and it is right to: this scenario brings a zone id, which makes `cloud_dns_enabled`
          #    false, so no `aws_route53_zone` is created and the max-config `dns` kind reports
          #    Missing. Its message says "run the certificate proof on a floor night; the full bar
          #    proves the native-zone path" — but there was no mechanism to DO that. `E2E_ACM_CERT`
          #    is a repo VARIABLE, so it is set on every run, and `full` sets MAX_CONFIG by
          #    definition. Every aws full/maxconfig dispatch therefore died at that gate in 0.00s
          #    having provisioned nothing (run 32878327250), permanently, for as long as the
          #    variable exists. A correct refusal became an unreachable dimension.
          #
          #    The exclusion RULE still lives in exactly one place (t2_acm_cert.go); this reads the
          #    DERIVED value resolve-dimension.sh already wrote to $GITHUB_ENV, so there is no
          #    second list of which dimensions are heavy.
          #
          #    The condition is INVERTED on purpose. GitHub's `A && B || C` is not a ternary: when
          #    the true-branch value is the empty string it is falsy, so `max_config && '' || vars.X`
          #    falls through and yields X — the exact opposite of what it reads as. Testing for the
          #    dimension that SHOULD carry the variable keeps the truthy value on the `&&` side.
          ALETHIA_E2E_ACM_CERT: ${{ env.ALETHIA_E2E_MAX_CONFIG != '1' && vars.E2E_ACM_CERT || '' }}
          ALETHIA_E2E_ACM_CERT_ZONE_ID: ${{ vars.E2E_ACM_CERT_ZONE_ID }}
          ALETHIA_E2E_ACM_CERT_ZONE_NAME: ${{ vars.E2E_ACM_CERT_ZONE_NAME }}
          ALETHIA_E2E_ACM_CERT_TIMEOUT: ${{ vars.E2E_ACM_CERT_TIMEOUT }}
          ALETHIA_E2E_ACM_CERT_SUMMARY: ${{ runner.temp }}/acm-cert-summary.json
          # ── Convergence budgets, so a "too slow" can be told apart from a "never". ──
          #
          #    These knobs already existed in the harness and were reachable ONLY from a laptop,
          #    which made two open questions unanswerable from CI at any price:
          #
          #      * #2717 class (b) — falco/loki/vault sat `Progressing` at the end of the add-on
          #        budget. Raising ALETHIA_E2E_ARGO_TIMEOUT for one run distinguished "the budget is
          #        short" from "this will never converge". ANSWERED, run 33107415369: the budget was
          #        short. kube-prometheus-stack, loki and vault all cleared by 35m, which is now the
          #        derived default for the 18-chart surface (test/e2e/argocd_assert.go). falco and
          #        harbor were still Progressing at 35m and are the genuine ceilings.
          #      * #2591 — the day-2 ArgoCD-URL probe failed on the first run that ever had a URL.
          #        Its 3m default was chosen when the probe could not run on ANY cloud, so it was
          #        never sized against a real ALB plus external-dns plus Route53 propagation. The
          #        cheap discriminator is one run at 10m; without this line there was no way to ask.
          #
          #    Unset resolves to "" and every reader falls back to its own default, so adding these
          #    changes no behaviour until a variable is deliberately set — and the variable is the
          #    audit trail for why a run had a non-standard budget.
          # The DISPATCH INPUT WINS over the variable, and that ordering is the point. The comment
          # above calls the variable "the audit trail for why a run had a non-standard budget" —
          # true, and it is a STANDING one: a variable set to answer one question keeps answering it
          # for every run afterwards, including the nightly, until somebody remembers to unset it.
          # A silently-widened budget is exactly the kind of stale fact this repo keeps paying for.
          #
          # A dispatch input is scoped to the single run that asked, and the run's own inputs are a
          # permanent audit trail on its page. The variable stays for a deliberate standing change.
          ALETHIA_E2E_ARGO_TIMEOUT: ${{ inputs.argo_timeout || vars.E2E_ARGO_TIMEOUT }}
          # ── The azure Managed Redis escape hatch (#3078). ──
          #
          #    t2RequireAzureManagedRedisPreflight refuses a (region, sku) pair a real apply has
          #    already been refused on — today westeurope/Balanced_B0, measured by run 33108860073.
          #    Capacity DOES come back, and Azure exposes no read-only capacity API to ask with, so
          #    the only way to re-test is a full paid apply. This input buys exactly one.
          #
          #    NO `vars.` FALLBACK, unlike its neighbours above, and for the reason those neighbours
          #    state: a repo variable is a STANDING change, so setting one here would wave the
          #    refusal through on every scheduled nightly afterwards — silently reinstating the
          #    ~1724s failure this gate was built to stop. One run, one dispatch, one audit trail.
          #
          #    `&& '1' || ''` is safe here (see the ACM note above for the trap): the TRUE branch is
          #    a non-empty string, so it cannot fall through to the false branch. On `schedule`
          #    `inputs.*` is empty ⇒ '' ⇒ the gate refuses, which is the default that costs nothing.
          ALETHIA_E2E_AZURE_REDIS_ALLOW_KNOWN_BAD: ${{ inputs.azure_redis_allow_known_bad && '1' || '' }}
          ALETHIA_E2E_DAY2_ACCESS_TIMEOUT: ${{ vars.E2E_DAY2_ACCESS_TIMEOUT }}
          ALETHIA_E2E_DAY2_OFFER_TIMEOUT: ${{ vars.E2E_DAY2_OFFER_TIMEOUT }}
          ALETHIA_E2E_KEYLESS_DB_DWELL: ${{ vars.E2E_KEYLESS_DB_DWELL }}
          # ── Per-add-on diagnostic logging, for ONE run. ──
          #
          #    A comma-separated list of add-on ids whose entry in `applyAddOnDebugOverrides`
          #    (test/e2e/addon_surface.go) should be applied. Today only `falco` has one: its
          #    libs_logger, which is the layer `scap_init` reports from and is what #2866 needs to
          #    tell "Talos forbids BPF" from "the chart is missing a mount".
          #
          #    NOT a catalog default, deliberately: the pinned falco chart's own values say
          #    libs_logger "is not recommended for production use", and the catalog is what a
          #    CUSTOMER installs. Unset changes nothing, so the run keeps proving the shipped
          #    catalog until somebody deliberately sets the variable for one investigation.
          ALETHIA_E2E_ADDON_DEBUG: ${{ vars.E2E_ADDON_DEBUG }}
          # ── The max-config DNS zone suffix, global and per-cloud. ──
          #
          #    Hetzner DNS REFUSES a `.io` zone outright — its API answers `unsupported tld
          #    (invalid_input)`, 422, measured against the live API (dns-zone-support.ts). The suffix was a
          #    compiled-in constant, so hetzner/maxconfig and hetzner/full were blocked on the TLD of
          #    a `const` on every run, whatever else got fixed.
          #
          #    The per-provider form is what a maintainer sets, NOT the global one: aws's certificate
          #    path is wired to this same zone (E2E_ACM_CERT_ZONE_ID / _ZONE_NAME name
          #    e2e.alethialabs.io, and ACM has issued against it). Moving every cloud in one step
          #    would have aws request a certificate for a zone it does not hold. Unset ⇒ the
          #    compiled default, so nothing changes until a zone is actually delegated.
          ALETHIA_E2E_MAXCONFIG_DOMAIN_SUFFIX: ${{ vars.E2E_MAXCONFIG_DOMAIN_SUFFIX }}
          ALETHIA_E2E_MAXCONFIG_DOMAIN_SUFFIX_HETZNER: ${{ vars.E2E_MAXCONFIG_DOMAIN_SUFFIX_HETZNER }}
          ALETHIA_E2E_GCP_EXTERNAL_DNS_SA: ${{ vars.E2E_GCP_EXTERNAL_DNS_SA }}
          # ── CLI-ONLY DEMO BAR — can the whole product be driven from the terminal?
          #
          #    Every other layer here asks whether the PLATFORM works. This one asks whether the
          #    PRODUCT is REACHABLE: a prospect must get from an empty account to a running,
          #    verified, torn-down cluster using `alethia` alone, and until test/e2e/t2_cli_demo.go
          #    existed nothing asserted it — the console-only gaps were discoverable only by trying,
          #    one at a time, in front of an audience.
          #
          #    It provisions NOTHING and costs NOTHING: the question is whether each step of the
          #    demo resolves to a real command, so the check is `alethia <cmd> --help` over the
          #    table's 20 steps. The provisioning half is already proven by the base T2 spine;
          #    re-driving it through the CLI would double the bill to re-prove it. That is why this
          #    is safe to leave ON for every cloud rather than dispatching it like a spend scenario.
          #
          #    ALETHIA_E2E_CLI_BIN points at the binary under test. Leave it UNSET and the harness
          #    uses whatever `alethia` is on PATH. Point it at a RELEASE artifact to prove the bar
          #    against the binary that actually ships — which is the only run that means anything:
          #    the released CLI was v0.4.0 while `project ... placement` (#2313) and
          #    `connector hetzner` (#2316) existed only on dev, so a green run against a working-tree
          #    build would have proven the wrong thing.
          #
          #    Both plain VARIABLES. Unset ⇒ empty ⇒ a clean skip. ──
          ALETHIA_E2E_CLI_DEMO: ${{ vars.E2E_CLI_DEMO }}
          ALETHIA_E2E_CLI_BIN: ${{ vars.E2E_CLI_BIN }}
          # ── The image the in-cluster bootstrap Jobs run (#3216). `selfimage.Ref()` reads this
          #    FIRST, ahead of the ALETHIA_RUNNER_SELF_IMAGE a published image bakes in — which is
          #    exactly the override it was built for, and which nothing that shipped ever set.
          #
          #    A DIGEST, from the runner-image job, built from THIS commit. Not a released tag: the
          #    e2e must not prove a binary built from a different commit than the one under test.
          #
          #    EMPTY on a non-heavy dimension, because the job is skipped there — and empty is the
          #    correct answer, not a broken one. `Ref()` returns "", both renderers fail closed and
          #    say so, and no dimension below `maxconfig`/`addons`/`full` installs a Vault to
          #    bootstrap. So this degrades to exactly today's behaviour rather than to a Job that
          #    cannot succeed.
          ALETHIA_RUNNER_IMAGE: ${{ needs.runner-image.outputs.image }}
          # ── Pre-apply cost ceiling (BYOC A1.4). The in-process runner reads INFRACOST_API_KEY to
          #    price the apply's plan and ALETHIA_COST_CEILING_MONTHLY_USD to fail-closed a real
          #    apply whose estimated monthly cost exceeds the ceiling (or that can't be priced).
          #    Both are aws-relevant: the secret enables the estimate, the var (default $300/mo, a
          #    monthly-estimate guard dominated by the always-on EKS control plane + single NAT ⇒ a
          #    cheap run ≈ $150–200/mo) catches a runaway shape. Enabling the ceiling REQUIRES the
          #    secret — without it the guard fail-closes (a ceiling with no estimate refuses). For
          #    non-aws providers the ceiling is unset ⇒ no cost gate (their waves add their own).
          #    On a HEAVY-SHAPE run (P2-F, #1068) the 11-kind / 18-add-on surface bills more (extra
          #    managed resources + add-on scale-up, on a bigger node pool), so the ceiling is raised
          #    to the full-bar var (default $600/mo).
          #
          #    KEYED ON E2E_HEAVY_SHAPE, NOT E2E_FULL_BAR. The ceiling has to follow the SHAPE it is
          #    pricing: `maxconfig` and `addons` now provision the heavy pool too, and pricing them
          #    against the $300 floor ceiling would hard-fail the pre-apply cost guard on aws before
          #    the run started. Same expression as the node-shape override above, on purpose. ──
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
          ALETHIA_COST_CEILING_MONTHLY_USD: ${{ matrix.provider == 'aws' && (env.E2E_HEAVY_SHAPE == 'true' && (vars.E2E_AWS_COST_CEILING_FULL_USD || '600') || (vars.E2E_AWS_COST_CEILING_USD || '300')) || '' }}
          # The two outer rungs, passed in so t2budget can verify them against what this leg needs.
          # They are the SAME expressions as the step/job timeout-minutes above; if you change one,
          # change both — and t2budget will tell you if you got it wrong, on the next run.
          #
          # 100/120 → 142/157 (and 195/210 → 225/240) for TWO reasons that arrived together:
          #   1. an aws `full` bar's ladder is ctx 102m, which 100m could never contain — the two
          #      heaviest cells were unreachable by arithmetic, not by any cloud's fault; and
          #   2. ResolveT2Budget now RESERVES the in-process teardown window in the go-timeout
          #      (#2729), which every rung above it inherits. The window itself is per-provider and
          #      lives in t2ProviderTable, deliberately not restated here — it has already moved once
          #      (30m → 45m managed) and a copy of it in this comment would now be wrong.
          #
          # 142/157 -> 145/160 (fabric 237/252 -> 250/265) because the day-2 access layer became a
          # RESERVED ladder term. Its probes always consumed ctx; nothing reserved for them, so the
          # time came silently out of `headroom` — the same defect shape as the teardown window
          # below. Making it explicit necessarily surfaces in the outer backstop. MEASURED, per real
          # dimension rather than a cartesian product: the worst leg is aws/full at step 145 / job
          # 160 (aws/day2 is 143/158, i.e. the old cap was already too small for it).
          #
          # The fabric-demo branch moved further, to 237/252, and NOT only because of teardown: at
          # 195/210 it could not contain its own ladder either. An aws leg with the demo on resolves
          # to ctx 197m, which needed step 207m / job 222m even BEFORE teardown was reserved. It has
          # never been dispatched (E2E_FABRIC_DEMO is unset), so t2budget had no run in which to say
          # so — measured here with `-step-cap-minutes 999` rather than inferred.
          #
          # 145/160 -> 165/180 (fabric 250/260 -> 260/275) for #2717: the ArgoCD convergence budget
          # for the 18-chart surface is now the MEASURED 35m (hetzner/addons run 33107415369) rather
          # than a derived-and-never-observed 19m30s, and its ceiling is 40m. Raising that budget
          # alone would only have moved where an `addons` run dies — 145 could not contain it — so
          # the caps move with it. The arithmetic, at the CEILING so a growing catalog needs no edit
          # here (aws/gcp/azure/alibaba `full`, the widest real dimension):
          #
          #   ctx = deploy-wait 50 + argocd-converge 40 + soak 25 + day2-access 3 + headroom 7 = 125
          #   go  = ctx + teardown 30 + 5 = 160  ·  step = go + 5 = 165  ·  job = step + 15 = 180
          #
          # 165/180 -> 180/195 (fabric 260/275 -> 275/290) because the managed teardown window is
          # now 45m, not 30m. aws/floor run 33155063965 spent all 30m of it and was SIGINT'd with an
          # internet gateway at 19m50s and three subnets at 17m0s — every one of them still inside
          # the AWS provider's own 20m delete ceiling, so the destroy was ~3m from returning a NAMED
          # error and instead reported `tofu destroy failed: signal: interrupt`, which names nothing.
          # The reserved rung moved, so these two move with it:
          #
          #   ctx = 125 (unchanged; teardown is deliberately NOT in the ctx)
          #   go  = ctx + teardown 45 + 5 = 175  ·  step = go + 5 = 180  ·  job = step + 15 = 195
          #
          # This is the outer GitHub-level backstop, NOT the effective bound on a cheap leg: the
          # ladder is per-provider and per-dimension, so a floor run is still killed by its own
          # ~100m go-timeout. This pair only binds if every finer timeout has already failed.
          #
          # TestArgoBudgetCeilingFitsTheWorkflowCaps (test/e2e/argo_budget_pure_test.go) now proves
          # this offline on every PR, across every cloud x dimension, and additionally holds these
          # two to being the SAME expressions as the `timeout-minutes:` above — which the
          # "if you change one, change both" instruction asked for and nothing enforced.
          T2_STEP_CAP_MINUTES: ${{ vars.E2E_FABRIC_DEMO != '' && 285 || 190 }}
          T2_JOB_CAP_MINUTES: ${{ vars.E2E_FABRIC_DEMO != '' && 300 || 205 }}
          # Where the go-test stream is teed so capture-proof.sh can put the ASSERTIONS in the
          # committed bundle. ALETHIA_E2E_T2_RUNNER_LOG above is the RUNNER's deployment log — a
          # different stream, which carries no `--- PASS` and no A0.x decision lines.
          ALETHIA_E2E_T2_TEST_LOG: ${{ runner.temp }}/t2-test.log
        run: |
          # Derive the go-timeout from the harness's OWN budget arithmetic, in this step, with this
          # step's env — so the number `go test` is given and the ctx the test builds come from one
          # function (ResolveT2Budget) and cannot drift. It also verifies the step/job caps and fails
          # here, before any provisioning spend, if either cannot contain the ladder.
          # See test/e2e/cmd/t2budget for the whole story.
          eval "$(GOWORK=off go run ./cmd/t2budget \
            -provider "$ALETHIA_E2E_PROVIDER" \
            -env "$ALETHIA_E2E_ENV" \
            -step-cap-minutes "$T2_STEP_CAP_MINUTES" \
            -job-cap-minutes "$T2_JOB_CAP_MINUTES")"
          echo "::notice::T2 ctx ${ctx_minutes}m · go-timeout ${go_timeout} · step cap ${T2_STEP_CAP_MINUTES}m · job cap ${T2_JOB_CAP_MINUTES}m"
          # pipefail is load-bearing here for the same reason it is at the Trivy install above:
          # without it `go test | tee` reports TEE's status, so a FAILING e2e run would report
          # success and the whole nightly would go quietly green. Only `-o pipefail` is set, not
          # `-e`/`-u`, so nothing else in this block changes behaviour.
          set -o pipefail
          GOWORK=off go test -tags=e2e_t2 ./... \
            -run TestT2RealCloudProvisioning -count=1 -timeout "$go_timeout" -v \
            2>&1 | tee "$ALETHIA_E2E_T2_TEST_LOG"

      # ── Teardown, CANCELLATION PATH ONLY (#2330). ───────────────────────────────────────────
      #
      #    A cancelled job gets ONE shared budget for everything still queued — the runner arms a
      #    single kill timer at (cancel-timeout − 15s), i.e. 4m45s by default, and kills the whole
      #    worker when it expires (actions/runner JobDispatcher.cs). Every remaining `always()`
      #    step AND every action `post:` step draws from that same 285 seconds.
      #
      #    The `Guaranteed teardown` step at the bottom of this job is therefore LAST IN LINE on
      #    the one path where the budget is scarce: proof capture, two artifact uploads and a log
      #    scrub all run first. On run 31459117502 it was reached with the window nearly gone,
      #    was killed mid-sweep with an EMPTY step conclusion, and left an EKS control plane, a
      #    NAT gateway and a VPC standing — ~$105/month, until swept by hand.
      #
      #    So on the cancellation path ONLY, sweep here instead: first in the queue, whole window.
      #
      #    WHY NOT JUST MOVE THE EXISTING STEP UP. Because `Capture proof` below reads LIVE
      #    CLUSTER STATE through $HOME/.alethia/kubeconfig. Tearing down before it would gut the
      #    proof bundle on every SUCCESSFUL night to fix a rare cancellation — trading the
      #    nightly's whole committable-evidence purpose for it. `cancelled()` is false on the
      #    success and failure paths, so this step is skipped there and the existing late teardown
      #    runs after capture exactly as before.
      #
      #    `cancelled()` and NOT `!cancelled()`: GitHub's expressions page recommends the latter as
      #    the modern replacement for `always()`, and under cancellation it evaluates FALSE — on a
      #    teardown step that advice means it never runs at all.
      #
      #    This is MITIGATION, not a guarantee. A cancel arriving after this step's position, a
      #    REST force-cancel (which bypasses conditions outright) or a runner shutdown (which skips
      #    condition evaluation entirely) all still land on e2e-orphan-reaper.yml. Nothing that
      #    lives inside the job it protects can cover the job dying; this only makes the common
      #    case win the race it was previously losing. ──
      - name: Teardown on cancellation (first in the 4m45s window)
        if: cancelled() && steps.gate.outputs.run == 'true'
        env:
          PROVIDER: ${{ matrix.provider }}
          ALETHIA_E2E_ENV: ${{ env.E2E_ENV }}
          ALETHIA_E2E_PROJECT: ${{ env.E2E_PROJECT }}
        run: |
          if [ -z "${E2E_CLUSTER:-}" ] || [ -z "${E2E_ENV:-}" ]; then
            echo "::warning::E2E_CLUSTER/E2E_ENV unset at cancellation — nothing was provisioned yet, nothing to sweep."
            exit 0
          fi
          # The run-scoped Load Balancer binding the test captured BEFORE `tofu destroy` deleted
          # the private network that carries it (#3481). A fixed path both ends agree on, because
          # the test process exits long before this step runs and can hand nothing over. Absent is
          # normal — a hard-killed run never got to capture — and the sweeper falls back to the
          # project-wide question, which over-reports rather than under-reports.
          export ALETHIA_E2E_HCLOUD_LB_IDS="${RUNNER_TEMP}/hcloud-lb-ids.txt"
          case "$PROVIDER" in
            hetzner) SCRIPT="./scripts/e2e/hcloud-cleanup.sh" ;;
            aws)     SCRIPT="./scripts/e2e/aws-cleanup.sh" ;;
            gcp)     SCRIPT="./scripts/e2e/gcp-cleanup.sh" ;;
            azure)   SCRIPT="./scripts/e2e/azure-cleanup.sh" ;;
            alibaba) SCRIPT="./scripts/e2e/alibaba-cleanup.sh" ;;
            *) echo "::error::unknown provider '$PROVIDER'"; exit 1 ;;
          esac
          [ -x "$SCRIPT" ] || { echo "::error::$SCRIPT missing/not executable"; exit 1; }
          echo "::warning::job CANCELLED — sweeping ${E2E_ENV} now, ahead of proof capture, because the window is shared and short."
          "$SCRIPT" "$E2E_CLUSTER"

      - name: Capture proof (scrubbed bundle + step-summary verdict)
        id: capture
        if: steps.gate.outputs.run == 'true' && always()
        env:
          PROVIDER: ${{ matrix.provider }}
          # The scrub's exact-literal list is built from the credentials visible HERE. HCLOUD_TOKEN
          # is job-level and inherited; E2E_GIT_TOKEN was not exposed to this step at all, so the
          # git token was silently absent from the list the bundle is scrubbed against (#1854).
          E2E_GIT_TOKEN: ${{ secrets.E2E_GIT_TOKEN }}
          ALETHIA_E2E_PROOF_OUTCOME: ${{ steps.t2.outcome }}
          ALETHIA_E2E_PROOF_RUN_TAG: nightly-${{ github.run_id }}-${{ github.run_attempt }}
          # WHICH CLAIM this bundle makes. Passed explicitly rather than left to the inherited job
          # env: the same fields read identically for an add-on sweep (where the ArgoCD convergence
          # IS the verdict) and a floor run (where it is a supporting fact), and nothing downstream
          # could tell them apart — which is how a cell was promoted on unmeasured counts (#3281).
          ALETHIA_E2E_DIMENSION: ${{ env.E2E_DIMENSION }}
          ALETHIA_E2E_T2_RUNNER_LOG: ${{ runner.temp }}/t2-runner.log
          # The go-test stream, which is where the ASSERTIONS come from. Declared on the t2 step
          # since #2645 and never here, so `capture-proof.sh` always took its else branch and every
          # bundle warned "carries NO test assertions". `env:` on a step does not inherit from a
          # sibling step, only from the job — and this step re-declares fifteen other summary paths
          # for exactly that reason, which is what made the omission invisible: the list LOOKS
          # exhaustive. Measured before this line: 0 assertions.txt across 45 committed bundles.
          ALETHIA_E2E_T2_TEST_LOG: ${{ runner.temp }}/t2-test.log
          # Day-2 soak summary (BYOC A0.3), written by the T2 test; folded into the bundle +
          # step-summary verdict when present (absent ⇒ the capture is unchanged).
          ALETHIA_E2E_SOAK_SUMMARY: ${{ runner.temp }}/soak-summary.json
          # ArgoCD convergence counts (#2688), written by the T2 assertion at the SAME path the t2
          # step set. This is the one summary the capture must NOT be indifferent to: it is what
          # makes a PASS bundle numerically different from a FAIL one. Absent ⇒ the capture says so
          # rather than falling back to 0/0, which is the defect this replaces.
          ALETHIA_E2E_ARGOCD_SUMMARY: ${{ runner.temp }}/argocd-summary.json
          ALETHIA_E2E_SECRETS_XACCT_SUMMARY: ${{ runner.temp }}/secrets-xacct-summary.json
          # Keyless DB auth summary (#1511), written by the T2 layer at the SAME path the t2 step
          # set; folded into the bundle + step-summary verdict, with the rotation dwell beside it so
          # a shortened-dwell PASS cannot read like a full one. Absent ⇒ the capture is unchanged.
          ALETHIA_E2E_KEYLESS_DB_SUMMARY: ${{ runner.temp }}/keyless-db-summary.json
          # Day-2 access summary (P2-E), written by the T2 test at the SAME path the t2 step set;
          # pass it through so the capture folds the access verdict into the bundle + step summary
          # (#1525 — it was written but never read). Absent ⇒ the capture is unchanged.
          ALETHIA_E2E_DAY2_ACCESS_SUMMARY: ${{ runner.temp }}/day2-access-summary.json
          # Day-2 offer postures (#1495), written by the T2 test; folded into the bundle +
          # step-summary verdict exactly like the soak summary above (absent ⇒ unchanged).
          ALETHIA_E2E_DAY2_OFFER_SUMMARY: ${{ runner.temp }}/day2-offer-summary.json
          # Fabric enterprise-demo acceptance verdict (#845), written by the T2 test at the SAME
          # path the t2 step set; folded into the bundle + step summary (absent ⇒ unchanged).
          ALETHIA_E2E_FABRIC_DEMO_SUMMARY: ${{ runner.temp }}/fabric-demo-summary.json
          ALETHIA_E2E_ACM_CERT_SUMMARY: ${{ runner.temp }}/acm-cert-summary.json
          # BYO-IaC continuous-proof verdict (#1765), written by the T2 leg at the SAME path the t2
          # step set; folded into the bundle + step summary (absent ⇒ unchanged). It carries only
          # names, booleans, counts and a PUBLIC commit + plan digest.
          ALETHIA_E2E_BYO_IAC_SUMMARY: ${{ runner.temp }}/byo-iac-summary.json
          # Map the GITHUB_ENV names the compute-cluster step wrote into the ALETHIA_* names
          # the capture script reads (region + the unique cluster name for the summary).
          ALETHIA_E2E_REGION: ${{ env.E2E_REGION }}
          ALETHIA_E2E_CLUSTER: ${{ env.E2E_CLUSTER }}
        run: |
          # The runner's kubeconfig only exists on the success path. Point KUBECONFIG at it
          # when present so the capture reads real cluster state; otherwise leave it unset and
          # the capture cleanly skips cluster-state and records the failure stage instead.
          if [ -f "$HOME/.alethia/kubeconfig" ]; then
            export KUBECONFIG="$HOME/.alethia/kubeconfig"
          fi
          ./demos/proofs/capture-proof.sh "${{ matrix.provider }}"

      # GATED ON THE CAPTURE STEP (#1923). capture-proof.sh deletes a bundle that fails the secret
      # tripwire, which covers the tripwire path — but this step used to upload whenever the gate
      # step had merely produced an output, and that says nothing about whether the capture got as
      # far as running the tripwire AT ALL. capture-proof.sh is `set -euo pipefail`: any earlier
      # failure aborts it with a partially-written, never-checked bundle on disk, and `if: always()`
      # published exactly that. Uploading is now conditional on the capture having SUCCEEDED, so
      # "unscrubbed" and "unchecked" are both unpublishable, not just the former.
      #
      # Two branches, and only two: a gate-OFF leg (run == 'false') publishes the inert marker the
      # `Record gate-off proof` step wrote — no cloud ran, no secret was in scope, nothing to scrub.
      # A gate-ON leg publishes only if the capture step succeeded.
      - name: Upload proof artifact
        if: always() && (steps.gate.outputs.run == 'false' || steps.capture.outcome == 'success')
        uses: actions/upload-artifact@v7
        with:
          name: e2e-proof-${{ matrix.provider }}-${{ github.run_id }}
          path: demos/proofs/${{ matrix.provider }}/
          if-no-files-found: warn
          retention-days: 30

      # …but a capture that ABORTED still has something worth publishing: the CAPTURE-ABORTED.txt
      # marker capture-proof.sh leaves in place of the deleted bundle, so an empty artifact slot
      # cannot be misread as "this cloud never ran". The step above would otherwise suppress it.
      #
      # Fail-closed BY CONSTRUCTION rather than by trust: the path is a glob for that one filename,
      # so it can only ever match the marker — never a captured file that escaped the delete. The
      # marker is written only on the path where the bundle has already been removed, and the two
      # steps are mutually exclusive on `outcome`, so they can share one artifact name safely.
      - name: Upload capture-abort marker
        if: always() && steps.capture.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-proof-${{ matrix.provider }}-${{ github.run_id }}
          path: demos/proofs/${{ matrix.provider }}/**/CAPTURE-ABORTED.txt
          if-no-files-found: ignore
          retention-days: 30

      # The raw runner log carries a `tofu show -json` plan, and OpenTofu emits the root
      # module's `variables` map with RAW values — so uploading it verbatim published a live
      # HCLOUD_TOKEN on this public repo (#1854). Scrub it through the SAME library the proof
      # bundle uses, and fail closed: if a secret survives, this step goes red and the upload
      # below finds nothing to publish.
      - name: Scrub the runner log before upload
        id: scrublog
        if: steps.gate.outputs.run == 'true' && always()
        env:
          # HCLOUD_TOKEN is job-level and inherited. E2E_GIT_TOKEN is NOT — it is only ever
          # exposed to the T2 step as ALETHIA_E2E_GIT_TOKEN — so the literal list would omit
          # it unless it is named here.
          E2E_GIT_TOKEN: ${{ secrets.E2E_GIT_TOKEN }}
        run: |
          ./demos/proofs/scrub-runner-log.sh \
            "${{ runner.temp }}/t2-runner.log" \
            "${{ runner.temp }}/runner-log-scrubbed"

      # Same gating as the proof bundle. scrub-runner-log.sh already `rm -f`s the file it refuses,
      # so this was correct by accident; make it correct by declaration, so both upload steps state
      # the same invariant instead of one depending on the other's side effect.
      - name: Upload runner log (scrubbed)
        if: always() && steps.scrublog.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: t2-runner-log-${{ matrix.provider }}-${{ github.run_id }}
          path: ${{ runner.temp }}/runner-log-scrubbed/t2-runner.log
          if-no-files-found: ignore
          retention-days: 14

      # ── GUARANTEED teardown. Runs on ANY outcome of the proof (pass/fail/timeout/cancel) as
      #    long as we actually started provisioning. The graceful in-process `tofu destroy`
      #    already ran on the normal path; this scope-locked cloud sweep is the belt-and-
      #    suspenders for a hard-killed test process. Every sweeper filters on THIS run's unique
      #    handle — hetzner: label `cluster=$E2E_CLUSTER`; the managed clouds: the
      #    `alethia:project-id=e2e-$E2E_ENV` tag (the always-emitted, unique-per-run sweep handle;
      #    + per-cloud belt filters for out-of-band resources) — NEVER account-wide (the
      #    shared-account near-wipe; see scope-destructive-cloud-ops).
      #
      #    FAIL-CLOSED: a provider that provisioned but has no sweeper script is a HARD ERROR,
      #    never a silent skip — so a cloud can never be enabled (its gate set) without its
      #    sweeper shipped alongside. Each cloud's sweeper lands in its wave (aws A1.3, gcp/azure
      #    A2, alibaba A3.1); until then that cloud green-skips at the gate (run=false) and never
      #    reaches here. ──
      - name: Guaranteed teardown (scope-locked cloud sweep)
        if: steps.gate.outputs.run == 'true' && always()
        env:
          PROVIDER: ${{ matrix.provider }}
          # The managed sweepers read their scope from these ALETHIA_E2E_* names (the compute
          # step wrote E2E_* to $GITHUB_ENV; map them here). ALETHIA_E2E_REGION is already in
          # $GITHUB_ENV; ENV/PROJECT are mapped explicitly.
          ALETHIA_E2E_ENV: ${{ env.E2E_ENV }}
          ALETHIA_E2E_PROJECT: ${{ env.E2E_PROJECT }}
        run: |
          if [ -z "${E2E_CLUSTER:-}" ] || [ -z "${E2E_ENV:-}" ]; then
            echo "::error::E2E_CLUSTER/E2E_ENV is unset — refusing to run an unscoped cleanup."
            exit 1
          fi
          # The run-scoped Load Balancer binding the test captured BEFORE `tofu destroy` deleted
          # the private network that carries it (#3481). A fixed path both ends agree on, because
          # the test process exits long before this step runs and can hand nothing over. Absent is
          # normal — a hard-killed run never got to capture — and the sweeper falls back to the
          # project-wide question, which over-reports rather than under-reports.
          export ALETHIA_E2E_HCLOUD_LB_IDS="${RUNNER_TEMP}/hcloud-lb-ids.txt"
          case "$PROVIDER" in
            hetzner) SCRIPT="./scripts/e2e/hcloud-cleanup.sh" ;;
            aws)     SCRIPT="./scripts/e2e/aws-cleanup.sh" ;;
            gcp)     SCRIPT="./scripts/e2e/gcp-cleanup.sh" ;;
            azure)   SCRIPT="./scripts/e2e/azure-cleanup.sh" ;;
            alibaba) SCRIPT="./scripts/e2e/alibaba-cleanup.sh" ;;
            *) echo "::error::unknown provider '$PROVIDER'"; exit 1 ;;
          esac
          if [ ! -x "$SCRIPT" ]; then
            echo "::error::$PROVIDER provisioned but $SCRIPT is missing/not executable — refusing to leave resources unswept. Ship the sweeper before enabling this cloud's gate."
            exit 1
          fi
          # hetzner takes the cluster label as arg1; the managed sweepers read the scope
          # (ALETHIA_E2E_ENV / _PROJECT / _REGION) from the environment. Passing $E2E_CLUSTER is
          # harmless for the managed scripts (they ignore positional args).
          "$SCRIPT" "$E2E_CLUSTER"

      # ── WHY THIS RUNS LAST, and not before the apply (where it used to sit). ──
      #
      # It was placed early so a STALE TABLE would red in seconds rather than after a 50-minute
      # apply. That reasoning was sound and the placement stopped serving it: the bar also fails on
      # a CLOUD CEILING, and `dns-delegation` (#1773) is a ceiling on every cloud, so the step
      # failed on EVERY leg of EVERY night regardless of whether the table was stale. A gate that
      # always fails cannot fail fast on anything.
      #
      # What it cost is the whole point. A failed step skips the ones after it, so T2 never ran:
      # run 32688608048 recorded aws, gcp, azure and alibaba as `FAILED at stage 'queued'
      # (outcome=skipped)` — four clouds reported red on a night that never touched a cloud. That is
      # why #2382/#2383/#2384 and #2258/#2259/#2260 carry no cloud diagnosis, and why the mechanical
      # next in PROGRAMME.md (`aws/floor` — "needs a fresh run") was unreachable: a registrar action
      # nobody has taken was gating an unrelated proof dimension, indefinitely.
      #
      # THE VERDICT IS UNCHANGED. A ceiling is still a FAIL — that is the maintainer's ruling for the
      # investor benchmark ("a prospect cannot tell whose fault the click is"), and it still reds the
      # job from here. Nothing is widened and no ceiling is excused. Only the ORDER moves, so the
      # provisioning proof gets to run and record a real verdict before the bar reports on itself.
      #
      # `always()` so a red T2 does not skip the record; after the guaranteed teardown so it can
      # never delay a sweep. When #1773 and #2332 clear, moving this back above the apply restores
      # the fast-fail it was written for — and then it will mean something.
      - name: CLI-only demo bar (reachability — no cloud, no spend)
        if: always() && steps.gate.outputs.run == 'true' && vars.E2E_CLI_DEMO != ''
        env:
          ALETHIA_E2E_CLI_DEMO: ${{ vars.E2E_CLI_DEMO }}
          ALETHIA_E2E_CLI_BIN: ${{ vars.E2E_CLI_BIN }}
          ALETHIA_E2E_PROVIDER: ${{ matrix.provider }}
          # ── CEILING SATISFACTION PROBES (t2_cli_ceiling.go). ──
          #
          #    A CloudManual step records that no cloud API can reach it — a permanent fact. These
          #    inputs answer the OTHER question, which changes: has the human actually done it?
          #    Without them the bar FAILED on every cloud on every run with ZERO CLI gaps, on two
          #    ceilings that had both already been met (#1773 and #2332 are closed).
          #
          #    PRESENCE BOOLEANS, NEVER THE SECRET. `secrets.X != ''` renders the string "true" or
          #    "false", so the credential never enters a step that has no use for it. The probe
          #    demands TRUTHY rather than merely present precisely because "false" is what a
          #    MISSING secret renders — a presence check would read that as satisfied and silently
          #    retire a real requirement.
          ALETHIA_E2E_HETZNER_S3_KEYS_PRESENT: ${{ secrets.HETZNER_S3_ACCESS_KEY != '' && secrets.HETZNER_S3_SECRET_KEY != '' }}
          #    The zone NAME is not a secret, and the probe resolves it against the public internet
          #    rather than trusting this value — a zone we merely created answers with no NS set.
          ALETHIA_E2E_ACM_CERT_ZONE_NAME: ${{ vars.E2E_ACM_CERT_ZONE_NAME }}
          #    Both still OUTSTANDING, and correctly reported so: #1871's publisher binding does not
          #    exist, and the alibaba CR sweep RECURS after every full bar rather than retiring once.
          ALETHIA_E2E_GCP_BUDGET_PUBLISHER_GRANTED: ${{ vars.E2E_GCP_BUDGET_PUBLISHER_GRANTED }}
          ALETHIA_E2E_ALIBABA_CR_SWEPT: ${{ vars.E2E_ALIBABA_CR_SWEPT }}
        run: |
          set -euo pipefail
          if [ -z "${ALETHIA_E2E_CLI_BIN:-}" ]; then
            echo "::notice::E2E_CLI_BIN unset — building the CLI from this checkout"
            GOWORK=off go build -C apps/cli -o "$RUNNER_TEMP/alethia" .
            export ALETHIA_E2E_CLI_BIN="$RUNNER_TEMP/alethia"
          fi
          echo "::notice::CLI-only demo bar for ${ALETHIA_E2E_PROVIDER} using $ALETHIA_E2E_CLI_BIN"
          GOWORK=off go test -C test/e2e -tags=e2e_t2 . \
            -run TestT2CLIDemoReachability -count=1 -timeout 10m -v

      # ── Proof capture v2 (BYOC A0.4). Runs on ANY t2 outcome (always()) so a RED night is
      #    debuggable, not just a green one: it builds a structured, SCRUBBED proof bundle
      #    (verify receipt + provision summary + ArgoCD verdict + timings + destroy
      #    confirmation on success; the failure stage on a fail), routes everything through the
      #    A0.0 secret scrub, and FAILS this step if the finished bundle isn't grep-clean (so a
      #    leak reds the run instead of being uploaded — program invariant 2). It also writes
      #    the per-provider PASS/FAIL verdict to the job step summary. The runner wrote a
      #    host-usable kubeconfig to $HOME/.alethia/kubeconfig (read only on the success path). ──

  # ── A3.2 verdict rollup. The `provision` matrix is fail-fast:false, so every cloud runs to its
  #    own verdict; this fan-in job (always()) reads each leg's uploaded proof bundle, prints ONE
  #    5-row (hetzner/aws/gcp/azure/alibaba) PASS/FAIL/SKIP table to the run's step summary, and on
  #    ANY red opens a title-deduped tracking issue. Per-leg outcome is NOT available from a matrix
  #    `needs.*.result` (that's only the aggregate), so it is derived from each leg's
  #    provision-summary.json, cross-checked against that leg's JOB CONCLUSION.
  #
  #    The derivation lives in scripts/e2e/nightly-rollup.sh and is unit-tested there (#1613). It
  #    used to be inline here, keyed on a hardcoded artifact DIRECTORY PATH, and run 30341785056
  #    proved what that costs: aws provisioned for real, failed at `tofu plan`, and was reported as
  #    "SKIP — gate off, no secret/var wired" under the cloudless title "e2e nightly: job RED",
  #    while the parity ledger recorded nothing at all. Absence of a file is not evidence a cloud
  #    was never enabled, and that is now the script's job to know.
  #
  #    The `gh issue create` calls stay here, guarded to schedule/dispatch runs only (never a
  #    fork/PR — invariant 1; the job holds no cloud privilege regardless). They contain no logic:
  #    every title and body is rendered by the script, offline and under test. ──
  rollup:
    name: Nightly verdict rollup (5-cloud table + dedup issue)
    needs: [provision]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      # The fail-closed second source for "did this matrix job exist?". Enabled, failed, and gate-off
      # legs all emit an explicit summary; a matching job with no current-run summary is a reporting
      # failure rather than an inferred skip.
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Download all per-provider proof artifacts
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: e2e-proof-*-${{ github.run_id }}
          path: proofs
          merge-multiple: false
      # The run's own job conclusions — the independent fallback for a missing explicit summary.
      # Fetched into a file so the derivation stays pure and offline-testable. A failure here is NOT
      # fatal: the script degrades to proof-presence and says so loudly.
      - name: Fetch this run's job conclusions (existence cross-check)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs" --paginate --slurp \
            > "${RUNNER_TEMP}/run-jobs.json" \
            || echo "::warning::could not read this run's job list — the rollup will fall back to proof-presence only."

      - name: Roll up per-provider verdicts (+ dedup issue on red)
        env:
          GH_TOKEN: ${{ github.token }}
          MATRIX_RESULT: ${{ needs.provision.result }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PROOFS_DIR: proofs
          JOBS_JSON: ${{ runner.temp }}/run-jobs.json
          OUT_DIR: ${{ runner.temp }}/rollup
          # The provision job's $GITHUB_ENV does not cross the job boundary, so the dimension is
          # re-resolved here from the SAME script rather than a second copy of the cron comparison.
          EVENT: ${{ github.event_name }}
          DISPATCH_FULL: ${{ github.event.inputs.full_bar }}
          DISPATCH_DIMENSION: ${{ github.event.inputs.dimension }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          # The dimension is part of every red issue TITLE, which is the dedup key: keyed on the cloud
          # alone, the floor and the full bar collapse onto one issue and the second one filed is
          # silently dropped (#1755).
          E2E_DIMENSION="$(bash scripts/e2e/resolve-dimension.sh)"
          export E2E_DIMENSION
          echo "::notice::rollup dimension = ${E2E_DIMENSION}"
          # Derive. Everything below just POSTS what this wrote.
          bash scripts/e2e/nightly-rollup.sh
          cat "${OUT_DIR}/summary.md" >> "$GITHUB_STEP_SUMMARY"
          # shellcheck disable=SC1091
          . "${OUT_DIR}/state.env"

          # ── Standing coverage issue: ONE issue (not one per cloud) naming every inert leg and the
          #    exact var it needs, refreshed while the gap persists and closed automatically at full
          #    coverage. Schedule/dispatch only, same as the red-issue path below. Never fails the run:
          #    an unwired cloud is a deliberate no-op, and a red "not configured yet" nightly is how a
          #    signal gets trained into noise. ──
          #
          #    The dedup key is the `from:e2e-coverage` LABEL, not the title (#1958). This filer is
          #    the only thing that applies that label, so it is an identity, and `--label` is served
          #    live rather than from the search index — the same two reasons the red filer below
          #    stopped using `--search` in #1755.
          #
          #    The title CANNOT be the key here, unlike the red path's: it carries the counts
          #    ("1 of 5"), so it changes as coverage changes and can only ever be matched by a
          #    pattern. A pattern over a mutable field is not an identity — #1720 was hand-edited to
          #    "1 of 5 clouds IS not enabled" and the anchored `are` regex stopped matching it, which
          #    sent this branch to `gh issue create` and would have filed a duplicate every night.
          #    Under the label key a hand-edited title is now harmless: the refresh below restores it.
          #
          #    ⚠️ SCHEDULE ONLY — a DISPATCH CANNOT PRODUCE COVERAGE DATA, and used to overwrite it.
          #
          #    This branch previously also ran on `workflow_dispatch`. But a dispatch runs exactly ONE
          #    cloud by design — the matrix is derived from the `provider` input, and that input is a
          #    single choice with no "all" option. So the other four clouds have no matrix job;
          #    `job_exists` correctly returns `no` for each; and with no bundle either they fall
          #    through nightly-rollup.sh's final `else` to `status="SKIP"`. SKIP_N is therefore ALWAYS
          #    4 on a dispatch, whatever the gates actually say.
          #
          #    The consequence was not a cosmetic count. This filer REWRITES the standing issue body
          #    with a table of "cloud | needs <var>" rows, so dispatching one cloud republished #1720
          #    as "4 of 5 clouds are not enabled" and listed aws/gcp/azure/alibaba as needing gate
          #    variables that are all SET. That is the same failure the comment at
          #    nightly-rollup.sh:105 already records once — "the coverage issue (#1720) was refreshed
          #    with a body claiming a variable that IS set is unset" — arriving by a second route.
          #
          #    It matters more now than it did: driving a cloud one at a time is the documented
          #    enablement procedure (docs/testing/e2e-nightly-enablement.md step 3, "dispatch that
          #    cloud alone"), so the workflow corrupted the coverage board precisely when somebody was
          #    following the instructions for fixing coverage.
          #
          #    The red-issue path below deliberately KEEPS `workflow_dispatch`: a red on the one cloud
          #    that actually ran is a true statement about that cloud. Only the 5-cloud aggregate is
          #    unknowable from a single-provider run.
          if [ "$EVENT_NAME" = "schedule" ]; then
            open_cov="$(gh issue list --state open --limit 200 --label "$COV_LABEL" --json number \
              --jq '.[0].number // ""' 2>/dev/null || echo "")"
            if [ "$SKIP_N" -eq 0 ]; then
              if [ -n "$open_cov" ]; then
                gh issue close "$open_cov" --comment "All ${TOTAL} clouds are now enabled — every nightly leg provisions for real. Closing automatically." \
                  && echo "::notice::closed coverage issue #${open_cov} (full coverage)." || true
              fi
            elif [ -n "$open_cov" ]; then
              gh issue edit "$open_cov" --title "$COV_TITLE" --body-file "${OUT_DIR}/issue-body-coverage.md" \
                && echo "::notice::refreshed coverage issue #${open_cov}." || true
            else
              # LABEL what we file, for two distinct reasons. `from:e2e-coverage` is what the dedup
              # above reads — an unlabelled coverage issue is invisible to it and the NEXT night
              # files another one. The `class:`/`lane:`/`wave:` trio is what makes the unit visible
              # to scripts/claim-work.sh; #1720 was filed bare and sat unclaimable, the same way
              # #1259 did for nine nights before the red path was fixed.
              #
              # A create that lands WITHOUT the dedup label is the duplicate-every-night bug in slow
              # motion (a missing label in the repo makes `gh issue create` drop it), so it is
              # verified rather than assumed. `|| true` keeps a label outage from breaking the rollup;
              # the check below turns a silent partial success into a warning naming the consequence.
              #
              # The verification reads the NEW ISSUE DIRECTLY rather than re-running the `--label`
              # query above. A filtered list is index-backed and lags by seconds right after a write
              # — measured while building this — so re-querying it here would emit a false warning on
              # a perfectly good create. `gh issue view` is a direct object read and cannot lag.
              # A warning nobody can trust is how this file's own comments describe a signal being
              # trained into noise, and the fix must not reintroduce that.
              cov_url="$(gh issue create --title "$COV_TITLE" --body-file "${OUT_DIR}/issue-body-coverage.md" \
                --label "$COV_LABEL" --label class:backend --label lane:tests --label wave:hygiene 2>/dev/null || echo "")"
              if [ -z "$cov_url" ]; then
                echo "::warning::could not create the coverage issue (continuing)."
              else
                echo "::notice::filed coverage issue: ${COV_TITLE} (${cov_url})"
                if ! gh issue view "$cov_url" --json labels --jq '.labels[].name' \
                     | grep -Fxq "$COV_LABEL"; then
                  echo "::warning::${cov_url} is NOT carrying '${COV_LABEL}' — the dedup above cannot see it, so the next run will file ANOTHER coverage issue. Create the label in the repo."
                fi
              fi
            fi
          fi

          # Dedup tracking issue on ANY red — schedule/dispatch runs only.
          if [ -z "${REDS// /}" ]; then
            echo "::notice::nightly rollup all-green (no FAIL legs) — no issue filed."
            exit 0
          fi
          if [ "$EVENT_NAME" != "schedule" ] && [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "::warning::red legs (${REDS}) but event=${EVENT_NAME} — skipping issue creation (schedule/dispatch only)."
            exit 0
          fi
          # The dedup CANDIDATES are EVERY open issue, not a label-narrowed slice (#2257). History,
          # in two steps:
          #   #1755 replaced `--search` with `--label` because a fuzzy search misses an issue that
          #   plainly exists — the exact open title of #1754 (`fix(e2e): full-bar DNS fixture …`)
          #   returns nothing, because `fix(e2e):` parses as a qualifier. That reasoning was right.
          #   But ANDing three labels made the dedup key MUTABLE, and a mutable key is not an
          #   identity. On 2026-08-09T09:48:26Z the open reds were re-waved `wave:hygiene` →
          #   `wave:e2e-green` during triage; the next night's dedup could no longer see them and
          #   refiled all three (#2059/#2060/#2061 → #2258/#2259/#2260).
          # The title is the designed key here and — unlike the coverage filer's, which carries
          # mutable counts — it is stable: `e2e nightly: <cloud> RED (<dimension>)`. So match it
          # across all open issues. `--limit 200` + an exact string compare is cheap, and `gh issue
          # list` is served live rather than from the search index, so it cannot miss an issue filed
          # minutes ago. Nothing a triager does to labels can hide a candidate from this.
          open_reds="${RUNNER_TEMP}/open-red-issues.json"
          gh issue list --state open --limit 200 \
            --json title >"$open_reds" 2>/dev/null || echo '[]' >"$open_reds"

          for cloud in $REDS; do
            title="$(cat "${OUT_DIR}/issue-red-${cloud}.title")"
            existing="$(jq --arg t "$title" '[.[] | select(.title == $t)] | length' "$open_reds" 2>/dev/null || echo 0)"
            if [ "${existing:-0}" -gt 0 ]; then
              echo "::notice::an open issue titled '${title}' already exists — skipping create (deduped)."
              continue
            fi
            # LABEL what we file. An unlabelled issue is invisible to scripts/claim-work.sh (which
            # filters on class:), so a bot-filed red sat unclaimable and unworked — #1259 went nine
            # nights that way. These three exist in the repo's label set; the `||` below still keeps a
            # label problem from breaking the rollup.
            # `from:e2e-nightly` is this filer's IDENTITY — nothing else applies it, so it stays a
            # true marker however the wave/class labels are later re-triaged. The dedup above keys
            # on the title across ALL open issues and does not depend on it; this is what lets
            # tooling ask "which reds did the nightly file?" without guessing at a title shape.
            gh issue create --title "$title" --body-file "${OUT_DIR}/issue-red-${cloud}.md" \
              --label class:backend --label lane:tests --label wave:hygiene --label from:e2e-nightly \
              && echo "::notice::filed tracking issue: ${title}" \
              || echo "::warning::could not create issue '${title}' (continuing)."
          done

      # ── Provisioning-parity ledger append (P2-F, #1068). Every scheduled/dispatched run auto-records
      #    one append-only row PER LEG THAT RAN into demos/proofs/provisioning-e2e-log.md, via the
      #    scripts/e2e/provisioning-e2e.sh RECORD_ONLY path (the same engine the parity board uses) —
      #    verdict derived from each leg's provision-summary.json (success⇒PASS, else FAIL), dimension
      #    from the same full-bar resolution as the provision job (full vs floor). Gate-off legs produced
      #    no bundle (nothing ran) so they contribute no row. The updated ledger is uploaded as an
      #    artifact for a maintainer to commit — CI never pushes to the repo.
      #
      #    Rows come from the rollup script's ledger.tsv, NOT from a second copy of the discovery
      #    join. That duplicate join is why run 30341785056 appended nothing at all while the aws
      #    leg had really failed at `tofu plan` — the parity ledger's last row was six days old and
      #    nothing said otherwise (#1613). One discovery, one answer, both consumers. ──
      - name: Append provisioning-e2e ledger rows (RECORD_ONLY)
        env:
          OUT_DIR: ${{ runner.temp }}/rollup
        run: |
          set -uo pipefail
          # The dimension comes from the rollup's own state.env — the SAME value that titled the
          # issues one step above, so a ledger row and its tracking issue can never disagree about
          # which dimension failed. This used to be a third hand-written copy of the cron comparison
          # (#1755), the same duplicate-discovery mistake #1613 removed from the row derivation.
          # shellcheck disable=SC1091
          . "${OUT_DIR}/state.env"
          dim="${DIMENSION:-floor}"
          sha="$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
          if [ ! -s "${OUT_DIR}/ledger.tsv" ]; then
            echo "::notice::no leg produced a ledger row (nothing ran) — ledger unchanged."
            exit 0
          fi
          while IFS="$(printf '\t')" read -r p v detail bundle; do
            [ -n "$p" ] || continue
            RECORD_ONLY=1 RECORD_VERDICT="$v" RECORD_BUNDLE="$bundle" \
              RECORD_DETAIL="$detail" RECORD_SHA="$sha" \
              ./scripts/e2e/provisioning-e2e.sh "$p" "$dim" \
              || echo "::warning::ledger RECORD_ONLY failed for ${p}/${dim} (continuing)."
          done < "${OUT_DIR}/ledger.tsv"
          echo "::notice::appended provisioning-e2e ledger rows (dimension=${dim}) — upload for a maintainer to commit."

      - name: Upload updated provisioning-e2e ledger
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: provisioning-e2e-log-${{ github.run_id }}
          path: demos/proofs/provisioning-e2e-log.md
          if-no-files-found: warn
          retention-days: 30

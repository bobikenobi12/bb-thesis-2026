name: Branch flow guard

# Enforce the promotion flow: feature → dev → staging → main.
# A PR into `main` may only come from `staging` (or a `hotfix/*` branch); a PR into `staging` only from
# `dev` (or `hotfix/*`). Feature branches must target `dev` (which has no ruleset requiring this check).
# This job is wired as a REQUIRED status check on the main + staging rulesets (infra/github), so a
# mis-targeted PR (e.g. an agent opening feature → main) gets a red required check and is un-mergeable.

on:
  pull_request:
    branches: [main, staging]

# A superseded run is not evidence about the head of the branch, and while it keeps a runner it is
# denying one to the run that is. `ci.yml` and `addon-render-determinism.yml` have carried this
# since they were written; these seven did not, and the gap only became expensive when the queue
# started landing PRs faster than a run takes to finish.
#
# MEASURED 2026-09-02 19:2xZ, with the dev queue draining: 48 runs queued against 2 in progress,
# and the single largest group was 23 runs headed `dev` — the standing `dev → staging` promotion
# PR #3562, which re-triggers every `pull_request` workflow on EVERY merge into dev. `CI` had
# already cancelled its own superseded runs and showed 1; these seven each showed a full stack.
#
# Scoped to `github.ref`, so this only ever cancels an OLDER run of the SAME workflow on the SAME
# PR or branch — the ordinary "I pushed again" case. It cannot cancel a run for a different ref.
concurrency:
  group: branch-flow-guard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  branch-flow-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce promotion source
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          # release-please opens its release PRs directly against main/staging
          # (release-please--branches--<base>--…) by design — they only bump the manifest + changelog
          # and cut the tag, so they're exempt from the promotion-source rule. Without this the guard
          # (a required check on protect-main) would make every release PR un-mergeable.
          case "$HEAD" in
            release-please--*) echo "OK: release-please PR '$HEAD' → '$BASE' (exempt)."; exit 0 ;;
          esac
          case "$BASE" in
            main)    allowed="staging" ;;
            staging) allowed="dev" ;;
            *)       echo "guard not applicable to base '$BASE'"; exit 0 ;;
          esac
          is_hotfix=false
          case "$HEAD" in hotfix/*) is_hotfix=true ;; esac
          if [ "$HEAD" = "$allowed" ] || [ "$is_hotfix" = true ]; then
            echo "OK: '$HEAD' → '$BASE' is an allowed promotion."
            exit 0
          fi
          echo "::error::PRs into '$BASE' must come from '$allowed' (or a hotfix/* branch), not '$HEAD'."
          echo "::error::The flow is feature → dev → staging → main. For feature work, target 'dev'."
          exit 1
